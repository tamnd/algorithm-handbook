groups:
  - title: Incompressibility and the pressure
    intro: >
      In an incompressible flow the pressure has no equation of its own: it is whatever keeps the velocity
      free of divergence. The Helmholtz-Hodge decomposition makes this precise and is the basis of the
      projection method. In 2D the vorticity-streamfunction form removes the pressure altogether; artificial
      compressibility gives it a time derivative instead; the marker-and-cell method puts the projection on a
      staggered grid with a free surface.
    entries:
      - helmholtz-hodge-decomposition
      - vorticity-streamfunction-formulation
      - chorin-projection-method
      - artificial-compressibility-method
      - marker-and-cell-method

  - title: Pressure-velocity coupling on finite volumes
    intro: >
      Engineering codes solve the momentum equations and a pressure correction equation in turn. SIMPLE
      iterates them to a steady state with under-relaxation, PISO adds a second correction so that a transient
      step needs no outer loop, and Rhie-Chow interpolation lets both run on a grid where pressure and velocity
      share the cell centers.
    entries:
      - simple-algorithm
      - piso-algorithm
      - rhie-chow-interpolation

  - title: Interfaces and immersed bodies
    intro: >
      A free surface or the boundary between two fluids moves with the flow and carries surface tension. Volume
      of fluid stores the fraction of each cell that is filled and rebuilds the interface as a plane in each
      cell; the continuum surface force model turns surface tension into a body force. The immersed boundary
      method and front tracking carry the interface on its own moving points and spread its forces to a fixed
      grid.
    entries:
      - volume-of-fluid-method
      - piecewise-linear-interface-calculation
      - continuum-surface-force
      - immersed-boundary-method
      - front-tracking-method

  - title: Turbulence and its scales
    intro: >
      Kolmogorov's 1941 theory predicts how energy is spread over the eddies of a turbulent flow and how small
      the smallest eddies are. Those scales set the cost of a direct numerical simulation, which resolves every
      eddy and is therefore limited to moderate Reynolds numbers.
    entries:
      - kolmogorov-1941-theory
      - direct-numerical-simulation

  - title: Reynolds-averaged models
    intro: >
      Averaging the Navier-Stokes equations gives equations for the mean flow with one unknown term, the
      Reynolds stress. The Boussinesq hypothesis models it by an eddy viscosity, and the models here differ in
      how they compute that viscosity: by an algebraic mixing length, by one transport equation, or by two.
      Wall functions bridge the thin layer next to a wall. All of these are models, calibrated and judged by
      measurement.
    entries:
      - reynolds-averaged-navier-stokes
      - boussinesq-eddy-viscosity
      - mixing-length-model
      - k-epsilon-model
      - k-omega-model
      - k-omega-sst-model
      - spalart-allmaras-model
      - wall-functions

  - title: Large eddy simulation
    intro: >
      Large eddy simulation resolves the large eddies and models only the small ones, whose behaviour K41
      suggests is more universal. The Smagorinsky model gives the small eddies an eddy viscosity with one
      constant; the dynamic model computes that constant from the resolved field as the run goes.
    entries:
      - large-eddy-simulation
      - smagorinsky-model
      - dynamic-subgrid-model

  - title: Lattice Boltzmann methods
    intro: >
      The lattice Boltzmann method does not discretize the Navier-Stokes equations. It streams a few particle
      populations between lattice nodes and relaxes them toward a local equilibrium, and the flow it produces
      at low Mach number obeys Navier-Stokes. The entries give the BGK collision, the bounce-back wall, the
      Chapman-Enskog expansion that derives the viscosity, and collision in moment space.
    entries:
      - lattice-boltzmann-method
      - bgk-collision-operator
      - bounce-back-boundary-condition
      - chapman-enskog-expansion
      - multiple-relaxation-time-lattice-boltzmann

  - title: Smoothed particle hydrodynamics
    intro: >
      SPH follows the fluid with particles and computes density and forces by kernel sums over neighbours. The
      kernel sets the accuracy, Monaghan's artificial viscosity lets the method capture shocks, and
      incompressible SPH replaces the stiff equation of state by a pressure Poisson equation on the particles.
    entries:
      - smoothed-particle-hydrodynamics
      - sph-smoothing-kernel
      - monaghan-artificial-viscosity
      - incompressible-sph
