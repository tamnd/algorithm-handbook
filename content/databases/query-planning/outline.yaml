# The order of chapter 40.4, Query planning. Groups are read in order; entries in a group too.
# Only the written entries are listed.
groups:
  - title: Plans, sizes and rewrites
    intro: >
      A [query plan](/query-plan/) is a tree of operators, each with an algorithm and an access path. The
      number of join trees grows fast: $n!$ left-deep trees and $(2n-2)!/(n-1)!$ bushy ones for $n$
      relations. The size of each intermediate result is estimated from [selectivities](/selectivity/),
      under assumptions of uniformity and independence that real data often break. The first rewrite of
      almost every optimizer is [predicate pushdown](/predicate-pushdown/), which applies filters as early
      as the algebra allows.
    entries:
      - query-plan
      - selectivity
      - predicate-pushdown

  - title: Costs and the search problems
    intro: >
      A [cost model](/cost-model/) turns a plan and its size estimates into one number, such as page I/Os
      with a weight for CPU work, or $C_{\mathrm{out}}$, the sum of the intermediate result sizes. With a
      cost model fixed, [join ordering](/join-ordering/) is NP-hard in general, and the wider
      [query optimization problem](/query-optimization/) adds the choice of algorithms, access paths and
      rewrites.
    entries:
      - cost-model
      - join-ordering
      - query-optimization

  - title: Statistics and the System R search
    intro: >
      A [histogram](/histogram/) summarizes one column in a few buckets; equi-depth buckets bound the
      error of a range estimate by the size of one bucket, and the V-optimal histogram is found by a
      dynamic program. [System R join enumeration](/selinger-join-enumeration/) is the dynamic program over
      subsets of relations that most optimizers still follow, with interesting orders and no cross
      products.
    entries:
      - histogram
      - selinger-join-enumeration

  - title: Hard estimates and stored views
    intro: >
      [Cardinality estimation](/cardinality-estimation/) is where optimizers fail most: errors multiply
      along a chain of joins, and the measured errors on real queries reach several orders of magnitude.
      [View selection](/view-selection/) chooses which [materialized views](/materialized-view/) to keep
      under a space budget; the greedy algorithm on the lattice of a data cube is within $1 - 1/e$ of the
      best benefit.
    entries:
      - cardinality-estimation
      - view-selection
