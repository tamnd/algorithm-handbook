# The order of chapter 40.2. Groups are read in order; entries in a group too.
groups:
  - title: Pages, files and the buffer pool
    intro: >
      A table lives on disk as a file of fixed-size pages. A [slotted page](/slotted-page/) holds
      records of any length and names each one by (page, slot), so records can move inside the page;
      a [heap file](/heap-file/) is an unordered set of such pages. The [buffer pool](/buffer-pool/)
      keeps a fixed number of pages in memory, and the five-minute rule and DBMIN say how much
      memory to buy and how to share it among queries.
    entries:
      - slotted-page
      - heap-file
      - buffer-pool
      - five-minute-rule
      - dbmin

  - title: Rows, columns and compression
    intro: >
      A table can be stored row by row, column by column, or by column inside each page. The
      [N-ary storage model](/n-ary-storage-model/) makes a whole record cheap, the
      [decomposition storage model](/decomposition-storage-model/) makes a scan of a few columns
      cheap, and PAX keeps the I/O of the first with the cache behavior of the second. Column stores
      compress each column with codes that a filter can test without decoding, and they fetch the
      other columns of a row only at the end.
    entries:
      - n-ary-storage-model
      - decomposition-storage-model
      - pax-page-layout
      - dictionary-encoding
      - frame-of-reference-encoding
      - late-materialization

  - title: Access paths and their order
    intro: >
      An index helps a query only as much as the table pages it saves. A sparse index needs a file
      sorted on its key; a clustered index keeps the rows in key order, so a range reads few pages; a
      covering index answers a query without the table at all; and a partial index covers only the
      rows that the queries ask for.
    entries:
      - dense-and-sparse-index
      - clustered-index
      - covering-index
      - partial-index

  - title: Building and generalizing B+ trees
    intro: >
      Bulk loading builds a B+ tree from sorted entries in one pass, with full nodes. The prefix
      B-tree stores shorter separators and so gets a larger fanout on string keys. The GiST turns the
      B+ tree into a template whose keys are predicates, with the R-tree as another instance, and the
      Bw-tree changes pages by compare-and-swap instead of latches.
    entries:
      - bulk-loading-b-tree
      - prefix-b-tree
      - generalized-search-tree
      - bw-tree

  - title: Indexes for analytic scans
    intro: >
      Analytic queries read large parts of a table. Bitmap indexes answer selections with word-wide
      AND and OR, and the word-aligned hybrid code runs those operations on the compressed bitmaps.
      Zone maps let a scan skip blocks whose range of values misses the predicate, and a join index
      stores the result of a join as pairs of row ids.
    entries:
      - bitmap-index
      - word-aligned-hybrid-compression
      - zone-map
      - join-index

  - title: Adaptive and learned indexes
    intro: >
      Two research lines change how an index is built. Database cracking and adaptive merging build
      the index as a side effect of the queries, by partitioning and by merging sorted runs. A
      learned index replaces the upper levels of a tree with a model of the key distribution and a
      stored error bound; the PGM-index makes the bound a guarantee, and ALEX accepts inserts.
    entries:
      - database-cracking
      - adaptive-merging
      - learned-index
      - pgm-index
      - alex-learned-index

  - title: Choosing indexes
    intro: >
      Each index speeds up some queries and slows every update. Choosing a set of indexes for a
      workload under a space budget is NP-hard. Tools ask the optimizer what each candidate would
      save, without building it, and grow a configuration greedily from those estimates.
    entries:
      - index-selection
      - what-if-index-analysis
      - autoadmin-index-selection
