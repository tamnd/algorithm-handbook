# The order of chapter 40.5, Transactions and concurrency control. Groups are read in order; entries in a group too.
groups:
  - title: Transactions and what correct means
    intro: >
      A transaction is a unit of work with the four [ACID properties](/acid-properties/). A
      [schedule](/transaction-schedule/) interleaves the actions of several transactions and keeps the order
      inside each one. Isolation is made precise by [serializability](/serializability/): a schedule is
      correct when it is equivalent to some serial one. Final-state, view and conflict equivalence give three
      nested classes.
    entries:
      - acid-properties
      - transaction-schedule
      - serializability

  - title: Schedules that survive an abort
    intro: >
      Serializability says nothing about aborts. A [recoverable schedule](/recoverable-schedule/) never lets
      a transaction commit before the ones it read from, a [cascadeless](/cascadeless-schedule/) one reads only
      committed values, and a [strict](/strict-schedule/) one also never overwrites an uncommitted value, so
      that undo can restore a before image. Each class is strictly inside the one before.
    entries:
      - recoverable-schedule
      - cascadeless-schedule
      - strict-schedule

  - title: Testing a schedule
    intro: >
      Two actions conflict when they come from different transactions, touch the same item and at least one
      writes. The [conflict graph](/conflict-graph/) has an edge for each such pair, in schedule order, and
      the [serializability theorem](/serializability-theorem/) says that a schedule is
      [conflict serializable](/conflict-serializability/) exactly when that graph is acyclic.
      [View serializability](/view-serializability/) keeps only the reads-from relation and the final writes.
      It accepts more schedules, but testing it is [NP-complete](/view-serializability-np-completeness/).
    entries:
      - conflict-graph
      - conflict-serializability
      - serializability-theorem
      - view-serializability
      - view-serializability-np-completeness

  - title: Locking
    intro: >
      The [concurrency control problem](/concurrency-control/) asks for a scheduler that runs, delays or
      rejects each action so that the output is serializable and recoverable. [Two-phase locking](/two-phase-locking/)
      takes no lock after its first unlock, and the [two-phase locking theorem](/two-phase-locking-theorem/)
      proves its schedules conflict serializable, in the order of the lock points. The strict and conservative
      forms add recoverability or remove deadlock; the [lock table](/lock-table/) implements them; wait-die and
      wound-wait prevent deadlock by age. The last two entries lock a hierarchy of granules and a tree of items.
    entries:
      - concurrency-control
      - two-phase-locking
      - two-phase-locking-theorem
      - strict-two-phase-locking
      - lock-table
      - conservative-two-phase-locking
      - wait-die-and-wound-wait
      - multiple-granularity-locking
      - tree-locking-protocol

  - title: Phantoms
    intro: >
      The [phantom problem](/phantom-problem/) shows that row locks are not enough when a query reads a
      condition: a new row that matches it was never locked. [Predicate locking](/predicate-locking/) cures it
      exactly by locking the condition itself, and [key-range locking](/key-range-locking/) is the practical form
      on an ordered index, where a lock on a key also covers the gap below it.
    entries:
      - phantom-problem
      - predicate-locking
      - key-range-locking

  - title: Schedulers without locks
    intro: >
      [Optimistic concurrency control](/optimistic-concurrency-control/) validates read sets at commit, and
      [Silo](/silo-concurrency-control/) makes that validation fast on a multicore machine.
      [Timestamp ordering](/timestamp-ordering/) aborts any action that arrives too late for its timestamp, and
      the [Thomas write rule](/thomas-write-rule/) skips obsolete writes. [Multiversion concurrency control](/multiversion-concurrency-control/)
      keeps old versions so that reads need not wait, and [multiversion serializability](/multiversion-serializability/)
      says when its schedules are correct.
    entries:
      - optimistic-concurrency-control
      - silo-concurrency-control
      - timestamp-ordering
      - thomas-write-rule
      - multiversion-concurrency-control
      - multiversion-serializability

  - title: Weak isolation
    intro: >
      Real systems offer [isolation levels](/isolation-levels/) weaker than serializability, each defined by
      the [anomalies](/transaction-anomalies/) it forbids. [Snapshot isolation](/snapshot-isolation/) forbids
      most of them but allows [write skew](/write-skew/). [Adya's levels](/adya-isolation-levels/) define the
      levels by cycles in a dependency graph, and in those terms the [dangerous structure theorem](/snapshot-isolation-dangerous-structure/)
      finds two consecutive read-write edges in every cycle that snapshot isolation allows.
      [Serializable snapshot isolation](/serializable-snapshot-isolation/) aborts a possible pivot of such a
      structure; [robustness](/robustness-against-weak-isolation/) asks when a workload needs no such help.
    entries:
      - isolation-levels
      - transaction-anomalies
      - write-skew
      - snapshot-isolation
      - adya-isolation-levels
      - snapshot-isolation-dangerous-structure
      - serializable-snapshot-isolation
      - robustness-against-weak-isolation

  - title: Beyond the classical model
    intro: >
      The last group changes the rules of the game. [Commitment ordering](/commitment-ordering/) commits in the
      order of the conflicts, which makes serializability compose across databases.
      [Transaction chopping](/transaction-chopping/) splits known programs into pieces that commit one by one
      and stay serializable. [Sagas](/sagas/) give up isolation for long-lived work and undo with compensating
      transactions, and the [escrow method](/escrow-transactional-method/) lets many transactions update one
      counter at once while every outcome keeps its bounds.
    entries:
      - commitment-ordering
      - transaction-chopping
      - sagas
      - escrow-transactional-method
