# The order of chapter 40.6, Logging and recovery. Groups are read in order; entries in a group too.
# Only the written entries are listed.
groups:
  - title: The problem and the buffer choices
    intro: >
      A crash erases main memory and keeps the disk. The [crash recovery problem](/crash-recovery/) asks
      for a restart that leaves on disk the effects of exactly the transactions that committed. How much
      work that takes depends on the buffer manager: the [steal and force policies](/steal-and-force-policies/)
      decide whether uncommitted changes may reach the disk, which needs undo, and whether commit writes
      every changed page, which saves redo.
    entries:
      - crash-recovery
      - steal-and-force-policies

  - title: Two ways to make updates atomic
    intro: >
      [Shadow paging](/shadow-paging/) never overwrites a page in use: a transaction writes new copies and
      commits by switching one root pointer, so no log of page contents is needed. The
      [write-ahead log](/write-ahead-logging/) updates in place and logs each change before the page it
      changes, and the whole transaction before its commit returns. Recovery then redoes and undoes from
      the log.
    entries:
      - shadow-paging
      - write-ahead-logging

  - title: Keeping the log cheap
    intro: >
      [Checkpointing](/checkpointing/) writes the recovery tables to the log and names them in a master
      record, so that restart reads only a bounded tail of the log. [Group commit](/group-commit/) makes
      one log write durable for the commit records of many transactions, so that the commit rate is not
      bounded by one device write per transaction.
    entries:
      - checkpointing
      - group-commit

  - title: The full algorithm
    intro: >
      [ARIES](/aries-recovery/) puts the pieces together in three passes. Analysis rebuilds the
      transaction and dirty page tables from the last checkpoint, redo repeats history from the smallest
      recLSN, and undo rolls back the losers and logs a compensation record for each change it undoes. It
      is correct under the WAL rule and its other rules, also when the system crashes again during
      recovery.
    entries:
      - aries-recovery
