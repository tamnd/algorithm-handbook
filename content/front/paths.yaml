  - id: quantum
    title: Quantum
    for: a student who knows linear algebra over the complex numbers, modular arithmetic and a little probability, and wants to see what a quantum computer computes, which of its speedups are proved and in which model, and how factoring, search and the simulation of physics are done on one.
    intro: >
      The path starts with the model: qubits, the tensor product, unitary gates and measurement by the Born rule,
      and the circuit model with a universal gate set, in which every later cost is counted. Entanglement and the
      no-cloning theorem come next, with teleportation, mixed states and the measures of distance between states.
      The oracle problems of Deutsch and Jozsa, Bernstein and Vazirani and Simon show the first separations, all in
      the query model, and lead to the quantum Fourier transform and phase estimation. Search follows: Grover's
      algorithm, amplitude amplification and the matching Omega(sqrt N) lower bound, which is a bound on queries, not
      on gates, then counting, minimum finding and the walk-based algorithms for element distinctness and triangle
      finding. Shor's algorithm reduces factoring to order finding, and the same idea solves discrete logarithms and
      Pell's equation; polynomial time on a quantum computer says nothing proved about classical hardness, and the
      qubit counts of resource estimates depend on a hardware model. Simulation of physics is the next stage, from
      Trotter product formulas and their error bounds to block encodings and qubitization, and then its uses in
      chemistry and many-body physics, where variational methods are only measured. The path ends with error
      correction, the stabilizer formalism and the threshold theorem, which holds under its own noise model.
    stages:
      - title: States, gates and measurement
        steps:
