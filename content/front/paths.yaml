  - id: compression-and-coding
    title: Compression and coding
    for: a student who knows basic probability and arithmetic modulo 2 and wants to see how data is made smaller, how errors are detected and how they are corrected, and what limits each method.
    intro: >
      Information first: the entropy of a source and why no code can beat it on average. Then the coders that come
      close to it, from Huffman's code to arithmetic coding and asymmetric numeral systems, and the dictionary
      methods of Lempel and Ziv that learn their model from the data, as DEFLATE and its successors do. The
      transforms come next: runs and differences, the Burrows-Wheeler transform for text and the cosine transform
      for images, where lossy coding begins. The second half turns to noisy channels: checksums and CRCs that
      detect errors, then linear codes, the bounds that limit them, and the Reed-Solomon, LDPC and polar codes that
      correct errors in practice. Each method on the way names its source model or its channel.
