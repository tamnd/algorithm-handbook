  - id: statistics-and-inference
    title: Statistics and inference
    for: a student who knows probability (random variables, expectation, variance, the law of large numbers and the central limit theorem), some linear algebra and least squares, and wants to see how data become estimates, tests and intervals, and which of their guarantees are exact in finite samples, which hold only as the sample grows, and which rest on assumptions that the data cannot check.
    intro: >
      The path starts with estimators judged by their sampling distributions: bias, variance and mean squared error,
      the likelihood and maximum likelihood, and the Cramer-Rao bound and the Rao-Blackwell theorem, which hold for
      every sample size, against consistency and asymptotic normality, which hold only in the limit. Tests and
      intervals come next. A p-value is the probability, computed under the null hypothesis, of a statistic at least
      as extreme as the one observed; it is not the probability that the null is true. Some tests are exact, such as
      the binomial test, and the t-test under normal data; many are asymptotic, such as the chi-squared,
      Wald and likelihood ratio tests. Multiple testing closes the stage. Resampling, ranks and robust estimation
      follow: the permutation test and conformal prediction are exact under exchangeability, the bootstrap only
      asymptotically. Regression gives the Gauss-Markov theorem and the exact F-test under their assumptions, the
      sandwich standard errors that are only asymptotic, and generalized linear models; survival analysis adds
      censoring and the Cox model, which assumes proportional hazards. The Bayesian stage reads the posterior as the
      answer, with Markov chain Monte Carlo to compute it, whose draws reach the posterior only in the limit. Time
      series assume stationarity, and sequential tests built on Ville's inequality stay valid at any stopping time.
      The path ends with experiments and causal effects, identified by randomization or else only under unconfoundedness
      and the other assumptions each design names.
    stages:
      - title: Estimators and likelihood
        intro: >
          An estimator is a random variable, and everything said about it is a statement about its sampling
          distribution. Unbiasedness, the Cramer-Rao bound and the Rao-Blackwell theorem are exact for each n;
          consistency, Slutsky's theorem, the asymptotic normality of the MLE and the delta method are limits.
        steps:
          - random-variable
          - variance
          - law-of-large-numbers
          - central-limit-theorem
          - entry: estimator
            why: a rule computed from the sample, judged by the distribution of its values over repeated samples.
          - sampling-distribution
          - estimator-bias
          - sample-variance
          - standard-error
          - mean-squared-error
          - entry: welford-algorithm
            why: the mean and variance in one stable pass, without the cancellation of the textbook formula.
          - consistent-estimator
          - likelihood-function
          - maximum-likelihood-estimation
          - kullback-leibler-divergence
          - score-function
          - fisher-information-matrix
          - entry: cramer-rao-bound
            why: under regularity conditions, a lower bound on the variance of every unbiased estimator at every sample size.
          - sufficient-statistic
          - rao-blackwell-theorem
          - slutsky-theorem
          - entry: asymptotic-normality-of-mle
            why: the MLE is approximately normal with the inverse Fisher information as variance, a limit as n grows, not a finite-sample law.
          - delta-method
      - title: Tests and intervals
        intro: >
          A test bounds the chance of rejecting a true null, and an interval covers the parameter with a stated
          probability over repeated samples, not with that probability for the one interval computed. Each test
          below is marked by whether its null law is exact or only asymptotic, and under which model.
        steps:
          - statistical-hypothesis-test
          - type-i-and-type-ii-errors
          - entry: p-value
            why: the probability under the null of a statistic at least as extreme as the one observed, not the probability that the null is true.
          - statistical-power
          - binomial-distribution
          - entry: binomial-test
            why: an exact test for every n, from the binomial law itself.
          - z-test
          - entry: student-t-test
            why: exact under normal independent data; for other data its level holds only as n grows.
          - confidence-interval
          - t-confidence-interval
          - pivotal-quantity
          - entry: clopper-pearson-interval
            why: coverage at least the nominal level for every n and p, at the price of being conservative.
          - wilson-score-interval
          - chi-squared-goodness-of-fit-test
          - neyman-pearson-lemma
          - likelihood-ratio-test
          - entry: wilks-theorem
            why: twice the log likelihood ratio is asymptotically chi-squared under regularity, for nested models with the true value inside the parameter space.
          - wald-test
          - multiple-comparisons-problem
          - family-wise-error-rate
          - union-bound
          - entry: bonferroni-correction
            why: the union bound keeps the family-wise error rate at most alpha under any dependence.
          - false-discovery-rate
          - entry: benjamini-hochberg-procedure
            why: controls the false discovery rate at q when the null p-values are independent; under arbitrary dependence it needs a correction.
      - title: Resampling, ranks and robustness
        intro: >
          Methods that assume little about the law of the data. The DKW inequality and the rank and permutation tests
          give finite-sample guarantees, the latter two under exchangeability of the data under the null; the
          bootstrap is justified only asymptotically. Robust estimators trade some efficiency for a bounded influence of
          bad points.
        steps:
          - order-statistic
          - median
          - quantile
          - empirical-distribution-function
          - entry: dkw-inequality
            why: a bound on the uniform distance between the empirical and the true distribution function that holds for every n.
          - kolmogorov-smirnov-test
          - entry: permutation-test
            why: exact level for any sample size when the data are exchangeable under the null.
          - wilcoxon-signed-rank-test
          - entry: bootstrap-method
            why: resamples the data to approximate a sampling distribution, a method justified as n grows, not for a fixed small n.
          - bootstrap-percentile-interval
          - prediction-interval
          - entry: conformal-prediction
            why: prediction sets with coverage at least 1 - alpha in finite samples, assuming only exchangeable data.
          - split-conformal-prediction
          - huber-contamination-model
          - breakdown-point
          - influence-function
          - m-estimator
          - huber-m-estimator
      - title: Regression and survival
        intro: >
          The linear model with its exact results under stated assumptions, Gauss-Markov for uncorrelated errors of
          equal variance and the F-test for normal errors, then the diagnostics and the asymptotic standard errors
          that relax them, and generalized linear models fitted by iteratively reweighted least squares. Inference after
          a data-driven choice of model needs its own theory. Survival data add censoring; the Kaplan-Meier estimator
          assumes censoring independent of the event, and the Cox model assumes proportional hazards.
        steps:
          - least-squares-problem
          - linear-regression
          - qr-decomposition
          - ordinary-least-squares
          - entry: gauss-markov-theorem
            why: in a linear model with uncorrelated errors of equal variance, OLS has the least variance among linear unbiased estimators, for every n.
          - regression-f-test
          - heteroscedasticity
          - entry: heteroscedasticity-consistent-standard-errors
            why: the sandwich standard errors, valid without equal variances but only asymptotically.
          - weighted-least-squares
          - generalized-linear-model
          - fisher-scoring
          - iteratively-reweighted-least-squares
          - akaike-information-criterion
          - entry: post-selection-inference
            why: p-values and intervals computed after the data chose the model lose their stated level unless the selection is accounted for.
          - survival-function
          - censoring
          - hazard-function
          - kaplan-meier-estimator
          - log-rank-test
          - entry: cox-proportional-hazards-model
            why: regression on the hazard under the assumption that hazard ratios are constant in time.
          - cox-partial-likelihood
          - schoenfeld-residuals
      - title: Bayesian inference
        intro: >
          The posterior is the answer, and estimators and intervals are read from it. Decision theory ties it to the
          earlier stages, through Bayes estimators and the James-Stein estimator. Markov chain Monte Carlo computes
          posteriors that have no closed form; its draws come from the posterior only in the limit, and diagnostics can
          show that a run has not converged, never that it has.
        steps:
          - statistical-decision-theory
          - bayes-theorem
          - bayesian-inference
          - conjugate-prior
          - credible-interval
          - posterior-predictive-distribution
          - bayes-estimator
          - entry: james-stein-estimator
            why: for three or more normal means, shrinkage has lower total squared error than the sample means at every parameter value.
          - marginal-likelihood
          - empirical-bayes
          - bayes-factor
          - entry: lindley-paradox
            why: with a large sample, a small p-value and a Bayes factor in favour of the null can come from the same data.
          - entry: metropolis-hastings
            why: a Markov chain whose stationary distribution is the posterior; its states approach that law only as the run grows.
          - gibbs-sampling
          - effective-sample-size
          - gelman-rubin-diagnostic
          - entry: de-finetti-theorem
            why: an infinite exchangeable sequence is a mixture of independent identically distributed ones, the basis of a prior.
          - hierarchical-bayesian-model
          - entry: bernstein-von-mises-theorem
            why: in regular parametric models the posterior approaches a normal law centred at the MLE, a limit result, so credible and confidence intervals agree only asymptotically.
      - title: Time series and sequential analysis
        intro: >
          Dependent data. The ARMA models assume a stationary process, and tests of a unit root have nonstandard
          asymptotic laws. Sequential analysis looks at the data as they arrive: Wald's test, CUSUM, group sequential
          designs that spend alpha over planned looks, and the test martingales whose guarantee, by Ville's inequality,
          holds at every stopping time.
        steps:
          - entry: stationary-process
            why: the assumption, a law unchanged by shifts in time, on which the models of this stage rest.
          - autoregressive-model
          - moving-average-model
          - arma-model
          - arima-model
          - ljung-box-test
          - augmented-dickey-fuller-test
          - change-point-detection
          - entry: sequential-probability-ratio-test
            why: stops when the likelihood ratio leaves an interval, and for two simple hypotheses no test with its error rates has a smaller expected sample size.
          - cusum
          - group-sequential-design
          - martingale
          - e-variable
          - test-martingale
          - entry: ville-inequality
            why: a nonnegative supermartingale started at 1 ever reaches 1 / alpha with probability at most alpha, so the test stays valid under optional stopping.
          - confidence-sequence
      - title: Experiments and causal effects
        intro: >
          Causal effects as contrasts of potential outcomes. Randomization identifies the average treatment effect by
          design; without it, each method identifies the effect only under its own assumptions, unconfoundedness and
          overlap for weighting and matching, parallel trends for difference in differences, exclusion and monotonicity
          for instruments. Sensitivity analysis asks how much hidden bias would change the answer.
        steps:
          - potential-outcomes-framework
          - sutva
          - average-treatment-effect
          - entry: randomized-experiment
            why: random assignment makes the difference in means unbiased for the average treatment effect, with no model of the outcome.
          - simpsons-paradox
          - entry: ignorability
            why: unconfoundedness given the covariates, the assumption behind every method of this stage that does not randomize.
          - propensity-score
          - horvitz-thompson-estimator
          - inverse-probability-weighting
          - propensity-score-matching
          - entry: augmented-inverse-probability-weighting
            why: consistent if either the outcome model or the propensity model is correct, and its standard errors are asymptotic.
          - rosenbaum-sensitivity-analysis
          - difference-in-differences
          - instrumental-variables-estimation
          - local-average-treatment-effect

  - id: electronic-design-automation
    title: Electronic design automation
    for: a student who knows graphs and shortest paths, Boolean functions, basic linear algebra and a little numerical analysis, and has met NP-completeness, and wants to follow a chip from a behavioural description to a tested layout, and to see which steps of the flow are solved exactly, which rest on models or bounds, and which are heuristics judged only by measured results.
    intro: >
      The path follows the design flow. High-level synthesis schedules and binds the operations of a data flow
      graph; scheduling under resource limits is NP-hard, so its exact methods are integer programs and its fast
      ones are heuristics, while difference constraints give integral schedules in polynomial time when resources
      are left out. Logic synthesis minimizes two-level and multi-level logic, maps it to cells or lookup tables and
      moves registers by retiming; Quine-McCluskey, FlowMap and minimum-period retiming are exact, Espresso and AIG
      rewriting are heuristics. Simulation covers event-driven logic simulation and the Newton, sparse LU and implicit
      integration steps of circuit simulation, whose answers are only as good as the device models. Verification
      checks equivalence and properties with BDDs and SAT: model checking is complete for finite models, bounded model
      checking only up to its bound, and signal correspondence is sound but not complete. Physical design comes next.
      Partitioning, floorplanning, placement and routing are NP-hard in their usual forms, so apart from exact results
      such as Hanan's theorem, the 3/2 Steiner ratio, Stockmeyer's sizing of a slicing floorplan and the left-edge
      algorithm without vertical constraints, their methods are measured on benchmarks. Timing rests on delay models:
      static timing analysis is exact for its model but pessimistic, Elmore delay is a model and an upper bound on the
      50 percent delay of an RC tree, and buffering and sizing are optimal only under that model. Power estimates rest
      on probability models of switching, and the yield, electromigration and mismatch models are empirical fits. Test
      generation is complete for single stuck-at faults, and the defect level and aliasing formulas are exact only in
      their models. The path ends with FPGA, analog, 3D and quantum design, where the same methods return.
    stages:
      - title: High-level synthesis and scheduling
        intro: >
          A behavioural description becomes a control and data flow graph, and a schedule and a binding turn it into
          a controller and a datapath. ASAP and ALAP schedules come from longest paths; scheduling with resource
          limits is NP-hard, solved exactly by integer programming in exponential worst-case time or quickly by
          heuristics. Register binding on intervals and the iteration bound of a recursive graph are exact results.
        steps:
          - directed-acyclic-graph
          - control-data-flow-graph
          - finite-state-machine-with-datapath
          - high-level-synthesis
          - dag-longest-path
          - entry: asap-alap-scheduling
            why: the earliest and latest step of each operation, by longest paths in the DAG, which bound every schedule and give each operation its mobility.
          - entry: resource-constrained-scheduling
            why: NP-hard in general, so the fast schedulers for it are heuristics judged by the latencies they reach on benchmarks.
          - force-directed-scheduling
          - binary-integer-programming
          - entry: ilp-scheduling-formulation
            why: gives an optimal schedule, at the price of an integer program whose solution time can grow exponentially with the design.
          - difference-constraints
          - total-unimodularity
          - entry: sdc-scheduling
            why: timing and latency rules as difference constraints give an integral LP optimum in polynomial time; resource limits enter through a heuristic order, so the schedule can be longer than the best.
          - resource-compatibility-graph
          - entry: register-binding
            why: for straight-line code the left-edge algorithm reaches the fewest registers, the largest number of values live in one step; with values live around a loop the problem is NP-complete.
          - entry: iteration-bound
            why: no schedule of a recursive data flow graph has a shorter sample period than its largest ratio of loop delay to loop registers, and retiming with unfolding reaches it.
      - title: Logic synthesis and technology mapping
        intro: >
          Two-level minimization is NP-hard, solved exactly by prime implicants and a covering step and in practice by
          the heuristic Espresso. Multi-level synthesis works on Boolean networks and and-inverter graphs by algebraic
          division and rewriting, both measured by the literals or nodes they save. Technology mapping is optimal on
          trees and, for depth with lookup tables, on general networks by FlowMap. Retiming moves registers to the
          least clock period in polynomial time.
        steps:
          - boolean-circuit
          - boolean-function
          - sum-of-products
          - prime-implicant
          - dont-care-condition
          - entry: two-level-logic-minimization
            why: NP-hard from a truth table and Sigma_2^p-complete from a sum of products, so exact minimizers take exponential time in the worst case.
          - set-cover
          - entry: quine-mccluskey
            why: exact, all prime implicants and then a minimum cover, in time exponential in the number of variables.
          - shannon-expansion
          - unate-recursive-paradigm
          - entry: espresso
            why: a heuristic whose covers are prime and irredundant but not proved minimum; its quality is known from measured results on benchmark functions.
          - boolean-network
          - kernel-extraction
          - entry: and-inverter-graph
            why: two-input AND nodes with inverted edges, kept free of duplicates by structural hashing, the form on which modern synthesis and equivalence checking work.
          - aig-rewriting
          - technology-mapping
          - entry: tree-covering-technology-mapping
            why: optimal on each tree of the subject graph by dynamic programming, but cutting the graph into trees gives up optimality for the whole network.
          - k-feasible-cut
          - entry: flowmap
            why: a k-LUT mapping of least depth in polynomial time, by a max-flow test at each node; it minimizes depth, not the number of LUTs.
          - entry: retiming
            why: a retiming of least clock period in polynomial time, by binary search over the period and Bellman-Ford on difference constraints.
      - title: Simulation and verification
        intro: >
          Logic simulation evaluates a design for given inputs, and circuit simulation solves Kirchhoff's laws with
          nonlinear device models by Newton's method, sparse LU and implicit integration; Newton's method converges
          only from a good start, which the continuation methods try to supply. Verification proves what simulation
          only samples. Combinational equivalence is coNP-complete and sequential equivalence PSPACE-complete for
          netlists. Model checking is complete for finite models, bounded model checking finds counterexamples only up
          to its bound, and simulation-based verification is judged by the coverage it measures.
        steps:
          - logic-simulation
          - event-driven-logic-simulation
          - kirchhoff-circuit-laws
          - modified-nodal-analysis
          - entry: newton-method-for-systems
            why: the iteration behind every DC and transient solve; it converges fast near a solution but needs a good start.
          - dc-operating-point-analysis
          - sparse-linear-systems
          - backward-differentiation-formulas
          - companion-model
          - transient-circuit-analysis
          - miter-circuit
          - entry: reduced-ordered-bdd
            why: canonical for a fixed variable order, so equivalence is a pointer test, but its size can be exponential and depends on the order.
          - sat
          - cdcl
          - tseitin-transformation
          - sat-sweeping
          - cutpoint-equivalence-checking
          - entry: sequential-equivalence-checking
            why: reduces to reachability on the product machine and is PSPACE-complete for circuits given as netlists.
          - entry: signal-correspondence
            why: sound but not complete, it proves equivalence by an inductive invariant and misses an equivalence that depends on unreachable states.
          - entry: symbolic-model-checking
            why: complete for finite models, by fixed points over BDDs of state sets, though those BDDs can grow exponentially.
          - entry: bounded-model-checking
            why: finds every counterexample up to length k, and proves nothing beyond that bound unless k reaches a completeness threshold.
          - entry: ic3-pdr
            why: proves invariants of finite systems by one-step SAT queries, without unrolling, and also finds counterexamples.
          - assertion-based-verification
          - constrained-random-stimulus-generation
      - title: Partitioning, floorplanning and placement
        intro: >
          Balanced hypergraph partitioning, floorplanning and placement are NP-hard, and their methods, from
          Fiduccia-Mattheyses refinement and multilevel schemes to annealing over floorplan codes and analytical
          placement, are judged by measured cut sizes, areas and wire lengths on benchmarks. The exact results are
          narrower, such as the least-area sizing of a given slicing floorplan, and the convex objectives that analytical
          placers minimize exactly but that only stand in for wire length.
        steps:
          - hypergraph-partitioning
          - kernighan-lin
          - entry: fiduccia-mattheyses
            why: one pass of single-vertex moves with bucket gains in time linear in the pins; it finds a local minimum, not the least cut.
          - multilevel-hypergraph-partitioning
          - entry: rents-rule
            why: an empirical law fitted to real circuits, used to predict terminal counts, cut sizes and wire length.
          - floorplanning
          - slicing-floorplan
          - normalized-polish-expression
          - entry: stockmeyer-floorplan-sizing
            why: the least-area realization of a given slicing floorplan, found exactly by merging shape lists; choosing the floorplan is the hard part.
          - simulated-annealing
          - entry: wong-liu-floorplanning
            why: annealing over normalized Polish expressions, with no bound on the result; it is judged by measured area and wire length.
          - sequence-pair
          - placement-problem
          - entry: half-perimeter-wirelength
            why: the cost most placers optimize, a lower bound on every rectilinear tree of a net and equal to the shortest one for two or three pins.
          - entry: quadratic-placement
            why: its convex quadratic is minimized exactly by a sparse solve, but it stands in for wire length and clusters cells, so the placement is judged after spreading.
          - conjugate-gradient-method
          - electrostatics-based-placement
          - placement-legalization
          - abacus-legalization
      - title: Routing
        intro: >
          Maze routing finds a shortest path for one connection on a grid whenever one exists. Steiner trees for nets
          are NP-hard to find, but Hanan's theorem limits the search to a finite grid and the rectilinear spanning tree
          is within 3/2 of the optimum. Global routing with capacities is solved by negotiation, with no proof of
          success, or by multicommodity flow within a proved factor of the fractional optimum before rounding. Channel
          routing is NP-complete, and the left-edge algorithm is optimal only without vertical constraints.
        steps:
          - entry: lee-maze-routing
            why: breadth-first search on the grid, which finds a shortest path whenever one exists.
          - rectilinear-steiner-tree-problem
          - entry: hanan-theorem
            why: some rectilinear Steiner minimal tree lies on the grid of lines through the pins, which makes the problem finite.
          - rectilinear-minimum-spanning-tree
          - entry: hwang-rectilinear-steiner-ratio
            why: the rectilinear MST is at most 3/2 times the Steiner minimal tree, and the bound is tight.
          - iterated-one-steiner
          - entry: flute
            why: optimal trees from tables for nets of up to nine pins; larger nets are split, and for them the result is a heuristic with no proved ratio.
          - global-routing
          - rip-up-and-reroute
          - entry: negotiated-congestion-routing
            why: there is no general proof that it reaches a legal routing; its success is measured on benchmarks.
          - entry: multicommodity-flow-global-routing
            why: the fractional routing is within a factor 1 + epsilon of its optimum and gives a lower bound; rounding to one route per net loses that guarantee.
          - detailed-routing
          - channel-routing-problem
          - channel-density
          - vertical-constraint-graph
          - entry: left-edge-algorithm
            why: meets the density lower bound on tracks when the vertical constraint graph has no edges.
          - channel-routing-np-completeness
          - greedy-channel-router
      - title: Timing, power, reliability and manufacturability
        intro: >
          Static timing analysis is exact for its delay model in one linear pass, but counts false paths and so is
          pessimistic. Wire delay comes from RC models, of which Elmore delay is the simplest and an upper bound on the
          50 percent delay of an RC tree; clock tree, buffering and sizing algorithms are at best optimal under such models, not for the silicon.
          Power estimates rest on probabilistic models of switching. Electromigration, yield and defect models are
          empirical fits to measured data, and the layout checks at the end are exact for the rules they are given.
        steps:
          - timing-graph
          - arrival-and-required-time
          - entry: static-timing-analysis
            why: exact for its delay model in time linear in the timing graph, with no input vectors, but pessimistic since it counts paths no vector sensitizes.
          - false-path
          - rc-tree
          - entry: elmore-delay
            why: a model, the first moment of the impulse response; on an RC tree it is an upper bound on the 50 percent delay, not the delay itself.
          - entry: statistical-static-timing-analysis
            why: rests on a model of variation, often linear in Gaussian sources, with an approximate statistical max.
          - clock-tree-synthesis
          - entry: deferred-merge-embedding
            why: zero skew with least wire length for a given topology under linear delay; under the Elmore delay it keeps zero skew but its wire length is only heuristic.
          - entry: van-ginneken-buffer-insertion
            why: the best source slack for a fixed routing tree under the Elmore model, by dynamic programming over load and required-time pairs.
          - gate-sizing
          - lagrangian-relaxation
          - entry: lagrangian-relaxation-gate-sizing
            why: exact for continuous sizes under the Elmore delay; a library of discrete sizes needs rounding.
          - dynamic-power-dissipation
          - switching-activity
          - entry: signal-probability-propagation
            why: exact without reconvergent fanout and under independent inputs; with reconvergence the gate formulas only approximate.
          - power-grid-analysis
          - entry: black-equation
            why: an empirical model of electromigration lifetime whose constants are fitted to accelerated tests of one wire technology.
          - critical-area
          - entry: poisson-yield-model
            why: assumes defects fall independently and uniformly, an assumption real wafers break.
          - entry: negative-binomial-yield-model
            why: adds a clustering parameter fitted to wafer data, so it matches clustered defects better but is still an empirical fit.
          - design-rule-checking
          - optical-proximity-correction
      - title: Test and diagnosis
        intro: >
          Test generation for a single stuck-at fault is NP-complete, yet the D-algorithm, PODEM and SAT-based ATPG are
          complete: given time, each finds a test or proves the fault redundant. Fault simulation measures coverage, and
          the Williams-Brown formula turns coverage and yield into a defect level that is exact only in its model. Scan
          and built-in self-test make large circuits testable, with aliasing probabilities that hold under a model of
          random errors. Diagnosis reasons back from failing outputs to the faults that could explain them.
        steps:
          - stuck-at-fault-model
          - automatic-test-pattern-generation
          - d-algorithm
          - entry: podem
            why: complete, it finds a test or proves the fault redundant, with a search tree of at most 2^(n+1) - 1 nodes for n inputs.
          - sat-based-atpg
          - fault-simulation
          - fault-coverage
          - entry: williams-brown-defect-level
            why: exact in a model where faults are equally likely and independent, so its error comes from those assumptions.
          - scan-design
          - linear-feedback-shift-register
          - built-in-self-test
          - multiple-input-signature-register
          - entry: signature-aliasing-probability
            why: tends to 2^(-k) for a k-bit register, under a model of independent random bit errors.
          - effect-cause-diagnosis
      - title: FPGA, analog and emerging technologies
        intro: >
          FPGA tools pack, place and route on a fixed fabric, with annealing placers measured by wire length and
          minimum channel width. Analog sizing becomes a convex geometric program whose global optimum is only as good
          as the fitted device equations, and matching rests on Pelgrom's empirical model. 3D integration and qubit
          mapping bring the partitioning and routing problems back in new forms, still NP-hard and still measured.
        steps:
          - island-style-fpga
          - fpga-logic-cluster
          - fpga-packing
          - fpga-timing-driven-annealing-placement
          - routing-resource-graph
          - minimum-channel-width
          - analog-circuit-sizing
          - geometric-programming
          - entry: geometric-programming-circuit-sizing
            why: an interior-point method finds the global optimum of the posynomial model, which is built on fitted device equations, so the design must still be simulated.
          - entry: pelgrom-mismatch-model
            why: an empirical model in which mismatch falls as one over the square root of gate area, with constants measured for each process.
          - common-centroid-layout
          - three-dimensional-integrated-circuit
          - entry: qubit-mapping
            why: NP-complete in its standard forms, so mappers such as SABRE are judged by measured SWAP counts and depth.
          - sabre-qubit-mapping
  - id: cad
    title: CAD
    for: a student who knows Bézier curves and B-splines, Delaunay triangulations, Newton's method and linear least squares, and wants to follow a mechanical part from its first sketch to its measurement, and to see which steps of the work are exact, which are exact only for a model or for generic data, and which are heuristics judged by measured results.
    intro: >
      The path follows the life of a part. A solid is a set, and its trees of operations and boundary representations
      are proved correct on exact real numbers; with floating point their tests can disagree, so the path meets exact
      geometric computation, which makes every predicate exact, and tolerant modeling, which accepts small gaps. Curved
      faces are intersected and projected by Newton's method, which converges fast but only from a good start, by
      marching, which can miss a small loop, and by subdivision, which finds every piece but only to a tolerance;
      implicitization by resultants is exact. Sketches are constraint systems: solving them is NP-hard, and Laman's
      count and the theorems on global rigidity hold for almost every placement, not for every one. Mechanism synthesis
      at precision points is exact, Burmester's theory and Freudenstein's equation among it, while synthesis by
      optimization finds local optima; assembly partitioning is NP-complete in general and polynomial for one
      translation. Meshes come next: repair and Booleans rest on exact arrangements or on winding numbers, geodesics
      are exact by MMP and approximate by the heat method, and meshes for analysis carry proved angle bounds for
      Delaunay refinement and isosurface stuffing, but none for advancing front, paving and most hexahedral meshers,
      whose quality is measured. Isogeometric analysis has proved rates under stated assumptions. Toolpaths, support
      structures and process plans are judged by measured time and error; nesting and setup planning are NP-hard;
      the K-factor, Chvorinov's rule and Taylor's tool life are empirical laws with fitted constants. Inspection ends
      the path: minimum zone flatness is exact, minimum zone cylindricity and point-cloud alignment reach local optima,
      and Monte Carlo tolerance analysis has a sampling error that falls as one over the square root of the samples.
    stages:
      - title: Solids and their representations
        intro: >
          A solid is a regular closed set, and a model is a finite description of it: a CSG tree, a boundary
          representation, or an exact Nef complex. The Euler-Poincaré formula checks the counts of a boundary. Booleans
          are exact on the real RAM, but rounded tests can contradict each other, so modelers either compute every
          predicate exactly or store a tolerance with each edge and vertex and accept that the result is right only up
          to it.
        steps:
          - real-ram
          - floating-point-arithmetic
          - orientation-test
          - euler-formula
          - entry: r-set
            why: Requicha's definition of a solid as a bounded, closed, regular, semianalytic set, so that every model in the volume describes a set with an interior and a boundary.
          - regularized-set-operations
          - constructive-solid-geometry
          - set-membership-classification
          - boundary-representation
          - winged-edge-data-structure
          - entry: euler-poincare-formula
            why: an exact identity for the counts of vertices, edges, faces, loops, shells and holes, which a valid boundary must satisfy but which does not prove it valid.
          - boundary-evaluation
          - solid-boolean-operations
          - entry: geometric-robustness-problem
            why: rounded geometric tests can disagree with each other, so a correct algorithm can return an impossible topology.
          - entry: exact-geometric-computation
            why: makes every predicate exact, with filters and adaptive precision, so the combinatorial output is always correct.
          - entry: tolerant-modeling
            why: stores a tolerance with each vertex and edge, so a gap smaller than it counts as closed; the model is valid only up to that tolerance.
          - nef-polyhedron
          - solid-offsetting
      - title: Freeform surfaces, intersections and fairing
        intro: >
          The faces of a part are trimmed spline surfaces. Projection and intersection use Newton's method, which
          converges quadratically near a regular solution but finds the nearest point only from a good start, marching,
          which can miss a small loop, and subdivision, which finds every piece to a tolerance. Tests such as the
          Sederberg-Meyers condition rule loops out, and interval methods enclose every root. Fairing and continuity
          checks show defects; no energy defines fairness, so a fair surface is fair only in the sense of its energy.
        steps:
          - bezier-curve
          - b-spline
          - nurbs
          - parametric-surface
          - fundamental-forms
          - surface-curvature
          - newton-method-for-systems
          - trimmed-surface
          - point-projection-onto-a-surface
          - entry: newton-point-inversion
            why: converges quadratically near a nondegenerate foot point, but returns the nearest point only if the start grid is fine enough, which the method cannot check.
          - surface-surface-intersection
          - entry: marching-surface-intersection
            why: traces each branch from a start point by stepping and Newton correction; without a start point on a branch, such as a small closed loop, the branch is missed.
          - entry: lattice-evaluation-intersection
            why: misses any loop of the intersection that fits inside one cell of the lattice.
          - entry: sederberg-meyers-loop-detection
            why: a tangent-cone condition that proves two patches can meet in no closed loop, so marching from boundary points finds every branch.
          - entry: tangential-surface-intersection
            why: where the surfaces touch, the Newton matrix is singular and marching fails, so these cases need their own methods.
          - interval-arithmetic
          - entry: interval-projected-polyhedron
            why: returns boxes smaller than a given tolerance that hold every root, with outward rounding, so no root is lost.
          - resultant
          - entry: implicitization
            why: exact by resultants, but a bicubic patch has an implicit equation of degree up to 18.
          - entry: energy-based-surface-fairing
            why: minimizes a bending energy; since no energy defines fairness, the result is fair only in the sense of the energy chosen.
      - title: Sketches and geometric constraints
        intro: >
          A sketch is a set of points and lines tied by distances, angles and incidences. Solving such a system is
          NP-hard already for distances on a line, so the theory looks at rigidity. Laman's theorem and the pebble game
          decide rigidity in the plane for generic placements; in space counting fails. Global rigidity has an exact
          generic characterization by stress matrices. Solvers decompose the constraint graph into small rigid pieces,
          and then must still choose among exponentially many solutions.
        steps:
          - geometric-constraint
          - geometric-constraint-graph
          - entry: geometric-constraint-problem
            why: NP-hard already for distances in one dimension, so complete solvers are exponential in the worst case.
          - distance-geometry-problem
          - rigidity-matrix
          - infinitesimal-rigidity
          - entry: asimow-roth-theorem
            why: at a regular placement, rigidity equals infinitesimal rigidity, a rank test on the rigidity matrix; at special placements the two can differ.
          - generic-rigidity
          - entry: laman-theorem
            why: an exact count for minimal rigidity in the plane, valid for generic placements only.
          - entry: pebble-game-rigidity
            why: tests Laman's condition exactly in O(n^2) time for a graph with 2n - 3 edges.
          - entry: double-banana-graph
            why: passes every subset count in space and still flexes, so Laman's count has no direct analogue in three dimensions.
          - global-rigidity
          - entry: gortler-healy-thurston-theorem
            why: with Connelly's theorem, a generic framework on n >= d + 2 points is globally rigid exactly when it has an equilibrium stress matrix of rank n - d - 1.
          - entry: fudos-hoffmann-reduction
            why: solves triangle-decomposable systems in the plane exactly; a well-constrained system that is not triangle-decomposable stops with several clusters.
          - entry: root-identification-problem
            why: a well-constrained sketch can have exponentially many solutions, and the choice of the intended one is a heuristic, usually keeping the orientations of the draft.
      - title: Mechanisms and assemblies
        intro: >
          Linkages, cams and gears move the parts. Position analysis of a four-bar is exact by vector loops, and the
          Grashof condition is an exact test of full rotation. Synthesis at precision points is exact: one linear solve
          for three-point function generation and at most four cranks for five positions. Synthesis by optimization
          gives a design, not a certificate. Assembly planning searches over subassemblies; partitioning is NP-complete
          in general, and polynomial for one translation.
        steps:
          - four-bar-linkage
          - vector-loop-closure
          - entry: grashof-condition
            why: an exact test, s + l <= p + q, for whether some link of a four-bar turns fully.
          - entry: freudenstein-equation
            why: linear in its three constants, so three-point function generation needs one 3 by 3 linear solve.
          - entry: chebyshev-spacing
            why: minimizes the node factor of the error bound, not the error itself.
          - entry: burmester-theory
            why: an exact theory that gives at most four Burmester points for five positions.
          - entry: roberts-chebyshev-theorem
            why: every four-bar coupler curve is traced by two other four-bars, its cognates.
          - entry: nine-point-path-synthesis
            why: the count of 1442 solutions came from numerical homotopy continuation, strong evidence but not a proof.
          - entry: optimization-based-linkage-synthesis
            why: finds local optima and gives a design, not a certificate that a better one does not exist.
          - fundamental-law-of-gearing
          - liaison-graph
          - and-or-graph-of-assembly-plans
          - assembly-sequence-planning
          - entry: assembly-partitioning
            why: NP-complete in the plane for general motions, after Kavraki, Latombe and Wilson.
          - entry: non-directional-blocking-graph
            why: decides in polynomial time whether a subassembly can be removed by one translation.
      - title: Meshes, repair and geometry processing
        intro: >
          A part leaves the modeler as a triangle mesh, often with gaps, flipped faces and self-intersections. Repair
          closes and orients it; exact arrangements give Booleans that hold on any input, and the generalized winding
          number decides inside and outside even when the mesh is broken, with a value that degrades smoothly. On
          the mesh, the cotangent Laplacian gives curvature, smoothing and geodesics: exact by the MMP algorithm,
          approximate by the heat method. Parameterizations flatten pieces of the surface.
        steps:
          - polygon-mesh
          - manifold-mesh
          - entry: mesh-repair-problem
            why: ill-posed, since the input does not say what shape it should have been; a repair is right only relative to a target and a measure of change, and the usual pipelines have no global guarantee.
          - mesh-self-intersection
          - entry: generalized-winding-number
            why: is 1 inside and 0 outside a closed mesh and degrades smoothly on a broken one, so the inside of a damaged mesh can still be decided by thresholding.
          - mesh-boolean-operations
          - mesh-arrangements
          - cotangent-laplacian
          - entry: laplacian-smoothing
            why: removes noise but also shrinks the mesh.
          - discrete-geodesic-problem
          - entry: mmp-geodesic-algorithm
            why: computes exact geodesic distance on a polyhedral surface in O(n^2 log n) time.
          - entry: heat-method
            why: approximates geodesic distance with two sparse linear solves, faster than exact methods but not exact.
          - mesh-parameterization
          - entry: tutte-embedding
            why: with the boundary fixed on a strictly convex polygon and positive weights, one sparse linear solve gives a one-to-one map with no flipped triangle.
          - least-squares-conformal-maps
          - metro-mesh-comparison
      - title: Meshes for analysis
        intro: >
          A solver needs elements of good shape, rated by quality measures. Delaunay refinement has proved angle bounds
          in the plane and proved radius-edge bounds in space when the input angles are not too small, but slivers pass
          the radius-edge test and need exudation, whose proved bound is tiny and whose measured angles are larger.
          Quadtree meshing and isosurface stuffing have proved bounds. Advancing front, paving and frame-field
          hexahedral meshers have no quality bound, and sweeping is proved valid only for affine layers, so their
          quality is measured.
        steps:
          - delaunay-triangulation
          - constrained-delaunay-triangulation
          - mesh-quality-measures
          - delaunay-refinement
          - entry: ruppert-algorithm
            why: with input angles of at least 60 degrees, no output angle is below arcsin(1/(2B)), about 20.7 degrees for B = sqrt 2, and for B > sqrt 2 the size is within a constant factor of the optimum.
          - entry: quadtree-mesh-generation
            why: proved aspect ratio at most 4 and size within a constant factor of the optimum.
          - entry: tetrahedral-delaunay-refinement
            why: bounds the radius-edge ratio by B for B >= 2 when the input angles are at least 90 degrees, but slivers can remain.
          - sliver-tetrahedron
          - entry: sliver-exudation
            why: removes slivers with a proved angle bound that is tiny; measured angles are about 5 degrees.
          - entry: isosurface-stuffing
            why: proved dihedral angles between about 10.78 and 164.74 degrees, shown with computer assistance.
          - entry: advancing-front-mesh-generation
            why: builds elements from the boundary inward with good quality in practice and no proved guarantee.
          - entry: paving
            why: an all-quadrilateral heuristic with good boundary elements, judged by measured quality.
          - entry: hexahedral-mesh-existence-theorem
            why: an even number of boundary quads on a ball is enough for a hexahedral mesh, but the theorem is topological and says nothing of element quality.
          - hexahedral-sweeping
          - frame-field-hex-meshing
          - optimization-based-mesh-smoothing
      - title: Analysis on the design
        intro: >
          Isogeometric analysis runs the finite element method on the splines of the design. Its approximation rates
          are proved on shape-regular meshes for a range of Sobolev orders. Local refinement needs T-splines or
          hierarchical splines; T-spline blending functions can be linearly dependent, and analysis-suitable T-meshes
          are the class where independence is proved. Trimmed and cut geometries need stabilization, and volume
          parameterization of a B-rep is the main gap between design and analysis.
        steps:
          - finite-element-method
          - gaussian-quadrature
          - entry: isogeometric-analysis
            why: uses the basis of the CAD model as the finite element basis, so the geometry stays exact under refinement.
          - bezier-extraction
          - k-refinement
          - entry: nurbs-approximation-estimates
            why: proves the rate h^(l - k) on shape-regular meshes for 0 <= k <= l <= p + 1, under those assumptions only.
          - hierarchical-b-spline
          - t-spline
          - entry: t-spline-linear-independence
            why: general T-splines can be linearly dependent, as Buffa and coauthors showed with 40 functions spanning a space of dimension 39.
          - entry: analysis-suitable-t-spline
            why: the class of T-meshes whose blending functions are proved linearly independent.
          - entry: trimmed-isogeometric-analysis
            why: small cut elements need stabilization, and boundary conditions are imposed weakly.
          - entry: cut-finite-element-method
            why: needs a ghost penalty to stay stable on small cut elements.
          - defeaturing
          - volumetric-spline-parameterization
      - title: Machining and printing
        intro: >
          A printer slices the part into layers and adds supports under overhangs; a milling machine follows a toolpath
          of cutter locations. Slicing a mesh is exact computational geometry with a proved running time, but layer
          heights, supports, toolpaths and tool orientations are judged by measured build time, surface error and
          material. Nesting is NP-hard in the strong sense and is solved by heuristics, and topology optimization by SIMP
          finds a local optimum of a penalized problem.
        steps:
          - slicing-for-additive-manufacturing
          - entry: triangle-mesh-slicing
            why: cuts a mesh by k planes in O(n log k + k + m) expected time, where m is the output size.
          - build-orientation
          - support-structure-generation
          - toolpath-planning
          - contour-parallel-toolpath
          - pocket-machining
          - scallop-height
          - gouge-detection
          - five-axis-tool-orientation
          - nc-verification
          - entry: nesting-problem
            why: NP-hard in the strong sense, so practical nesting is heuristic and judged by measured material use.
          - topology-optimization
          - entry: simp-method
            why: finds a local optimum of a penalized problem, not the global optimum of the 0/1 problem.
      - title: Process planning
        intro: >
          A process plan chooses setups, orders operations and fixes the part. Setup planning has set cover at its core
          and is NP-hard, and operation sequencing is a traveling salesman problem with precedence. A* bend sequencing is
          exact for its cost model with an admissible heuristic, in exponential worst-case time. Fixture analysis for
          frictionless point locators is an exact rank test. The K-factor, Chvorinov's rule and Taylor's tool life are
          empirical laws whose constants are fitted to measurements.
        steps:
          - set-cover
          - traveling-salesman-problem
          - a-star-search
          - computer-aided-process-planning
          - entry: setup-planning
            why: its core is set cover, so it is NP-hard and planners use heuristics or small exact searches.
          - operation-sequencing
          - entry: three-two-one-locating-principle
            why: three, two and one locators remove all six degrees of freedom; for frictionless point contacts the position is determined exactly when the locator Jacobian has full rank 6.
          - kinematic-fixture-analysis
          - fixture-planning
          - bend-sequence-planning
          - entry: a-star-bend-sequencing
            why: exact for its cost model with an admissible heuristic, but exponential in the number of bends in the worst case.
          - entry: k-factor
            why: a measured value of about 0.3 to 0.5, not derived from theory, which sets the bend allowance.
          - entry: chvorinov-rule
            why: an empirical law; the exponent is near 2 and the mold constant is fitted.
          - entry: taylor-tool-life-equation
            why: an empirical law, V T^n = C, a fit to data whose constants a shop measures for its own tool and work material.
      - title: Inspection, reverse engineering and tolerancing
        intro: >
          A measuring machine probes the part, and the points are aligned to the model and fitted with planes, circles
          and cylinders. Alignment is exact in closed form when point pairs are known and a local minimum when they are
          not. The minimum zone is the definition of a form tolerance: exact for flatness through the convex hull, a
          local optimum for cylindricity, and never beaten by the least-squares feature. Algebraic fits are biased under
          noise. Worst-case stack-up gives the exact range of an assembly dimension; root sum of squares rests on
          independence and normality, and Monte Carlo estimates carry sampling error.
        steps:
          - least-squares-problem
          - kabsch-algorithm
          - convex-hull-3d
          - geometric-dimensioning-and-tolerancing
          - form-error-evaluation
          - entry: minimum-zone-flatness
            why: exact, by testing the face-vertex and edge-edge pairs of the convex hull of the measured points.
          - entry: minimum-zone-cylindricity
            why: a nonconvex problem whose solvers find a local minimum with no global guarantee.
          - entry: least-squares-reference-feature
            why: exact for its own objective, but its zone is never narrower than the minimum zone, so it can report a larger form error than the part has.
          - entry: inspection-localization
            why: closed form when point pairs are known; without them, iterative alignment reaches only a local minimum.
          - entry: algebraic-distance-fitting
            why: a linear problem, exact on noise-free data but biased under noise.
          - geometric-primitive-fitting
          - reverse-engineering-of-geometric-models
          - entry: tolerance-stack-up
            why: the worst case sum is the exact range; the root sum of squares assumes independent, normal variations.
          - entry: monte-carlo-tolerance-analysis
            why: estimates the fraction of good assemblies with an error that falls as one over the square root of the number of samples.
  - id: compilers-and-program-analysis
    title: Compilers and program analysis
    for: a student who knows graph search and dominators, basic logic and the lambda calculus, and has met NP-completeness and undecidability, and wants to follow a program from its syntax tree to machine code and through the analyses that prove facts about it, and to see which steps are proved correct or optimal, which problems are undecidable or NP-hard, and which methods are heuristics judged only by measured results.
    intro: >
      The path follows a compiler from source to machine code and then turns to the analyses that prove facts about
      programs. Every nontrivial question about what a program computes is undecidable, so each analysis is sound in
      one direction and approximate in the other, and how close it comes is measured. Type inference comes first:
      algorithm W finds principal types for Hindley-Milner programs, ML typability is DEXPTIME-complete yet fast in
      practice, and inference for System F or with polymorphic recursion is undecidable. Intermediate representations
      follow, with dominators, dominance frontiers and SSA form; minimal SSA can need a quadratic number of
      phi-functions, while the counts measured on real programs grow about linearly. Dataflow analysis computes fixed
      points of monotone functions on lattices: the iterative algorithm stops on lattices of finite height, its
      maximal fixed point equals the meet over all paths for distributive frameworks, and abstract interpretation is
      sound relative to a concretization and stops on infinite domains by widening. Optimizations rest on these
      analyses: lazy code motion is optimal among safe placements, value equality is undecidable, the best code
      layout is NP-hard, and inlining and profile-guided choices are judged by measured speed. Loop transformations
      need dependence tests that are conservative, exact for integer constraints only at exponential worst-case cost,
      and the polyhedral model is exact only for affine loop nests. Code generation is optimal on trees for a cost
      model; register allocation as graph coloring and instruction scheduling are NP-complete, chordal SSA
      interference graphs color optimally, and linear scan, modulo scheduling and JIT compilation are judged by
      measurement. Precise pointer analysis is undecidable; Andersen's analysis is cubic and Steensgaard's almost
      linear. The path ends with verification and synthesis: verification conditions prove partial correctness from
      given invariants, invariant synthesis is undecidable in general, and LTL synthesis is 2EXPTIME-complete.
    stages:
      - title: Types and type inference
        intro: >
          A type system assigns types to the phrases of a program and rejects the programs it cannot type. Soundness
          is a theorem about a stated calculus and semantics, proved by progress and preservation, and it rules out
          only what that semantics calls stuck. Unification gives inference for Hindley-Milner programs, with a
          principal type for every typable term and a DEXPTIME-complete decision problem that is fast on real code.
          Richer systems lose inference: System F and polymorphic recursion are undecidable, so they ask for annotations.
        steps:
          - abstract-syntax-tree
          - lambda-calculus
          - type-system
          - type-checking-problem
          - simply-typed-lambda-calculus
          - entry: type-soundness
            why: progress and preservation, proved for the simply typed calculus under call-by-value, which shows the form of every soundness proof and what it leaves out.
          - robinson-unification
          - type-inference-problem
          - let-polymorphism
          - hindley-milner-type-system
          - entry: algorithm-w
            why: inference by unification, sound and complete for Hindley-Milner, exponential in the worst case and fast on the programs people write.
          - principal-type-theorem
          - entry: ml-typability-dexptime-completeness
            why: ML typability is DEXPTIME-complete, so the exponential worst case of algorithm W cannot be avoided; nested lets double the size of types, and the lower bound runs any exponential-time machine.
          - system-f
          - entry: system-f-inference-undecidability
            why: typability without annotations is undecidable for System F, by a reduction from semi-unification, while checking an annotated term stays decidable.
          - entry: polymorphic-recursion-undecidability
            why: inference becomes undecidable but semi-decidable once a recursive function may use itself at other types, which is why such languages ask for a signature.
          - bidirectional-type-checking
          - subtyping
      - title: Intermediate representations and SSA
        intro: >
          The compiler lowers the syntax tree to three-address code, cuts it into basic blocks and joins them in a
          control flow graph. Dominators come from depth-first orders; Lengauer-Tarjan is near-linear, while the
          simpler Cooper-Harvey-Kennedy method has a worse worst case and was measured faster on real graphs. SSA form
          puts phi-functions at iterated dominance frontiers; minimal SSA can need a quadratic number of them, a proved
          bound, while measured counts grow about linearly. Leaving SSA must split critical edges and avoid the
          lost-copy and swap problems.
        steps:
          - activation-record
          - intermediate-representation
          - three-address-code
          - basic-block
          - control-flow-graph
          - call-graph
          - depth-first-orders
          - dominators-problem
          - dominator-tree
          - entry: lengauer-tarjan-algorithm
            why: dominators in near-linear time with path compression and balanced linking, the bound the simpler methods are compared against.
          - entry: cooper-harvey-kennedy-dominance
            why: an iterative dominator algorithm with a worse worst-case bound than Lengauer-Tarjan, measured faster on real control flow graphs.
          - entry: dominance-frontier
            why: the blocks where a definition stops dominating, which is where SSA construction puts its phi-functions.
          - natural-loop
          - static-single-assignment-form
          - phi-function
          - entry: cytron-ssa-construction
            why: minimal SSA from iterated dominance frontiers and a renaming walk over the dominator tree, the standard construction.
          - critical-edge-splitting
          - out-of-ssa-translation
          - entry: lost-copy-and-swap-problems
            why: two ways a naive translation out of SSA gives wrong code after copy propagation, which show why phi-functions are parallel copies.
      - title: Dataflow analysis and abstract interpretation
        intro: >
          A dataflow analysis computes, at every point, a fact that holds on all runs. The iterative algorithm stops
          for monotone functions on lattices of finite height and finds the maximal fixed point, which is safe
          relative to the meet over all paths and equal to it when the framework is distributive; constant
          propagation is monotone but not distributive. Abstract interpretation generalizes this: a domain is sound
          relative to its concretization, widening forces termination on infinite domains at a cost in precision, and
          the polyhedra domain is exponential in the worst case. IFDS solves distributive subset problems across
          procedures exactly.
        steps:
          - dataflow-analysis
          - reaching-definitions
          - entry: live-variable-analysis
            why: the standard backward may-analysis, which over-approximates the set of live names and feeds register allocation.
          - entry: available-expressions
            why: the standard forward must-analysis, which under-approximates and so meets by intersection.
          - fixed-point
          - monotone-dataflow-framework
          - distributive-dataflow-framework
          - gen-kill-problem
          - meet-over-all-paths-solution
          - maximal-fixed-point-solution
          - entry: worklist-dataflow-algorithm
            why: the iterative solver, which stops on lattices of finite height and returns the maximal fixed point whatever the visiting order.
          - entry: mop-mfp-coincidence-theorem
            why: the theorem of Kildall and of Kam and Ullman that the fixed point equals the path solution for distributive frameworks with all blocks reachable, and lies below it otherwise.
          - entry: constant-propagation-problem
            why: the standard analysis that is monotone but not distributive, so the computed fixed point can be strictly less precise than the path solution.
          - loop-invariant
          - abstract-interpretation
          - collecting-semantics
          - abstract-domain
          - galois-connection
          - interval-domain
          - entry: widening-operator
            why: the operator that makes iteration stop on domains of infinite height and still yields a sound post-fixed point, losing precision that narrowing may win back.
          - entry: polyhedra-domain
            why: linear inequalities between variables, the most precise of the numeric domains here, with exponential worst-case cost and no Galois connection in general.
          - context-sensitivity
          - entry: ifds-framework
            why: interprocedural distributive subset problems solved exactly over valid paths by graph reachability, in time cubic in the number of facts.
      - title: Scalar optimizations
        intro: >
          Optimizations change the program while keeping its meaning, and each rests on an analysis. The full
          employment theorem shows that no optimizer is best on all programs. Equality of values is undecidable, so
          value numbering finds a provable part of it. Lazy code motion is optimal, in evaluations and in register
          lifetimes, among safe placements. Choosing the best code layout is NP-hard, and inlining and profile-guided
          optimization are judged by measured speed. Superoptimizers accept a candidate only after a full check, and
          equality saturation is sound when its rewrite rules are.
        steps:
          - dead-code-elimination
          - loop-invariant-code-motion
          - local-value-numbering
          - entry: global-value-numbering
            why: finding equal values across a whole procedure, where exact equality is undecidable and every algorithm finds a provable part of it.
          - entry: alpern-wegman-zadeck-value-numbering
            why: the coarsest congruence of the SSA graph by partition refinement in O(E log E) time, incomplete because phi-functions are treated as uninterpreted.
          - partial-redundancy-elimination
          - entry: lazy-code-motion
            why: four unidirectional analyses that place each computation as late as possible, proved optimal in evaluations and lifetimes among safe placements.
          - entry: sparse-conditional-constant-propagation
            why: constant propagation over SSA edges and executable flow edges together, which finds constants in branches the plain analysis cannot rule out.
          - function-inlining
          - entry: profile-guided-optimization
            why: decisions driven by counts from a training run, which give no guarantee for other inputs and are judged by measured speed.
          - entry: pettis-hansen-code-positioning
            why: the best code layout is NP-hard, so blocks and procedures are placed by a greedy merge of the heaviest edges, a heuristic without a proved ratio.
          - entry: full-employment-theorem
            why: no optimizer produces the smallest program for every input program, a consequence of the halting problem.
          - entry: superoptimization
            why: search for the shortest equivalent code, where tests only reject candidates and a full equivalence check is needed to accept one.
          - e-graph
          - equality-saturation
      - title: Dependence and loop transformations
        intro: >
          A loop transformation reorders iterations, and it is legal when every dependence distance stays
          lexicographically positive. Dependence testing is integer programming: the GCD and Banerjee tests are
          conservative, the omega test is exact for integer linear constraints with no polynomial bound, and real
          compilers answer "maybe" when unsure. Interchange, tiling and vectorization follow from these tests. The
          polyhedral model is exact only for static control parts with affine bounds and subscripts, and its
          schedulers choose legal schedules by objectives that stand in for speed, so the code they produce is measured.
        steps:
          - data-dependence
          - dependence-distance-vector
          - loop-carried-dependence
          - dependence-direction-vector
          - lexicographic-order
          - entry: loop-transformation-legality
            why: the theorem that a reordering is legal when every dependence distance stays lexicographically positive, the test every transformation here must pass.
          - dependence-testing
          - entry: gcd-test
            why: a linear equation has an integer solution only if the gcd of its coefficients divides the constant; the answer independent is always right, maybe can be wrong.
          - entry: banerjee-test
            why: bounds on a dependence equation over the reals, exact over the reals but conservative for integers.
          - fourier-motzkin-elimination
          - entry: omega-test
            why: exact for integer linear constraints, with a worst case beyond any polynomial, measured fast on the systems that dependence tests produce.
          - loop-interchange
          - strip-mining
          - entry: loop-tiling
            why: strip mining and interchange together, legal on a fully permutable band, for the cache reuse that only measurement can price.
          - doall-loop
          - vectorization
          - strongly-connected-components
          - entry: allen-kennedy-algorithm
            why: vectorizes a nest by the strongly connected components of its dependence graph, keeping only the cycles sequential.
          - linear-programming-problem
          - farkas-lemma
          - entry: polyhedral-model
            why: iteration domains and dependences as integer points of polyhedra, exact only for static control parts with affine bounds and subscripts.
          - affine-scheduling-problem
          - entry: feautrier-scheduling
            why: affine schedules from linear programs built with Farkas' lemma, a construction that always ends with a legal schedule.
          - entry: pluto-algorithm
            why: chooses tiling hyperplanes by minimizing a bound on dependence distances, a heuristic objective for speed rather than an optimum.
      - title: Code generation, register allocation and JIT
        intro: >
          Instruction selection covers the IR with machine instructions. On trees, dynamic programming is optimal for
          its cost model; maximal munch is only locally best, and optimal code for a DAG is NP-complete. Register
          allocation as graph coloring is NP-complete for every fixed number of registers from three, so Chaitin's and
          Briggs's allocators are heuristics; strict SSA programs have chordal interference graphs that color
          optimally, yet spilling and coalescing stay NP-hard. Instruction scheduling is NP-complete too. Linear scan,
          modulo scheduling and the methods of JIT compilers are judged by measured speed.
        steps:
          - instruction-selection-problem
          - entry: maximal-munch
            why: greedy tiling from the root by the largest matching pattern, optimal in the sense that no two adjacent tiles combine into a cheaper one, but not optimum.
          - entry: aho-johnson-code-generation
            why: dynamic programming over a tree that gives the cheapest code for its cost model, in time linear in the tree.
          - burs
          - interference-graph
          - graph-coloring
          - register-allocation-problem
          - entry: register-allocation-np-completeness
            why: every graph is the interference graph of some program, so allocation by coloring is NP-complete for each fixed number of registers from three.
          - entry: chaitin-register-allocation
            why: build, simplify, spill and select, the heuristic allocator on which the others are built.
          - briggs-optimistic-coloring
          - register-coalescing-problem
          - chordal-graph
          - entry: ssa-chordal-interference-theorem
            why: strict SSA programs have chordal interference graphs, colored optimally in polynomial time, while spilling and coalescing stay NP-hard.
          - entry: linear-scan-register-allocation
            why: one pass over sorted live intervals, optimal for its intervals but a heuristic for programs, which is why JIT compilers use it.
          - list-scheduling
          - entry: instruction-scheduling-problem
            why: ordering the instructions of a block under latencies and resources, NP-complete in general, so compilers schedule by list heuristics.
          - software-pipelining
          - entry: iterative-modulo-scheduling
            why: tries initiation intervals from a lower bound up; the least one is NP-hard to find, and how often it is reached is measured.
          - just-in-time-compilation
          - entry: inline-caching
            why: caches the method found at each call site, a gain that rests on measurement, such as the 93.6 percent of monomorphic send sites in SELF programs.
      - title: Pointer and alias analysis
        intro: >
          Pointer analysis asks which memory each reference may touch. Precise may-alias analysis is undecidable with
          dynamic allocation, and even its flow-insensitive form is NP-hard, so every practical analysis
          over-approximates. Andersen's inclusion analysis runs in cubic time and Steensgaard's unification in almost
          linear time with less precision; how much precision each loses is measured. For higher-order programs,
          0-CFA is cubic, and k-CFA is EXPTIME-complete for every k from 1. Class hierarchy analysis is sound for
          type-safe programs without reflection.
        steps:
          - alias-analysis
          - points-to-analysis
          - call-graph-construction
          - entry: andersen-analysis
            why: inclusion constraints solved by a closure in cubic time, the precise end of flow-insensitive analysis and the source of the cubic bottleneck.
          - entry: steensgaard-analysis
            why: unification with union-find in almost linear time, less precise than Andersen's analysis by a margin that is measured.
          - entry: may-alias-undecidability
            why: precise may-alias analysis is undecidable for programs with dynamic allocation, so every analysis here over-approximates.
          - entry: flow-insensitive-alias-np-hardness
            why: even when statement order is ignored, the precise may-alias answer is NP-hard.
          - entry: class-hierarchy-analysis
            why: a call graph from declared types alone, in near-linear time, sound for type-safe programs without reflection.
          - entry: zero-cfa
            why: control flow analysis for higher-order programs in cubic time, with one abstract binding per variable.
          - k-cfa
          - entry: k-cfa-exptime-completeness
            why: adding one level of call-string context makes control flow analysis EXPTIME-complete, by the result of Van Horn and Mairson.
      - title: Verification, symbolic execution and synthesis
        intro: >
          Hoare logic is sound and relatively complete, and a verification condition generator turns an annotated
          program into formulas whose validity proves partial correctness; finding the invariants is undecidable in
          general and works only for restricted shapes. Linear ranking functions over the rationals are found in
          polynomial time by linear programming. Symbolic execution and concolic testing find bugs but prove nothing
          beyond the paths they run, and path explosion bounds them. Translation validation is incomplete, since
          equivalence is undecidable, while verified compilation proves the compiler once. Synthesis ends the path:
          CEGIS is sound, and LTL synthesis is 2EXPTIME-complete.
        steps:
          - hoare-triple
          - hoare-logic
          - weakest-precondition
          - entry: verification-condition-generation
            why: turns a program with loop invariants into formulas for a solver, and is sound for partial correctness when the formulas are valid.
          - entry: loop-invariant-synthesis
            why: finding an inductive invariant is undecidable in general, so each method fixes a shape or a domain and may fail.
          - termination-proof
          - entry: ranking-function-synthesis
            why: linear ranking functions over the rationals by linear programming in polynomial time, while over the integers the question is coNP-complete.
          - symbolic-execution
          - path-condition
          - symbolic-execution-tree
          - entry: path-explosion-problem
            why: the number of paths grows exponentially with the branches in sequence, which limits every method of this stage that runs paths one by one.
          - smt-problem
          - entry: concolic-testing
            why: runs concrete inputs and solves negated branch conditions; with an exact solver it reaches every path that an input of the domain follows, and it stops only when the domain is finite.
          - entry: translation-validation
            why: checks one compiler run instead of the compiler, and is incomplete because program equivalence is undecidable.
          - entry: verified-compilation
            why: a machine-checked proof that every compiled program keeps the meaning of its source, as for CompCert in Coq.
          - program-synthesis
          - entry: cegis
            why: alternates a synthesizer and a verifier on counterexamples, always sound, and sure to stop only when the candidate or input space is finite.
          - reactive-synthesis
          - entry: pnueli-rosner-theorem
            why: deciding whether an LTL specification has a reactive implementation is 2EXPTIME-complete.
  - id: information-retrieval-and-ai-reasoning
    title: Information retrieval and AI reasoning
    for: a student who knows sorting, binary search, heaps and hash tables, graph search and shortest paths, basic probability, propositional logic and SAT, and has met NP-completeness and the polynomial hierarchy, and wants to see how a search engine indexes, ranks and is evaluated, and how a reasoner derives, withdraws and revises conclusions from stored knowledge, and to see which results are proved and under which conditions, which problems are NP-hard or harder, and which methods are judged only by measured results.
    intro: >
      The path answers a query against a large body of stored knowledge in two ways. The first half ranks documents:
      an inverted index is built once and then serves every query, posting lists are intersected and compressed with
      proved bounds, and ranking functions score what the lists return. Here the line between proof and measurement is
      sharp. Intersection costs, Elias-Fano space, the safety of WAND and the optimality of the probability ranking
      principle under its hypotheses are theorems, while whether BM25, a smoothed language model or a learned ranker
      finds the documents people want is decided only on test collections, with the effectiveness measures and the
      significance tests of the evaluation stage. Rank aggregation by Kemeny's rule is NP-hard, and greedy
      diversification and recommendation by matrix factorization rest on approximation bounds and recovery theorems
      whose conditions real data seldom meets exactly. The second half derives consequences. Description logics trade
      expressive power for cost: subsumption is polynomial in EL, PSPACE-complete in ALC without a TBox and
      EXPTIME-complete with a general one, while DL-Lite answers queries by rewriting them into SQL. Logic programs are
      exact under each semantics: Horn programs and the well-founded model take polynomial time, stable models are
      NP-complete, and disjunctive programs, default logic and circumscription sit at the second level of the
      polynomial hierarchy. Argumentation and belief revision are characterized by representation theorems, with
      grounded semantics polynomial and sceptical preferred acceptance complete for the second level. The path ends
      with qualitative temporal and spatial calculi, where full Allen interval networks are NP-complete, algebraic
      closure decides the maximal tractable subclasses, and temporal networks with bounded durations are solved by
      shortest paths. Solvers for the hard problems are judged by measured run time on benchmark sets.
    stages:
      - title: Inverted indexes and Boolean query processing
        intro: >
          An inverted index maps each term to the sorted list of documents that contain it, so a Boolean query becomes
          the intersection of a few posting lists. The proved results are bounds: merging costs the sum of the lengths,
          galloping search costs about the smaller length times the log of the ratio, and the adaptive algorithm is
          optimal against a lower bound that depends on how the lists interleave. Gap codes, variable-byte codes and
          Elias-Fano have proved space bounds, Elias-Fano at most ceil(lg(u/n)) + 2 bits per id for n ids below u, while which
          code or document order makes a real index smallest and fastest is measured. Zipf's law is an empirical fit,
          not a theorem.
        steps:
          - term-document-incidence-matrix
          - posting-list
          - inverted-index
          - entry: zipfs-law
            why: a fitted law of term frequencies that explains why a few posting lists are huge and most are tiny, measured on collections, not derived.
          - posting-list-intersection
          - merge-based-list-intersection
          - skip-pointers
          - exponential-search
          - entry: adaptive-set-intersection
            why: intersection whose cost depends on how the lists interleave, proved optimal against an adversary lower bound for that measure.
          - phrase-query
          - trie
          - wildcard-query
          - postings-gap-encoding
          - variable-byte-encoding
          - entry: elias-fano-encoding
            why: n sorted ids below u in at most n times the ceiling of lg(u/n), plus 2n + 1 bits, with constant-time access by position and fast successor search, a proved bound.
          - partitioned-elias-fano
          - k-way-merge
          - blocked-sort-based-indexing
      - title: Ranking models and top-k query processing
        intro: >
          Ranking scores each document for a query and returns the best k. The probability ranking principle is a
          theorem: sorting by probability of relevance maximizes expected utility when relevance of each document is
          independent of the others shown and the probabilities are exact. The binary independence model derives an
          idf weight from stated assumptions, but BM25 adds tuned saturation and length factors, and its usual
          parameters, like the smoothing of query likelihood, were set by measurement on test collections. Top-k
          evaluation is exact: WAND and block-max WAND skip documents that provably cannot enter the top k, so they
          return the same answer as exhaustive scoring, and how much they skip is measured.
        steps:
          - boolean-retrieval-model
          - cosine-similarity
          - tf-idf
          - vector-space-model
          - entry: probability-ranking-principle
            why: ranking by probability of relevance is optimal under independence, exact probabilities and a utility that adds a decreasing weight per relevant document, and fails when results overlap.
          - binary-independence-model
          - entry: bm25
            why: the idf part is derived from the binary independence model, the saturation and length parts are heuristics, and the parameters were fixed by measurement.
          - ranked-retrieval
          - query-likelihood-model
          - dirichlet-prior-smoothing
          - relevance-feedback
          - top-k-selection
          - term-at-a-time-evaluation
          - document-at-a-time-evaluation
          - entry: wand
            why: skips documents whose score upper bound cannot reach the current k-th score, proved safe, with the speedup measured on query logs.
          - block-max-wand
      - title: Evaluating retrieval
        intro: >
          Retrieval quality is not a mathematical property of a ranking function, so it is measured. A test collection
          fixes documents, queries and relevance judgments, and the measures turn a ranking into a number:
          precision at k, average precision, reciprocal rank, nDCG, rank-biased precision and expected reciprocal rank,
          each a model of a user that can be stated exactly and is itself an assumption. Pooling judges only the top
          documents of the systems compared, which biases scores against new systems. The significance tests are
          exact under their stated sampling assumptions. Interleaving compares two rankers online, and team draft is
          proved fair when clicks depend only on positions.
        steps:
          - precision-and-recall
          - test-collection
          - precision-at-k
          - mean-average-precision
          - mean-reciprocal-rank
          - entry: normalized-discounted-cumulative-gain
            why: graded gains discounted by rank and normalized by the ideal ranking, the measure that the learning-to-rank methods of the next stage optimize.
          - rank-biased-precision
          - expected-reciprocal-rank
          - pooling
          - sign-test
          - interleaved-evaluation
          - entry: team-draft-interleaving
            why: each position goes to each ranker with probability one half, so random clicks give an expected outcome of zero, a proved property; its sensitivity is measured.
      - title: Learning to rank, fusion and dense retrieval
        intro: >
          Learning to rank fits a scoring function to judged or clicked data. Pairwise and listwise losses are
          surrogates: LambdaRank's lambdas are not the gradient of nDCG, and that following them raises nDCG is an
          experimental finding, as is the strength of LambdaMART. Unbiased learning to rank is exactly unbiased when the
          propensities are true and positive, and biased by a fixed amount when they are wrong. Fusing several rankings
          is a voting problem: Kemeny's rule, the ranking with the least total Kendall tau distance, is NP-hard already
          for four lists, while reciprocal rank fusion is a simple rule whose constant was set in a pilot study. Dense
          retrieval reduces ranking to maximum inner product search, and its quality is measured.
        steps:
          - learning-to-rank
          - ranknet
          - entry: lambdarank
            why: gradients defined directly by the change of nDCG when two documents swap, not derived from a cost, so its effect is measured, not proved.
          - lambdamart
          - position-bias
          - inverse-probability-weighting
          - entry: unbiased-learning-to-rank
            why: clicks reweighted by inverse examination propensities give an unbiased estimate of a ranking metric when the propensities are true and positive, with a bias that more data does not remove when they are wrong.
          - kendall-tau-distance
          - rank-aggregation
          - reciprocal-rank-fusion
          - feedback-arc-set-problem
          - entry: kemeny-rank-aggregation
            why: the consensus ranking with the least total Kendall tau distance, NP-hard already for four lists by a reduction from feedback arc set, with exact solvers for small inputs.
          - maximum-inner-product-search
          - dual-encoder-retrieval
      - title: Web search and recommendation
        intro: >
          At web scale the ranking uses links, clicks and duplicates. PageRank is the stationary distribution of a
          random surfer and power iteration computes it with a proved error bound, while its value as a ranking signal
          is measured. MinHash estimates Jaccard similarity without bias, so near-duplicate detection has proved error
          rates. Click models are fitted by maximum likelihood and compared by measured log-likelihood. Diversification
          for several query intents is NP-hard, and the greedy IA-Select gets a factor of 1 - 1/e because the
          objective is submodular. Exact matrix completion is a theorem with conditions on rank, incoherence and random
          sampling, while alternating least squares only reaches a local minimum and recommenders are compared by
          measured accuracy.
        steps:
          - web-crawling
          - pagerank
          - hits-algorithm
          - jaccard-similarity
          - minhash
          - click-model
          - cascade-click-model
          - search-result-diversification
          - submodular-function
          - entry: ia-select
            why: diversification over query intents is NP-hard by a reduction from maximum coverage, and the greedy choice is within 1 - 1/e of the best because the objective is submodular.
          - recommendation-problem
          - rating-matrix
          - collaborative-filtering
          - matrix-factorization-recommendation
          - entry: exact-matrix-completion-theorem
            why: a low-rank incoherent matrix is recovered exactly with high probability from enough uniformly sampled entries by nuclear norm minimization, conditions that real ratings data does not meet.
          - entry: alternating-least-squares
            why: each half step solves least squares exactly, so the cost never increases, but the result is a local minimum and depends on the start.
      - title: Knowledge representation and description logics
        intro: >
          A description logic describes classes and relations in a fragment of first-order logic chosen for its
          decision problems, and the fragments trade expressive power for cost. Subsumption is polynomial in EL even
          with a general TBox, PSPACE-complete in ALC without a TBox and EXPTIME-complete with a general one; the
          tableau algorithm is sound, complete and terminating with blocking, though its general-TBox form is not
          worst-case optimal. DL-Lite rewrites queries into first-order queries, with AC0 data complexity. The open
          world assumption separates these logics from databases. Knowledge compilation pays once for a form, such as
          d-DNNF, in which chosen queries take polynomial time. The situation calculus states the effects of actions
          and answers the frame problem with successor state axioms.
        steps:
          - description-logic
          - alc-description-logic
          - tbox-and-abox
          - concept-satisfiability
          - concept-subsumption
          - entry: alc-tableau-algorithm
            why: sound, complete and terminating for ALC, in polynomial space without a TBox and double exponential time with a general TBox, where the problem is EXPTIME-complete.
          - alc-pspace-completeness
          - alc-general-tbox-exptime
          - el-description-logic
          - entry: el-classification
            why: completion rules compute every subsumption between concept names of an EL TBox in polynomial time, the reason large medical ontologies use EL.
          - closed-world-assumption
          - open-world-assumption
          - dl-lite
          - perfectref-rewriting
          - knowledge-compilation
          - d-dnnf
          - frame-problem
          - situation-calculus
          - successor-state-axioms
      - title: Rules, logic programs and nonmonotonic reasoning
        intro: >
          Rules derive new facts from stored ones. Horn programs have a least model computed in linear time by forward
          chaining, and SLD resolution is sound and complete for them. Negation as failure makes reasoning
          nonmonotonic. SLDNF is sound for Clark's completion and complete only under conditions; the well-founded
          model takes polynomial time; deciding whether a program has a stable model is NP-complete, and with
          disjunctive heads the problem is complete for the second level of the polynomial hierarchy. Default logic
          and circumscription are also at that level. Answer set solvers use CDCL with loop formulas, are exact, and
          are judged by measured run time; the speed of Rete is likewise a measured result on particular programs.
        steps:
          - horn-sat
          - production-system
          - forward-chaining
          - entry: rete-algorithm
            why: keeps partial matches between cycles so a small change costs little, an advantage measured on real programs, while one change can cost time exponential in the length of a rule.
          - logic-programming
          - sld-resolution
          - negation-as-failure
          - sldnf-resolution
          - clark-completion
          - stratified-logic-program
          - gelfond-lifschitz-reduct
          - stable-model-semantics
          - entry: stable-model-np-completeness
            why: deciding whether a normal program has a stable model is NP-complete, by a reduction from 3-SAT, so answer set solvers search.
          - well-founded-semantics
          - loop-formulas
          - answer-set-programming
          - cdcl
          - conflict-driven-answer-set-solving
          - disjunctive-asp-sigma2-completeness
          - nonmonotonic-reasoning
          - default-logic
          - entry: default-logic-complexity
            why: credulous reasoning in propositional default logic is complete for the second level of the polynomial hierarchy, one level above SAT.
          - circumscription
      - title: Argumentation and belief revision
        intro: >
          Abstract argumentation decides which arguments survive their attackers. The grounded extension is a least
          fixed point computed in polynomial time; credulous acceptance under preferred semantics is NP-complete and
          sceptical acceptance is complete for the second level of the polynomial hierarchy. Belief revision changes a
          belief set to admit new information. The AGM postulates are characterized exactly by representation
          theorems: a revision satisfies them if and only if it is given by a system of spheres, and in the finite
          propositional case by a faithful total preorder on worlds. Gardenfors proved that no nontrivial revision
          satisfies the Ramsey test. Ordinal conditional functions grade beliefs and give System Z, whose rational
          closure answers default queries with a polynomial number of SAT calls.
        steps:
          - abstract-argumentation-framework
          - admissible-set
          - complete-extension
          - entry: grounded-extension
            why: the least fixed point of the defence function, unique and computed in polynomial time, the sceptical baseline of every other semantics.
          - preferred-extension
          - stable-extension-argumentation
          - entry: preferred-semantics-complexity
            why: credulous acceptance is NP-complete and sceptical acceptance is complete for the second level of the polynomial hierarchy, because maximality must be refuted.
          - belief-revision
          - agm-postulates
          - grove-spheres
          - entry: katsuno-mendelzon-revision
            why: in a finite propositional language an operator satisfies the revision postulates if and only if it selects the minimal models of the input under a faithful total preorder.
          - gardenfors-impossibility-theorem
          - ordinal-conditional-functions
          - system-p
          - rational-closure
          - system-z
      - title: Qualitative temporal and spatial reasoning
        intro: >
          Qualitative calculi reason about intervals and regions by relations, not coordinates. A network is a
          constraint problem over a finite set of relations, and algebraic closure is the main tool. For the full
          Allen interval algebra consistency is NP-complete; the ORD-Horn subclass is tractable and maximal among
          classes with all basic relations, and the tractable subclasses of the interval algebra and of RCC8 are known
          exactly, which are proved classifications. Point algebra networks are solved in linear time by strongly
          connected components. Metric constraints on time differences form simple temporal problems solved by
          shortest paths; disjunctive ones are NP-complete, and dynamic controllability with uncertain durations is
          decided in polynomial time.
        steps:
          - path-consistency
          - qualitative-constraint-network
          - allens-interval-algebra
          - composition-table
          - algebraic-closure
          - entry: interval-algebra-np-completeness
            why: consistency of networks over the full interval algebra is NP-complete, by a reduction from 3-SAT, so path consistency alone cannot decide it.
          - point-algebra
          - ord-horn-subclass
          - entry: nebel-burckert-theorem
            why: algebraic closure decides consistency over the 868 ORD-Horn relations, and adding any other relation makes the problem NP-complete.
          - region-connection-calculus-rcc8
          - rcc8-tractable-subclasses
          - difference-constraints
          - entry: simple-temporal-problem
            why: consistent exactly when the distance graph has no negative cycle, so Bellman-Ford decides it and Floyd-Warshall gives the minimal network.
          - disjunctive-temporal-problem
          - simple-temporal-network-with-uncertainty
          - entry: morris-dynamic-controllability
            why: dynamic controllability of a network with uncertain durations is decided in polynomial time, by Morris's O(N^4) cutoff algorithm after the pseudo-polynomial first method.
  - id: control
    title: Control
    for: a student who knows linear algebra (eigenvalues, positive definite matrices, least squares), linear differential equations, the transfer functions and z-transform of signal processing, and some convex optimization and finite automata, and wants to learn how to model a dynamical system, decide its stability, and design feedback that makes it behave, and to see which results are proved and for which model, which problems are NP-hard or undecidable, and which methods are judged only by measured responses.
    intro: >
      The path follows a feedback design from the model to the controller, and then to the systems that linear models
      do not cover. Every result of control holds for a stated model: linear or nonlinear, continuous or discrete time,
      a known plant or a set of plants, with stated noise. For linear time-invariant models the main tests are exact:
      the Routh-Hurwitz and Jury tests, the Nyquist criterion, and the rank tests for controllability and
      observability. Pole placement works exactly when the pair is controllable, and the separation principle lets
      state feedback and observer be designed apart. LQR is optimal for its quadratic cost, and with one input its
      continuous-time loop has gain margin from 1/2 to infinity and phase margin at least 60 degrees, while LQG has no
      guaranteed margins. The Kalman filter is the minimum-variance estimator for linear Gaussian models and the best
      linear one otherwise. Model predictive control is stable and recursively feasible only with its terminal
      ingredients, and its solve times are measured. Identification is consistent only under the excitation and noise
      conditions each method states. Many tools give only sufficient conditions: Lyapunov functions, small-gain,
      circle and sum-of-squares certificates. Some questions are hard: the structured singular value is NP-hard to
      compute, and reachability is PSPACE-complete for timed automata and undecidable for general hybrid automata.
      Bode asymptotes, root locus sketches, describing functions, Ziegler-Nichols rules and the speed of solvers are
      approximations or heuristics judged by measured responses.
    stages:
      - title: Models, discretization and identification
        intro: >
          A controller acts on a model, so the path starts with the models. An ordinary differential equation with a
          Lipschitz right side has a unique solution near the start, by the Picard-Lindelöf theorem. A linear
          time-invariant system is described by a transfer function or by state-space matrices, and its free response
          is a matrix exponential. Linearization at an equilibrium gives a local linear model. Zero-order hold
          discretization is exact for inputs held constant between samples, unlike a Runge-Kutta simulation, whose
          error has a proved order in the step size. Identification fits a model to measured data: least squares on an
          ARX model is consistent when the noise is white and the input is persistently exciting, and biased for
          colored noise, where instrumental variables restore consistency in open loop.
        steps:
          - ode-initial-value-problem
          - entry: picard-lindelof-theorem
            why: a unique local solution when the right side is continuous and Lipschitz in the state, the fact behind every state model and every simulation of one.
          - runge-kutta-methods
          - linear-time-invariant-system
          - z-transform
          - transfer-function
          - frequency-response
          - laplace-transform
          - poles-and-zeros
          - state-space-representation
          - equilibrium-point
          - entry: jacobian-linearization
            why: replaces a nonlinear system near an equilibrium by the linear system of its Jacobians, a model that is only valid locally.
          - characteristic-polynomial
          - eigenvalue
          - matrix-exponential
          - variation-of-constants-formula
          - entry: zero-order-hold-discretization
            why: the exact discrete model of a continuous linear plant when the input is held constant between samples, computed with one matrix exponential.
          - system-identification
          - positive-definite-matrix
          - persistent-excitation
          - arx-model
          - entry: least-squares-arx-identification
            why: linear least squares on past outputs and inputs, the exact minimizer of the equation error, consistent for white noise and biased when the noise is colored.
          - entry: instrumental-variable-identification
            why: instruments built from the input keep the estimate consistent for colored noise that is independent of the input, which holds in open loop.
      - title: Stability
        intro: >
          Stability is defined for an equilibrium of a stated model. For a linear time-invariant model it is a property
          of the eigenvalues, and the Routh-Hurwitz and Jury tests decide it exactly from the coefficients of the
          characteristic polynomial without computing a root. For nonlinear models Lyapunov's direct method gives
          sufficient conditions: a function that decreases along solutions proves stability, while failing to find one
          proves nothing. For linear systems a quadratic Lyapunov function exists exactly when the matrix is Hurwitz,
          and it comes from a Lyapunov equation. Linearization decides local stability only when no eigenvalue lies on
          the imaginary axis. A control Lyapunov function extends the idea to systems with an input.
        steps:
          - hurwitz-matrix
          - routh-array
          - entry: routh-hurwitz-criterion
            why: all roots in the open left half plane exactly when the first column of the Routh array is positive, an exact test for linear time-invariant models.
          - entry: jury-stability-test
            why: the discrete-time counterpart, which decides whether every root lies inside the unit circle.
          - lyapunov-stability
          - asymptotic-stability
          - exponential-stability
          - lyapunov-function
          - entry: lyapunov-direct-method
            why: a positive definite function with nonpositive or negative definite derivative proves stability or asymptotic stability, a sufficient condition only.
          - lasalle-invariance-principle
          - lyapunov-equation
          - lyapunov-theorem-for-linear-systems
          - entry: lyapunov-indirect-method
            why: a Hurwitz linearization proves local exponential stability and an eigenvalue in the right half plane proves instability; with eigenvalues on the axis the test says nothing.
          - control-affine-system
          - lie-derivative
          - control-lyapunov-function
      - title: Classical feedback loops and PID
        intro: >
          Classical control designs a loop from the transfer function. The Nyquist criterion counts unstable
          closed-loop poles exactly from the encirclements of -1, for linear time-invariant loops. Gain and phase
          margins measure the distance to instability along one direction each, so a loop can have good margins and
          still be close to -1. Root locus sketching rules and Bode asymptotes are approximations for design. The
          sensitivity functions show what feedback can do, and the Bode gain-phase relation and the sensitivity integral
          are proved limits on it. PID is the most used controller; Ziegler-Nichols and other tuning rules are rules of
          thumb judged by measured responses.
        steps:
          - feedback-control-loop
          - second-order-system
          - final-value-theorem
          - steady-state-error
          - root-locus
          - bode-plot
          - nyquist-plot
          - entry: nyquist-stability-criterion
            why: Z = N + P counts the unstable closed-loop poles from encirclements of -1, exact for linear time-invariant loops and extended to loops with a time delay.
          - gain-margin
          - phase-margin
          - sensitivity-function
          - complementary-sensitivity-function
          - pid-controller
          - entry: ziegler-nichols-tuning
            why: PID gains from the ultimate gain and period or from a step response, rules of thumb aimed at a quarter decay ratio and judged by the measured response.
          - bode-gain-phase-relation
          - loop-shaping
          - entry: internal-model-principle
            why: zero steady-state error under all small plant changes needs a model of the signal generator inside the loop, which is why integral action removes constant offsets.
      - title: State feedback and observers
        intro: >
          State-space design works with the matrices of the model. Controllability and observability are decided
          exactly by rank tests, the Kalman rank condition and the Popov-Belevitch-Hautus test. The eigenvalues of
          A - BK can be placed anywhere exactly when the pair is controllable, and Ackermann's formula gives the gain
          for one input; stabilizability and detectability are the weaker conditions that suffice for stability. An
          observer estimates the state from the output, and the separation principle proves that the eigenvalues of
          the joined loop are those of the feedback and of the observer. It says nothing about robustness.
        steps:
          - controllability
          - observability
          - cayley-hamilton-theorem
          - entry: kalman-rank-condition
            why: a linear time-invariant system is controllable exactly when the controllability matrix has full rank, an exact algebraic test.
          - popov-belevitch-hautus-test
          - controllable-canonical-form
          - state-feedback
          - pole-placement-problem
          - entry: pole-placement-theorem
            why: the closed-loop eigenvalues can be placed anywhere, in conjugate pairs, if and only if the pair is controllable.
          - ackermann-formula
          - stabilizability
          - detectability
          - controllability-gramian
          - state-observer
          - luenberger-observer
          - entry: separation-principle
            why: the eigenvalues of an observer-based loop are those of A - BK and A - LC, for linear models, with no statement about margins.
      - title: Optimal control and the Kalman filter
        intro: >
          Optimal control chooses the input that minimizes a cost. Pontryagin's maximum principle gives necessary
          conditions only; the Hamilton-Jacobi-Bellman equation gives a sufficient condition when its solution is
          smooth, and the value function is otherwise its viscosity solution. For a linear model and a quadratic cost
          the answer is the LQR state feedback from a Riccati equation, whose stabilizing solution exists and is unique
          when the pair is stabilizable and detectable. With one input the continuous-time LQR loop has guaranteed
          margins. The Kalman filter is the minimum-variance estimator for linear models with Gaussian noise and the
          best linear one otherwise. LQG joins the two and is optimal for its model, but Doyle's example shows that its
          margins can be arbitrarily small.
        steps:
          - optimal-control-problem
          - principle-of-optimality
          - entry: hamilton-jacobi-bellman-equation
            why: a smooth solution of the HJB equation is the value function and gives an optimal feedback, a sufficient condition; in general the value function is only a viscosity solution.
          - control-hamiltonian
          - costate
          - entry: pontryagin-maximum-principle
            why: an optimal input minimizes the Hamiltonian along state and costate trajectories, a necessary condition, not a sufficient one.
          - bang-bang-control
          - lqr-problem
          - finite-horizon-lqr
          - continuous-algebraic-riccati-equation
          - hamiltonian-matrix
          - entry: stabilizing-riccati-solution-theorem
            why: with (A, B) stabilizable, (Q^(1/2), A) detectable and R positive definite, the Riccati equation has a unique stabilizing solution.
          - infinite-horizon-lqr
          - entry: lqr-stability-margins
            why: a single-input continuous-time LQR loop keeps |1 + L| at least 1, so gain margin from 1/2 to infinity and phase margin at least 60 degrees; false in discrete time.
          - entry: kalman-filter
            why: the exact posterior mean for linear models with Gaussian noise, and the best linear estimate for other noise with the same covariances.
          - kalman-bucy-filter
          - lqg-control
          - entry: lqg-guaranteed-margins-counterexample
            why: Doyle's 1978 example of an LQG loop that loses stability under input gains arbitrarily close to 1, so LQG has no guaranteed margins.
      - title: Model predictive control
        intro: >
          Model predictive control solves a finite-horizon optimal control problem at each sample and applies the first
          input. For a linear model with quadratic cost and linear constraints, each step is a convex quadratic program.
          The closed loop is recursively feasible and asymptotically stable for the nominal model only when a terminal
          set is invariant under a local controller and the terminal cost decreases by the stage cost. Explicit MPC
          solves the program for all states offline, with a number of regions exponential in the constraints in the
          worst case. Tube MPC keeps the guarantees under bounded disturbances. Nonlinear MPC loses convexity, so its
          solver may find only local solutions, and its solve times, like those of every MPC solver, are measurements.
        steps:
          - positively-invariant-set
          - control-invariant-set
          - model-predictive-control
          - kkt-conditions
          - quadratic-programming
          - linear-mpc
          - recursive-feasibility
          - entry: mpc-stability-theorem
            why: nominal MPC is recursively feasible and asymptotically stable when the terminal set is invariant under a local law and the terminal cost decreases by at least the stage cost.
          - entry: explicit-mpc
            why: the MPC law is piecewise affine on polyhedral regions, computed offline; the number of regions is exponential in the constraints in the worst case and measured on real problems.
          - offset-free-mpc
          - tube-mpc
          - nonlinear-mpc
      - title: Robust and adaptive control
        intro: >
          Robust control asks for one controller that works for a set of plants. The small-gain theorem gives a
          sufficient condition for a loop of two systems. Kharitonov's theorem reduces an interval polynomial to four
          Routh-Hurwitz tests. H-infinity synthesis solves its problem exactly, by two Riccati equations or by linear
          matrix inequalities, and a bisection finds the optimal level. Exact computation of the structured singular
          value is NP-hard, so mu analysis computes upper and lower bounds. Adaptive controllers have Lyapunov
          stability proofs for their ideal model, their parameters converge only under persistent excitation, and the
          Rohrs example shows that small unmodeled dynamics can make them unstable.
        steps:
          - bibo-stability
          - entry: small-gain-theorem
            why: a well-posed loop of two systems with finite gains is finite-gain stable when the product of the gains is below 1, a sufficient condition.
          - h-infinity-norm
          - model-uncertainty
          - kharitonov-theorem
          - linear-fractional-transformation
          - h-infinity-control-problem
          - entry: dgkf-h-infinity-synthesis
            why: a controller with closed-loop H-infinity norm below gamma exists exactly when two Riccati equations have stabilizing solutions and the spectral radius of XY is below gamma squared.
          - semidefinite-programming
          - linear-matrix-inequality
          - structured-singular-value
          - entry: mu-analysis
            why: upper and lower bounds on the structured singular value over frequency, since its exact value is NP-hard to compute.
          - adaptive-control
          - entry: model-reference-adaptive-control
            why: a Lyapunov-based adaptation law keeps all signals bounded and the tracking error tends to zero for the assumed plant structure; the gains converge only under persistent excitation.
          - entry: rohrs-counterexample
            why: a fast unmodeled factor and a bounded high-frequency command make the standard adaptive controller drift into instability.
      - title: Nonlinear control
        intro: >
          Nonlinear control has few exact tests. The describing function predicts limit cycles approximately and can be
          wrong. The circle criterion is a sufficient condition for stability against every nonlinearity in a sector,
          and sum-of-squares programming finds polynomial Lyapunov functions by semidefinite programming, a sufficient
          test since not every nonnegative polynomial is a sum of squares. Feedback linearization cancels the
          nonlinearity exactly under conditions on relative degree or involutivity, but it needs an exact model and
          gives no robustness guarantee. Backstepping builds a Lyapunov function step by step. Sliding mode control is
          insensitive to matched uncertainty but chatters. Brockett's condition shows that some controllable systems
          have no continuous stabilizing feedback.
        steps:
          - limit-cycle
          - entry: describing-function
            why: replaces a nonlinearity by its gain on a sinusoid and predicts oscillations, an approximation that can report a limit cycle that does not exist or miss one that does.
          - lure-problem
          - circle-criterion
          - sum-of-squares-programming
          - lie-bracket
          - relative-degree
          - input-output-linearization
          - feedback-linearization
          - entry: feedback-linearizability-conditions
            why: a single-input system is feedback linearizable near a point exactly when n vector fields built by Lie brackets are independent and the first n - 1 span an involutive distribution.
          - backstepping
          - sliding-mode-control
          - entry: brockett-condition
            why: a necessary condition for continuous stabilizing feedback that fails for some controllable systems, such as the nonholonomic integrator.
          - control-barrier-function
      - title: Discrete-event and hybrid systems
        intro: >
          A discrete-event system is an automaton whose behavior is a language of event strings. In supervisory
          control the supremal controllable sublanguage of a regular specification is computable, in time polynomial in
          the size of the product automaton, and it gives the least restrictive nonblocking supervisor. Max-plus algebra
          makes timed synchronization linear, and the cycle time is a maximum cycle mean. Switched systems can be
          unstable even when every mode is stable; slow enough switching restores stability. Reachability is
          PSPACE-complete for timed automata and undecidable for general hybrid automata, so reachable-set tools
          over-approximate. Hybrid MPC solves a mixed-integer program at each sample, NP-hard in general and judged by
          measured solve times.
        steps:
          - deterministic-finite-automaton
          - product-construction
          - discrete-event-system
          - supervisory-control-theory
          - controllable-language
          - nonblocking-supervisor
          - entry: supremal-controllable-sublanguage
            why: the largest controllable part of a regular specification, computed by a fixed point on the product automaton in time polynomial in its size.
          - max-plus-algebra
          - max-plus-eigenvalue-theorem
          - switched-system
          - entry: dwell-time-theorem
            why: if every mode is exponentially stable and switches are slow enough on average, the switched system is globally uniformly exponentially stable.
          - reachability-problem
          - entry: timed-automata
            why: clocks that grow at rate 1 and are compared with integer constants; the region graph makes reachability decidable, and it is PSPACE-complete.
          - entry: hybrid-automata
            why: real variables with flows in each mode; reachability is undecidable even for linear flows and decidable for initialized rectangular automata.
          - reachable-set-computation
          - mixed-integer-programming
          - hybrid-mpc

  - id: robotics
    title: Robotics
    for: a student who knows linear algebra, the Jacobian of a map, basic probability and graph search, and wants to see how a robot arm, a mobile robot and a team of robots are modeled, planned for and controlled.
    intro: >
      The path follows Volume 37 from rotations to robot teams, with motion
      planning from Volume 29 and filters from Volumes 25 and 28. The
      kinematics and dynamics results hold for rigid links and ideal joints.
      Inverse kinematics may have no solution, finitely many (at most 16 for a
      general 6R arm) or infinitely many, and the numerical methods converge
      only near a solution. The recursive dynamics algorithms are exact for the
      rigid-body model. Sampling planners are probabilistically complete for
      problems with positive clearance and cannot report that no path exists.
      The Kalman filter is exact only for linear Gaussian models, and pose
      graph optimization is nonconvex, so most mapping results are local unless
      a certificate is computed. Speeds and success rates of planners, SLAM
      systems and collision avoidance are measured, not proved.
    stages:
      - title: Rigid body motion
        intro: >
          Every later stage writes positions and orientations as elements of
          SO(3) and SE(3). This stage gives the charts (Euler angles, axis
          angle, quaternions), the exponential and logarithm maps, and twists
          and wrenches, which carry velocities and forces.
        steps:
          - cross-product
          - matrix-exponential
          - skew-symmetric-matrix-of-a-vector
          - special-orthogonal-group
          - euler-angles
          - entry: gimbal-lock
            why: a three-angle chart loses one degree of freedom when two axes line up, which is why the later stages prefer quaternions or the exponential map
          - axis-angle-representation
          - rodrigues-rotation-formula
          - entry: unit-quaternion-rotation
            why: q and -q give the same rotation, so a quaternion covers SO(3) twice
          - special-euclidean-group
          - homogeneous-transformation-matrix
          - rigid-body-twist
          - se3-exponential-map
          - wrench
      - title: Kinematics of arms
        intro: >
          Forward kinematics maps joint values to the pose of the end
          effector and has one answer. Inverse kinematics may have none,
          finitely many or infinitely many. Closed forms exist for special
          arms; numerical methods use the Jacobian and converge only from a
          nearby start, quadratically for Newton and the pseudo-inverse near a
          regular solution and linearly for damped least squares.
        steps:
          - pseudoinverse
          - singular-value-decomposition
          - newton-method-for-systems
          - kinematic-chain
          - forward-kinematics
          - denavit-hartenberg-convention
          - product-of-exponentials-formula
          - inverse-kinematics
          - entry: pieper-criterion
            why: three consecutive axes that meet in a point give a closed-form solution; the condition is sufficient, not necessary
          - entry: six-r-inverse-kinematics-sixteen-solutions
            why: a general six-revolute arm has at most 16 inverse kinematics solutions
          - space-and-body-jacobian
          - kinematic-singularity
          - newton-raphson-inverse-kinematics
          - damped-least-squares-inverse-kinematics
          - kinematic-redundancy
          - entry: stewart-gough-forward-kinematics
            why: for a parallel platform the roles swap, and forward kinematics has up to 40 complex solutions
      - title: Dynamics and control of arms
        intro: >
          The manipulator equation relates joint torques to joint
          accelerations for rigid links. The recursive algorithms compute it
          exactly for that model: inverse dynamics by RNEA and forward
          dynamics by ABA, both in linear time in the number of joints, and the
          mass matrix by CRBA. Controllers built on the model come with
          stability proofs that assume the model is exact.
        steps:
          - lyapunov-function
          - newton-euler-equations
          - euler-lagrange-manipulator-dynamics
          - manipulator-equation
          - skew-symmetry-of-manipulator-dynamics
          - linearity-in-dynamic-parameters
          - entry: recursive-newton-euler-algorithm
            why: inverse dynamics in O(n) operations for n joints, exact for the rigid-body model
          - composite-rigid-body-algorithm
          - entry: articulated-body-algorithm
            why: forward dynamics of a kinematic tree in O(n) time by three passes over the tree
          - floating-base-dynamics
          - computed-torque-control
          - entry: pd-control-with-gravity-compensation
            why: a regulator that is globally asymptotically stable when the gravity term is known exactly
          - operational-space-formulation
          - impedance-control
      - title: Grasping and manipulation
        intro: >
          A grasp is judged by the wrenches its contacts can apply through
          friction cones. The force closure test is exact once the cones are
          replaced by polyhedral cones, and quality measures rank grasps by the
          size of the wrench space they span.
        steps:
          - convex-hull
          - linear-programming-problem
          - friction-cone
          - grasp-matrix
          - form-closure
          - entry: finger-bounds-for-form-closure
            why: form closure needs at least 4 frictionless fingers in the plane and 7 in space, and these suffice except for a disc or a surface of revolution
          - force-closure
          - polyhedral-friction-cone
          - force-closure-test
          - ferrari-canny-metric
          - sensorless-part-orienting
          - task-and-motion-planning
      - title: Motion planning and trajectories
        intro: >
          Planning in configuration space is PSPACE-hard in general (Reif), so
          practical planners trade completeness for speed. Exact cell
          decomposition is complete, grid search is resolution complete, and
          PRM and RRT are probabilistically complete. RRT* is asymptotically
          optimal; plain RRT is not. A path is then timed: convex time-optimal
          parameterization is solved globally, while trajectory optimizers such
          as CHOMP return local results.
        steps:
          - configuration-space
          - motion-planning
          - piano-movers-problem
          - cell-decomposition
          - probabilistic-roadmap
          - rapidly-exploring-random-tree
          - rrt-star
          - entry: rrt-star-asymptotic-optimality
            why: the 2011 proof has a gap, and Solovey et al. (2020) proved the result with the exponent 1/(d+1)
          - kinodynamic-planning
          - time-scaling
          - trapezoidal-velocity-profile
          - time-optimal-path-parameterization
          - topp-reachability-analysis
          - entry: convex-time-optimal-path-parameterization
            why: with the squared path speed as the variable, timing a fixed path under torque limits becomes one convex program, solved globally
          - trajectory-optimization
          - entry: chomp
            why: a local descent method; the proved result is about the decrease of the cost, not about avoiding collisions
      - title: Localization and mapping
        intro: >
          A robot estimates its pose from motion and sensor models with a
          Bayes filter. The Kalman filter is exact for linear Gaussian models,
          the EKF is an approximation, and particle filters approximate the
          posterior with samples. SLAM is then posed as a pose graph, whose
          optimization is nonconvex; SE-Sync certifies a global optimum when
          its relaxation is tight.
        steps:
          - bayes-theorem
          - kalman-filter
          - extended-kalman-filter
          - particle-filter
          - factor-graph
          - least-squares-problem
          - bayes-filter
          - odometry-motion-model
          - ekf-localization
          - monte-carlo-localization
          - occupancy-grid-mapping
          - slam-problem
          - entry: ekf-slam
            why: the joint covariance of m landmarks makes each update cost O(m^2)
          - fastslam
          - graphslam
          - pose-graph-optimization
          - entry: se-sync
            why: solves a convex relaxation and certifies a global optimum of pose graph optimization when the relaxation is tight
      - title: Mobile, legged and multi-robot systems
        intro: >
          Wheeled robots obey nonholonomic constraints, and shortest paths for
          a car with bounded curvature come from small word families (six
          for Dubins, 46 sufficient for Reeds-Shepp). Legged robots keep
          balance through the zero moment point. Teams of robots share tasks
          by assignment and agree on values by consensus; the Hungarian
          algorithm solves single-task assignment exactly, and decoupled
          planning for many robots is incomplete.
        steps:
          - hungarian-algorithm
          - laplacian-matrix
          - lloyds-algorithm
          - nonholonomic-constraint
          - kinematic-bicycle-model
          - pure-pursuit
          - entry: stanley-controller
            why: locally exponentially stable for the kinematic bicycle at positive speed
          - dubins-path
          - reeds-shepp-path
          - entry: hybrid-a-star
            why: A* over grid cells that keep a continuous pose, with Reeds-Shepp shots to the goal; the result depends on when the shot is tried, so it is not optimal
          - zero-moment-point
          - multi-robot-task-allocation
          - entry: laplacian-consensus-protocol
            why: converges to the average of the initial values on a connected undirected graph
          - coupled-and-decoupled-planning
          - entry: optimal-reciprocal-collision-avoidance
            why: robots do not collide as long as every linear program is feasible
          - cortes-coverage-algorithm

  - id: computer-vision
    title: Computer vision
    for: a student who knows linear algebra with the SVD, least squares, basic probability and the image filters of Volume 28, and wants to recover cameras, depth, objects and motion from images.
    intro: >
      The path follows Volume 38 from local features to tracking, after a
      short review of images and filters from Volume 28. The geometric
      estimators (DLT, the eight-point and five-point algorithms, PnP) are
      exact for noise-free data and in general minimize an algebraic error,
      so their results are refined by minimizing the reprojection error, and
      bundle adjustment finds a local minimum from a good start. Critical
      configurations exist where two views do not fix the scene. The RANSAC
      iteration bound assumes independent samples and is optimistic with
      noise. Graph cuts minimize submodular energies exactly, while alpha
      expansion is within a factor 2c of the optimum and alpha-beta swap has
      no constant factor bound. ICP reaches only a local result. Detector
      repeatability, learned matchers, detectors and trackers are judged by
      measurements on benchmarks.
    stages:
      - title: Images, filters and linear algebra
        intro: >
          A review of what the volume assumes: images as arrays, smoothing and
          pyramids, edges and corners, SIFT, the pinhole camera, the SVD and
          least squares, and nearest-neighbor search.
        steps:
          - digital-image
          - gaussian-filter
          - image-pyramid
          - edge-detection
          - canny-edge-detector
          - harris-corner-detector
          - sift
          - pinhole-camera-model
          - singular-value-decomposition
          - least-squares-problem
          - nearest-neighbor-search
          - kd-tree
      - title: Local features and matching
        intro: >
          A feature is a point or region that can be found again in another
          image of the same scene, with a descriptor that can be compared.
          How often it is found again is measured, not proved. Matches are
          found by nearest neighbors in descriptor space and filtered, since
          many are wrong.
        steps:
          - scale-space-representation
          - invariant-local-features
          - entry: detector-repeatability
            why: the fraction of features found again at the corresponding place in a transformed image, measured on test sequences
          - shi-tomasi-corner-detector
          - difference-of-gaussians-detector
          - fast-corner-detector
          - brief-descriptor
          - orb-features
          - histogram-of-oriented-gradients
          - feature-descriptor
          - feature-matching
          - entry: lowe-ratio-test
            why: keeps a match only when the nearest descriptor is much closer than the second nearest, which rejects ambiguous matches
          - randomized-kd-forest
          - superpoint
          - entry: superglue
            why: a learned matcher, whose quality is reported as pose and homography accuracy on benchmarks
      - title: Cameras and calibration
        intro: >
          A camera maps 3D points to pixels by a projection matrix, which
          splits into intrinsic and extrinsic parameters, with lens distortion
          on top. Calibration recovers these from known patterns or, under
          stronger assumptions, from the images alone.
        steps:
          - homogeneous-coordinates
          - camera-intrinsic-matrix
          - camera-extrinsic-parameters
          - camera-projection-matrix
          - brown-conrady-distortion-model
          - dlt-camera-resectioning
          - camera-matrix-decomposition
          - entry: zhang-calibration-method
            why: gets the intrinsic matrix in closed form from homographies of a planar pattern, then refines all parameters with Levenberg-Marquardt
          - image-of-the-absolute-conic
          - self-calibration
      - title: Two-view geometry and robust fitting
        intro: >
          Two images of a plane are related by a homography, and two images of
          a general scene by the fundamental or essential matrix. Linear and
          minimal solvers compute these exactly from noise-free matches; with
          noise and wrong matches they run inside RANSAC and their results are
          refined by a geometric error.
        steps:
          - homography
          - dlt-homography
          - hartley-normalization
          - algebraic-and-geometric-error
          - epipolar-geometry
          - entry: fundamental-matrix
            why: a rank 2 matrix defined up to scale, with 7 degrees of freedom
          - essential-matrix
          - normalized-eight-point-algorithm
          - entry: seven-point-algorithm
            why: the cubic det F = 0 gives one or three solutions from seven matches
          - entry: five-point-algorithm
            why: up to ten essential matrices fit five calibrated matches
          - essential-matrix-decomposition
          - cheirality
          - linear-triangulation
          - perspective-n-point
          - entry: p3p
            why: three point pairs give a quartic equation and up to four poses
          - ransac
          - entry: ransac-iteration-bound
            why: ceil(log(1-p)/log(1-w^s)) samples assume independent all-inlier samples, and the count is optimistic with noise
          - lo-ransac
          - entry: critical-configurations
            why: points on a ruled quadric through the camera centers make the two-view reconstruction not unique
          - entry: projective-reconstruction-theorem
            why: matches alone fix uncalibrated cameras and points only up to a projective transformation of space
      - title: Structure from motion
        intro: >
          Many views are combined by bundle adjustment, a large sparse
          nonlinear least squares problem. Its cost is nonconvex, so the
          methods find a local minimizer, and the start comes from incremental
          or global reconstruction pipelines.
        steps:
          - nonlinear-least-squares
          - gauss-newton-algorithm
          - levenberg-marquardt
          - entry: bundle-adjustment
            why: the cost is nonconvex and the standard methods find only a local minimizer
          - gauge-freedom
          - entry: sparse-bundle-adjustment
            why: eliminating the points makes a step cost O(N^3) in the N cameras and linear time in the points
          - incremental-structure-from-motion
          - rotation-averaging
          - global-structure-from-motion
          - visual-odometry
          - entry: scale-drift
            why: a single camera fixes motion only up to scale, and the estimate wanders unless loop closure, stereo or inertia fixes it
          - direct-sparse-odometry
      - title: Stereo, depth and point clouds
        intro: >
          Depth comes from disparity between rectified images. Local matching
          and dynamic programming are fast; global methods pose stereo as an
          energy over a grid and minimize it by min cuts, exactly for
          submodular energies and approximately otherwise. Point clouds are
          then aligned by ICP, which converges to a local result, or by global
          methods with a certified gap.
        steps:
          - max-flow-min-cut-theorem
          - stereo-rectification
          - disparity
          - depth-from-disparity
          - stereo-matching-cost
          - block-matching-stereo
          - semi-global-matching
          - entry: graph-representable-energies
            why: only regular (submodular) binary energies can be represented by a cut, and for terms of at most three variables regularity is also sufficient
          - entry: alpha-expansion
            why: within 2c of the optimum for a metric pairwise term, so 2 for Potts
          - entry: alpha-beta-swap
            why: works for semimetric terms but has no constant factor bound
          - entry: qpbo
            why: labels only part of the variables, with values that some optimum shares
          - multi-view-stereo
          - tsdf-fusion
          - point-cloud
          - iterative-closest-point
          - entry: icp-convergence-theorem
            why: no iteration increases the mean squared closest-point distance, but a global minimum is not guaranteed
          - point-to-plane-icp
          - entry: go-icp
            why: branch and bound over all rotations and translations in a box gives the optimum of the ICP cost within a gap eps
      - title: Recognition, segmentation and tracking
        intro: >
          The last stage labels pixels, finds objects and follows them over
          time. Interactive segmentation by graph cuts is exact for its
          energy. Learned detectors and trackers are compared by measured
          scores such as mean average precision and the CLEAR MOT metrics.
        steps:
          - image-segmentation
          - markov-random-field
          - boykov-jolly-graph-cuts
          - intersection-over-union
          - object-detection
          - box-non-maximum-suppression
          - detection-mean-average-precision
          - bag-of-visual-words
          - faster-r-cnn
          - kalman-filter
          - hungarian-algorithm
          - multi-object-tracking
          - kanade-lucas-tomasi-tracker
          - entry: sort-tracker
            why: a constant velocity Kalman filter per box and the Hungarian algorithm on IoU, frame by frame
          - clear-mot-metrics

  - id: complexity
    title: Computational complexity
    for: a student who knows Turing machines, Boolean circuits, SAT and asymptotic analysis, and wants to see what is proved and what is open about the limits of computation.
    intro: >
      The path follows Volume 39 from computability to communication and
      query complexity, after the machine models of the earlier volumes. Some
      results are theorems: the halting problem and Hilbert's tenth problem
      are undecidable, Rice's theorem holds, the time and space hierarchy
      theorems give P different from EXP and NL different from PSPACE,
      parity is not in AC0, the PCP theorem holds, relativizing proofs cannot
      settle P versus NP, FPT is properly inside XP, and communication and
      query lower bounds hold without assumptions. The Church-Turing thesis
      is a thesis, not a theorem. P versus NP, P versus PSPACE, L versus P
      and BPP versus P are open, so NP-hardness and W[1]-hardness are
      evidence of hardness under P not equal to NP and FPT not equal to
      W[1], and kernel lower bounds assume NP is not in coNP/poly. The
      fine-grained bounds are conditional on SETH, the OV, 3SUM or APSP
      hypotheses; the entries on the 3SUM and APSP conjectures report recent
      preprints that claim to refute them, which does not change the
      reductions. Each stage names its kind of reduction: many-one, Karp,
      Cook, logspace, Levin, parsimonious, parameterized or fine-grained.
    stages:
      - title: Models of computation
        intro: >
          A review of the models the volume measures: deterministic,
          nondeterministic and probabilistic Turing machines, Boolean
          circuits, time and space as resources, and SAT as the first hard
          problem.
        steps:
          - turing-machine
          - multitape-turing-machine
          - nondeterministic-turing-machine
          - probabilistic-turing-machine
          - boolean-circuit
          - time-complexity
          - space-complexity
          - polynomial-time
          - sat
          - 3-sat
          - adversary-argument
          - yao-minimax-principle
      - title: Computability
        intro: >
          Before cost comes the question of whether a problem can be solved
          at all. Diagonalization shows that the halting problem is
          undecidable, many-one reductions carry undecidability to other
          problems, and Rice's theorem covers every nontrivial property of
          what a program computes.
        steps:
          - decidable-language
          - recursively-enumerable-language
          - entry: church-turing-thesis
            why: a thesis about the informal notion of a mechanical method, not a theorem
          - countability
          - diagonalization-argument
          - universal-turing-machine
          - entry: halting-problem
            why: computably enumerable but undecidable, and complete for the c.e. sets
          - many-one-reducibility
          - entry: rice-theorem
            why: covers every nontrivial property of the language of a machine, but not properties of the machine text such as its number of states
          - post-correspondence-problem
          - entry: hilberts-tenth-problem
            why: the MRDP theorem (1970) shows that no algorithm decides integer solvability of polynomial equations
          - kolmogorov-complexity
          - oracle-turing-machine
          - arithmetical-hierarchy
      - title: Complexity classes
        intro: >
          Classes group problems by the resources a machine needs. The chain
          L, NL, P, NP, PSPACE, EXP is known, and the hierarchy theorems show
          that some of its steps are strict, but no single step is known to
          be strict. Barriers such as relativization explain why the usual
          proof methods do not settle P versus NP.
        steps:
          - complexity-class
          - p
          - np
          - co-np
          - logspace
          - nondeterministic-logspace
          - pspace
          - exptime
          - entry: class-inclusions-chain
            why: NL differs from PSPACE and P from EXP, so some steps of the chain are strict, but no single step is known to be strict
          - p-versus-np-problem
          - entry: time-hierarchy-theorem
            why: if f log f = o(g) for a time-constructible g, then DTIME(f) is a proper subset of DTIME(g)
          - space-hierarchy-theorem
          - entry: savitch-theorem
            why: nondeterministic space s(n) is simulated in deterministic space O(s(n)^2), so NPSPACE = PSPACE
          - immerman-szelepcsenyi-theorem
          - bpp
          - polynomial-hierarchy
          - entry: karp-lipton-theorem
            why: if NP is in P/poly, the polynomial hierarchy collapses to its second level
          - entry: ac0
            why: addition is in AC0, but parity, majority and multiplication are not
          - entry: baker-gill-solovay-theorem
            why: there are oracles A and B with P^A = NP^A and P^B different from NP^B, so no relativizing proof settles P versus NP
          - natural-proofs-barrier
          - ip-equals-pspace
          - pcp-theorem
      - title: NP-completeness and reductions
        intro: >
          A Karp reduction maps instances to instances and preserves the
          answer; a Cook reduction may ask an oracle many questions. Levin and
          parsimonious reductions also carry solutions and their number.
          NP-completeness says a problem has no polynomial algorithm unless P
          equals NP, and strong NP-hardness rules out pseudo-polynomial
          algorithms under the same assumption.
        steps:
          - decision-problem
          - polynomial-time-verifier
          - entry: polynomial-time-reduction
            why: the Karp reduction, a polynomial-time map with x in A exactly when f(x) is in B
          - entry: turing-reduction
            why: a Cook reduction may ask many oracle questions and combine the answers, which a Karp reduction cannot
          - np-hard
          - np-complete
          - entry: cook-levin-theorem
            why: SAT is NP-complete under Karp reductions
          - entry: circuit-value-problem
            why: in P, and P-complete under logspace reductions
          - gadget-reduction
          - three-coloring
          - hamiltonian-cycle-np-completeness
          - karps-21-np-complete-problems
          - pseudo-polynomial-time
          - subset-sum-problem
          - entry: strong-np-hardness
            why: hardness that holds with numbers bounded by a polynomial, so no pseudo-polynomial algorithm exists unless P = NP
          - three-partition
          - levin-reduction
          - parsimonious-reduction
          - entry: ladners-theorem
            why: if P is not NP, then NP has problems that are neither in P nor NP-complete
      - title: Parameterized complexity
        intro: >
          A parameter k separates the hard part of an instance from its size.
          FPT algorithms run in time f(k) n^c, kernels shrink instances to a
          size bounded in k, and W[1]-hardness under parameterized reductions
          is evidence that no FPT algorithm exists.
        steps:
          - treewidth
          - parameterized-problem
          - fixed-parameter-tractable
          - entry: vertex-cover-branching
            why: a search tree with at most 2^k leaves decides vertex cover in O(2^k (n + m)) time
          - entry: buss-kernel
            why: a vertex cover kernel with at most k^2 edges, found in O(n + m) time
          - kernelization
          - entry: courcelle-theorem
            why: MSO2 properties are decidable in time f(|phi|, t) n given a tree decomposition of width t, where f is a non-elementary tower
          - color-coding
          - entry: xp
            why: XP contains FPT, and the inclusion is proper without any assumption
          - parameterized-reduction
          - w-hierarchy
          - entry: clique-w1-completeness
            why: clique is W[1]-complete, so it has no FPT algorithm unless FPT = W[1]
          - entry: fpt-w1-conjecture
            why: implies P different from NP, and is implied by the Exponential Time Hypothesis
          - entry: kernel-lower-bounds
            why: rule out polynomial kernels unless NP is a subset of coNP/poly
      - title: Fine-grained complexity
        intro: >
          Fine-grained reductions transfer exact exponents, such as n^2 for
          edit distance or n^3 for APSP. Every lower bound in this stage is
          conditional on a hypothesis about SAT, Orthogonal Vectors, 3SUM or
          APSP.
        steps:
          - edit-distance
          - all-pairs-shortest-paths
          - entry: fine-grained-reduction
            why: saving a power in the time for B saves a power in the time for A
          - conditional-lower-bound
          - strong-exponential-time-hypothesis
          - orthogonal-vectors
          - entry: seth-implies-ov-lower-bound
            why: a truly subquadratic algorithm for Orthogonal Vectors in every dimension c log n would refute SETH (Williams 2005)
          - entry: edit-distance-seth-lower-bound
            why: no O(N^(2-e)) algorithm for edit distance unless SETH fails, even for binary strings
          - 3sum
          - entry: 3sum-conjecture
            why: the entry states the conjecture and reports preprints from October 2026 that claim an O(n^1.9992) algorithm
          - apsp-conjecture
          - entry: apsp-negative-triangle-equivalence
            why: APSP, min-plus product and negative triangle detection are subcubic equivalent
      - title: Communication and query complexity
        intro: >
          In these models the cost is bits sent between players or input bits
          read, and lower bounds are proved without assumptions, by fooling
          sets, rank and rectangles.
        steps:
          - communication-model
          - deterministic-communication-complexity
          - fooling-set-method
          - log-rank-lower-bound
          - entry: disjointness-problem
            why: deterministic cost n + 1, randomized cost Theta(n) and quantum cost Theta(sqrt n)
          - randomized-communication-complexity
          - entry: index-problem
            why: one-way from Alice it costs Theta(n) bits even with public coins, but with interaction about log2 n
          - decision-tree-complexity
          - entry: sensitivity-theorem
            why: proved by Huang in 2019, so block sensitivity is at most the fourth power of sensitivity
          - entry: log-rank-conjecture
            why: open since 1988; the known upper bound is O(sqrt(rank))

  - id: databases
    title: Databases
    for: a student who knows B-trees, hashing, external sorting and basic logic and graphs, and wants the theory and algorithms behind relational database systems.
    intro: >
      The path follows the written entries of Volume 40, which is still being
      written: relational theory, indexes, query processing and optimization,
      transactions, recovery and materialized views. The chapters on
      distributed databases and on data integration and cleaning are not yet
      written, and only part of the storage chapter is. Several results are exact: Armstrong's
      axioms are sound and complete for functional dependencies,
      conjunctive-query containment is NP-complete (Chandra and Merlin),
      Datalog evaluation is P-complete in data complexity and
      EXPTIME-complete in program complexity, generic join and leapfrog
      triejoin are worst-case optimal for the AGM bound, two-phase locking
      gives conflict serializability, and ARIES is correct under write-ahead
      logging. Join ordering is NP-hard, and Selinger's algorithm searches
      only left-deep plans. Cost models and cardinality estimates are
      approximations whose errors grow with the number of joins, so plan
      quality is measured. Snapshot isolation allows write skew; serializable
      snapshot isolation removes it by aborting some transactions.
    stages:
      - title: Storage structures and prerequisites
        intro: >
          A review of the structures and models the volume uses: the external
          memory model, B-trees and hashing, external sorting, hypergraphs and
          Horn clauses, and deadlock in concurrent programs.
        steps:
          - external-memory-model
          - b-tree
          - b-plus-tree
          - hash-table
          - external-merge-sort
          - bloom-filter
          - bit-vector
          - hypergraph
          - topological-sort
          - horn-clause
          - np-complete
          - deadlock
          - wait-for-graph
      - title: The relational model and query languages
        intro: >
          A database is a set of finite relations, queried by relational
          algebra, relational calculus or Datalog. Conjunctive queries are
          the select-project-join core, and their containment is decidable
          but NP-complete; for the full calculus it is undecidable.
        steps:
          - relational-model
          - relational-algebra
          - relational-calculus
          - domain-independent-query
          - entry: codds-theorem
            why: relational algebra and the domain-independent calculus express the same queries under set semantics
          - sql-null-semantics
          - conjunctive-query
          - entry: query-containment-problem
            why: NP-complete for conjunctive queries and undecidable for the full relational calculus
          - entry: chandra-merlin-theorem
            why: Q1 is contained in Q2 exactly when there is a homomorphism from Q2 to Q1
          - conjunctive-query-minimization
          - data-and-combined-complexity
          - datalog
          - entry: datalog-evaluation
            why: P-complete in the data and EXPTIME-complete in the program
          - semi-naive-evaluation
          - magic-sets
      - title: Dependencies and normal forms
        intro: >
          Functional and multivalued dependencies say which decompositions of
          a schema lose no information. BCNF decomposition is always lossless
          but may lose dependencies; 3NF synthesis keeps both. Some design
          questions are hard, such as whether an attribute lies in some key.
        steps:
          - functional-dependency
          - entry: armstrongs-axioms
            why: reflexivity, augmentation and transitivity are sound and complete for implied functional dependencies
          - entry: attribute-closure-algorithm
            why: computes the closure of an attribute set in linear time
          - candidate-key
          - entry: prime-attribute-np-completeness
            why: deciding whether an attribute is in some candidate key is NP-complete, while finding one key is easy
          - minimal-cover-problem
          - lossless-join-decomposition
          - chase-algorithm
          - lossless-join-test
          - entry: boyce-codd-normal-form
            why: deciding that a subschema is in BCNF is coNP-complete
          - entry: bcnf-decomposition
            why: the result is a lossless join, but it can lose dependencies
          - third-normal-form
          - entry: third-normal-form-synthesis
            why: a 3NF decomposition that is both lossless and dependency preserving
          - multivalued-dependency
          - fourth-normal-form
      - title: Indexes and join algorithms
        intro: >
          Indexes trade space and update cost for faster selections. Joins
          are computed by nested loops, sorting or hashing, with costs counted
          in page I/Os. For acyclic queries Yannakakis' algorithm runs in time
          linear in input plus output, and worst-case optimal joins meet the
          AGM bound for any query.
        steps:
          - clustered-index
          - bitmap-index
          - bulk-loading-b-tree
          - learned-index
          - iterator-model
          - nested-loop-join
          - block-nested-loop-join
          - index-nested-loop-join
          - entry: sort-merge-join
            why: about 3(M + N) page I/Os when memory is large enough
          - entry: grace-hash-join
            why: partitions both inputs on disk with one hash function and joins each pair in memory, about 3(M + N) I/Os
          - hybrid-hash-join
          - semijoin
          - acyclic-hypergraph
          - gyo-reduction
          - entry: yannakakis-algorithm
            why: semijoin passes over the join tree remove dangling tuples, then the join runs in time linear in input plus output
          - entry: agm-bound
            why: the output size is at most the product of the relation sizes raised to any fractional edge cover, and some instances reach the best bound
          - generic-join
          - entry: leapfrog-triejoin
            why: worst-case optimal, binding one attribute at a time by intersecting sorted trie levels
          - threshold-algorithm
      - title: Query optimization
        intro: >
          An optimizer rewrites a query and picks a plan by an estimated
          cost. The estimates come from statistics and are often far off for
          many joins, and the search space is cut down, so the chosen plan is
          the best only under the model.
        steps:
          - query-plan
          - predicate-pushdown
          - selectivity
          - histogram
          - entry: cardinality-estimation
            why: estimates from statistics, samples or sketches, with errors that grow fast with the number of joins
          - cost-model
          - entry: join-ordering
            why: NP-hard in general, polynomial for tree queries with ASI costs
          - entry: selinger-join-enumeration
            why: dynamic programming over subsets for the cheapest left-deep plan, keeping one plan per interesting order
          - query-optimization
      - title: Transactions and concurrency control
        intro: >
          Transactions must look as if they ran one at a time. Conflict
          serializability is tested by an acyclic conflict graph, while view
          serializability is NP-complete to test. Locking, timestamps,
          validation and multiple versions each enforce some form of it, and
          the SQL isolation levels trade it for speed.
        steps:
          - acid-properties
          - serializability
          - conflict-graph
          - entry: conflict-serializability
            why: holds exactly when the conflict graph is acyclic
          - entry: view-serializability
            why: strictly larger than conflict serializability and NP-complete to test
          - entry: two-phase-locking
            why: every schedule it allows is conflict serializable, in the order of the lock points
          - entry: strict-two-phase-locking
            why: holding exclusive locks to commit or abort also avoids cascading aborts
          - wait-die-and-wound-wait
          - entry: phantom-problem
            why: row locks cannot stop inserts that match a read condition, so two-phase locking on rows is not serializable
          - predicate-locking
          - timestamp-ordering
          - thomas-write-rule
          - optimistic-concurrency-control
          - multiversion-concurrency-control
          - isolation-levels
          - entry: snapshot-isolation
            why: allows write skew, so it is not serializable
          - entry: serializable-snapshot-isolation
            why: aborts any transaction that could be the pivot of two consecutive rw edges, so that every committed history is serializable
      - title: Recovery and materialized views
        intro: >
          After a crash the system must keep committed work and remove the
          rest. Write-ahead logging and ARIES do this with a log; shadow paging
          does it without one. Materialized views store query results, kept
          up to date from the changes to their base tables.
        steps:
          - crash-recovery
          - entry: steal-and-force-policies
            why: steal needs undo and no-force needs redo
          - shadow-paging
          - write-ahead-logging
          - checkpointing
          - group-commit
          - entry: aries-recovery
            why: analysis, redo that repeats history, and undo that logs compensation records
          - materialized-view
          - view-maintenance
          - incremental-view-maintenance
          - dred-algorithm
          - entry: view-selection
            why: in the data cube lattice, greedy selection gets at least 1 - 1/e of the best benefit
  - id: natural-language-and-speech
    title: Natural language and speech
    for: a student who knows basic probability, hidden Markov models, finite automata and a little signal processing, and wants to see how programs model, tag, parse, translate, generate and recognize language.
    intro: >
      The path follows Volume 41 from tokens to speech, with the Unicode
      entries of Chapter 8.8, the probabilistic models of Volume 25, the
      automata and grammars of Volume 9 and the signal processing of
      Volume 28 as its base. Some searches are exact for their models:
      Viterbi decoding of HMMs and linear-chain CRFs, CKY and the Eisner
      algorithm in cubic time, the maximum spanning tree for arc-factored
      non-projective parsing, and the forward-backward sums of CTC. EM
      never lowers the likelihood but in general reaches only a local
      maximum, except for IBM model 1, whose likelihood is concave.
      Subword vocabulary training, transition parsers and beam decoders
      are greedy or approximate. Smoothing methods are estimators
      judged by perplexity, and word vectors, neural language models,
      scaling laws and translation and recognition systems are judged by
      measurements such as perplexity, BLEU and word error rate, not by
      theorems.
    stages:
      - title: Text, probability and automata
        intro: >
          A review of what the volume assumes: Unicode text and its bytes,
          regular expressions and transducers, hidden Markov models with
          their three dynamic programs, EM, and the softmax and cross-entropy
          of neural models.
        steps:
          - unicode-code-point
          - utf-8
          - regular-expression
          - finite-state-transducer
          - weighted-automaton
          - maximum-likelihood-estimation
          - hidden-markov-model
          - entry: viterbi-algorithm
            why: the most probable state path of an HMM, exactly, in O(T N^2) time for T observations and N states.
          - forward-backward-algorithm
          - entry: expectation-maximization
            why: never lowers the likelihood, and in general stops at a local maximum.
          - baum-welch-algorithm
          - softmax-regression
          - cross-entropy-loss
          - backpropagation
          - kullback-leibler-divergence
      - title: Tokens and n-gram models
        intro: >
          Text is cut into words, sentences or subword pieces, and a language
          model gives each sequence of tokens a probability. Counts alone give
          zero to what was not seen, so n-gram models are smoothed. The
          smoothing methods here give proper distributions and are compared
          by perplexity on held-out text.
        steps:
          - text-tokenization
          - penn-treebank-tokenization
          - sentence-boundary-detection
          - word-segmentation
          - subword-tokenization
          - wordpiece
          - byte-level-bpe
          - unigram-language-model-tokenization
          - entry: optimal-tokenization-hardness
            why: choosing the vocabulary that gives the fewest tokens is NP-complete, so the subword methods are heuristics.
          - language-model
          - perplexity
          - n-gram-language-model
          - out-of-vocabulary-word
          - laplace-smoothing
          - entry: good-turing-estimation
            why: estimates the total probability of the unseen types as N_1/N.
          - katz-backoff
          - entry: kneser-ney-smoothing
            why: the lower-order model counts the distinct contexts of a word, not its occurrences.
      - title: Word vectors and transformers
        intro: >
          Words used in similar contexts get similar vectors, from count
          matrices or from models trained to predict a word from its
          neighbours. Attention lets each position read every other, and the
          transformer stacks it into the language models that the rest of the
          volume uses. What these models do well is measured, not proved.
        steps:
          - distributional-hypothesis
          - pointwise-mutual-information
          - word-context-matrix
          - word-embedding
          - skip-gram-model
          - negative-sampling
          - entry: sgns-implicit-factorization-theorem
            why: if every dot product is free, the optimum of skip-gram with k negatives factorizes PMI shifted by log k.
          - glove
          - word-analogy
          - neural-probabilistic-language-model
          - recurrent-neural-network-language-model
          - scaled-dot-product-attention
          - multi-head-attention
          - sinusoidal-positional-encoding
          - transformer
          - causal-language-modeling
          - masked-language-modeling
          - bert
          - generative-pretrained-transformer
          - entry: flashattention
            why: exact attention computed in tiles, with fewer transfers to slow memory than the plain computation.
          - entry: neural-scaling-law
            why: power laws fitted to measured training runs, which hold only over the range of the fit.
      - title: Tagging and parsing
        intro: >
          A tagger labels each word and a parser builds a tree over the
          sentence. For HMMs, CRFs, PCFGs and arc-factored dependency models
          the best output is found exactly by dynamic programming or by a
          spanning tree algorithm; transition parsers are greedy and fast.
        steps:
          - sequence-labeling
          - bio-encoding
          - part-of-speech-tagging
          - hmm-part-of-speech-tagger
          - maximum-entropy-markov-model
          - entry: label-bias-problem
            why: a property of locally normalized models such as MEMMs, which motivated CRFs.
          - conditional-random-field
          - entry: structured-perceptron
            why: Viterbi decoding inside the perceptron update; on separable data the number of mistakes is bounded.
          - named-entity-recognition
          - span-f1-score
          - context-free-grammar
          - probabilistic-context-free-grammar
          - probabilistic-cky
          - treebank
          - constituency-parsing
          - parseval-measures
          - dependency-tree
          - projective-dependency-tree
          - dependency-parsing
          - entry: arc-standard-parsing
            why: 2n greedy transitions that can build only projective trees.
          - entry: eisner-algorithm
            why: the best projective tree under arc-factored scores, exactly, in O(n^3) time.
          - edmonds-arborescence
          - entry: mst-dependency-parsing
            why: the maximum spanning arborescence gives the best non-projective tree under arc-factored scores.
          - attachment-score
      - title: Decoding and translation
        intro: >
          A language model is turned into a generator by a decoding rule.
          Greedy and beam search look for the most probable output and need
          not find it, and the most probable output is often not the best.
          Translation adds word alignment, learned by EM from parallel text,
          and the encoder-decoder with attention.
        steps:
          - autoregressive-decoding
          - greedy-decoding
          - length-normalization
          - entry: inadequacy-of-the-mode
            why: a measured fact; the most probable translation is often empty or too short.
          - temperature-sampling
          - top-k-sampling
          - nucleus-sampling
          - key-value-cache
          - entry: speculative-decoding
            why: a draft model proposes tokens, and the acceptance rule keeps exactly the distribution of the large model.
          - parallel-corpus
          - noisy-channel-translation-model
          - word-alignment
          - entry: ibm-model-1
            why: its likelihood is concave, so EM reaches a global maximum, though not always a unique one.
          - entry: hmm-alignment-model
            why: alignments that depend on the previous jump; EM reaches a local maximum.
          - phrase-pair-extraction
          - phrase-based-translation-model
          - encoder-decoder-model
          - additive-attention
          - entry: bleu
            why: clipped n-gram precisions and a brevity penalty over a test set; its agreement with human judgment is measured.
      - title: Speech
        intro: >
          Speech is analysed frame by frame into short spectral vectors.
          Recognition searches for the word sequence that best explains them
          under acoustic, pronunciation and language models, with beam
          pruning, so the search is approximate; end-to-end models learn the
          map directly. Synthesis runs the other way, from text to a waveform.
        steps:
          - short-time-fourier-transform
          - cepstrum
          - linear-predictive-coding
          - source-filter-model
          - mel-scale
          - mel-filter-bank
          - mel-frequency-cepstral-coefficients
          - automatic-speech-recognition
          - source-channel-speech-recognition
          - entry: word-error-rate
            why: substitutions, deletions and insertions of the best alignment over the reference length; it can exceed 1.
          - pronunciation-lexicon
          - gmm-hmm-acoustic-model
          - triphone-model
          - time-synchronous-beam-search
          - word-lattice
          - weighted-transducer-composition
          - hclg-decoding-graph
          - entry: connectionist-temporal-classification
            why: sums over all alignments of the label sequence exactly by forward-backward.
          - text-to-speech
          - grapheme-to-phoneme-conversion
          - unit-selection-synthesis
          - wavenet

  - id: simulation
    title: Simulation of physical systems
    for: a student who knows calculus, linear algebra and basic probability, can program, and wants to learn how particles, fluids, solids and radiation are simulated, and how the uncertainty of a simulation is measured and corrected with data.
    intro: >
      The path goes through Volume 43, after a base of numerical methods
      from Volume 12 and sampling from Volume 17. It keeps the line the
      entries draw between what is proved and what is measured. Direct
      N-body summation is exact up to rounding; tree codes, the fast
      multipole method and mesh methods trade accuracy for speed within
      stated error bounds. Symplectic integrators keep a nearby modified
      energy bounded for a fixed step; they do not conserve the energy
      exactly. Thermostats sample the ensembles their entries state, and
      only under their conditions. A consistent conservative scheme that
      converges has a weak solution as its limit, not necessarily the
      entropy one. Finite element errors and adaptive rates hold under the
      conditions of their theorems. Monte Carlo estimators are unbiased with
      error falling like the inverse square root of the number of samples.
      Turbulence closures, force fields and data assimilation systems are
      models and methods judged by measurement; the Kalman filter is exact
      only for linear Gaussian models.
    stages:
      - title: Time stepping and sampling
        intro: >
          Ordinary differential equations and their integrators from Volume
          12, with the symplectic methods that long simulations of particles
          rely on, then random numbers and the sampling methods of Volume 17
          that Monte Carlo transport, molecular simulation and uncertainty
          quantification use.
        steps:
          - ode-initial-value-problem
          - euler-method
          - backward-euler-method
          - stiff-ode-problem
          - classical-runge-kutta-4
          - hamiltonian-systems
          - verlet-integration
          - entry: symplectic-integrators
            why: for a fixed step they keep a modified energy close to the true one bounded over long times; they do not conserve the energy exactly.
          - stochastic-differential-equation
          - pseudorandom-number-generator
          - entry: monte-carlo-integration
            why: the error falls like N^(-1/2) whatever the dimension.
          - inverse-transform-sampling
          - rejection-sampling
          - importance-sampling
          - markov-chain
          - metropolis-hastings
      - title: Fields on grids
        intro: >
          Polynomials and quadrature, the model partial differential
          equations, finite differences, finite volumes with Riemann problems,
          and Galerkin methods, with the sparse solvers and the fast Fourier
          transform that the later stages call at every step.
        steps:
          - lagrange-interpolation
          - legendre-polynomials
          - orthogonal-polynomials
          - gaussian-quadrature
          - poisson-equation
          - heat-equation
          - advection-equation
          - finite-difference-method
          - entry: courant-friedrichs-lewy-condition
            why: necessary for the stability of an explicit scheme, not sufficient.
          - upwind-scheme
          - finite-volume-method
          - riemann-problem
          - godunov-method
          - total-variation-diminishing
          - navier-stokes-equations
          - galerkin-method
          - finite-element-method
          - sparse-matrix
          - conjugate-gradient-method
          - power-iteration
          - fast-fourier-transform
      - title: Particles
        intro: >
          Chapters 43.1 and 43.2. Gravitating bodies and plasmas need all
          pairwise forces; trees, multipole expansions and meshes make each
          step cheaper than the direct sum. Molecular dynamics adds neighbour
          lists, periodic boxes, Ewald sums for charges, constraints, and
          thermostats that set the ensemble.
        steps:
          - octree
          - gravitational-n-body-problem
          - entry: direct-n-body-summation
            why: exact up to rounding, at Θ(N^2) cost per step.
          - multipole-expansion
          - multipole-acceptance-criterion
          - barnes-hut-algorithm
          - entry: fast-multipole-method
            why: O(N) for a fixed accuracy, with constants that grow with the number of digits.
          - cloud-in-cell-assignment
          - particle-mesh-method
          - boris-pusher
          - plasma-particle-in-cell
          - molecular-dynamics
          - interatomic-potential
          - lennard-jones-potential
          - periodic-boundary-conditions
          - linked-cell-list
          - canonical-ensemble
          - langevin-dynamics
          - entry: nose-hoover-thermostat
            why: the extended dynamics samples the canonical ensemble only if it is ergodic.
          - ewald-summation
          - particle-mesh-ewald
          - p3m-method
          - shake-constraint-algorithm
          - shadow-hamiltonian
      - title: Fluids
        intro: >
          Chapters 43.3 and 43.4. Shocks need conservative schemes, the
          entropy condition and nonlinear limiters; incompressible flow needs a
          pressure that keeps the velocity divergence free; turbulence is
          either resolved at great cost or modelled.
        steps:
          - hyperbolic-conservation-law
          - weak-solution-of-conservation-law
          - rankine-hugoniot-conditions
          - lax-entropy-condition
          - entry: lax-wendroff-theorem
            why: a limit of a consistent conservative scheme is a weak solution, not necessarily the entropy solution.
          - entry: godunov-order-barrier
            why: a linear monotone scheme is at most first order, so high resolution schemes are nonlinear.
          - euler-equations-of-gas-dynamics
          - entry: roe-solver
            why: it accepts expansion shocks unless an entropy fix is added.
          - hll-riemann-solver
          - muscl-scheme
          - strong-stability-preserving-runge-kutta
          - discontinuous-galerkin-method
          - chorin-projection-method
          - entry: kolmogorov-1941-theory
            why: the k^(-5/3) spectrum is a prediction from similarity hypotheses that measurements confirm, not a theorem about the Navier-Stokes equations.
          - entry: direct-numerical-simulation
            why: resolving every scale costs about Re^3.
          - reynolds-averaged-navier-stokes
          - large-eddy-simulation
          - lattice-boltzmann-method
      - title: Solids, fields and radiation
        intro: >
          Chapters 43.5 and 43.6. The finite element method with its
          theorems of existence, error and stability and its adaptive loop;
          then the transport of neutrons and photons, by Monte Carlo histories
          and by deterministic sweeps over directions.
        steps:
          - weak-formulation
          - sobolev-space
          - lagrange-finite-element
          - finite-element-assembly
          - lax-milgram-theorem
          - entry: cea-lemma
            why: under its conditions the Galerkin error is within the factor M/α of the best approximation in the space.
