  - id: theory
    title: The theory of algorithms
    for: a graduate student who wants the tools of analysis and lower bounds.
    intro: >
      How to prove what an algorithm costs and what no algorithm can do. The last two stages point into
      Volume 39: the fine-grained lower bounds there are conditional on hypotheses such as SETH, and apart
      from separations that the hierarchy theorems give, such as P different from EXP, the main questions
      about the classes, P versus NP among them, are open.
    stages:
      - title: Models and analysis
        steps:
          - random-access-machine
          - word-ram
          - turing-machine
          - external-memory-model
          - master-theorem
          - potential-method
          - union-find-amortized-bound
          - average-case-analysis
          - chernoff-bound
          - high-probability-bounds
      - title: Lower bounds
        steps:
          - lower-bound
          - decision-tree-method
          - information-theoretic-bound
          - adversary-argument
          - comparison-sort-lower-bound
          - merging-lower-bound
          - element-distinctness
          - reduction-lower-bound
          - union-find-lower-bound
      - title: Fine-grained questions
        steps:
          - matrix-multiplication-exponent
          - fine-grained-reduction
          - strong-exponential-time-hypothesis
          - orthogonal-vectors-hypothesis
          - edit-distance-hardness
          - backurs-indyk-lcs-lower-bound
      - title: Complexity classes
        steps:
          - p
          - np
          - np-complete
          - entry: p-versus-np-problem
          - entry: cook-levin-theorem
          - entry: karps-21-np-complete-problems
          - pspace
          - entry: time-hierarchy-theorem
            why: if f log f = o(g) for a time-constructible g, then DTIME(f) is a proper subset of DTIME(g), which gives P different from EXP
          - savitch-theorem
          - entry: baker-gill-solovay-theorem
            why: no relativizing proof settles P versus NP

