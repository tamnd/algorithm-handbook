  - id: graphics-and-signals
    title: Graphics and signals
    for: a student who knows linear algebra, a little calculus and probability, and the discrete Fourier transform, and wants to see how pictures are drawn, how light is simulated, and how images and signals are filtered and measured.
    intro: >
      Rasterization first: the pixel and the frame buffer, lines and triangles turned into pixels, clipping,
      filling by a rule, interpolation that respects perspective, and the sampling and filtering that keep the
      result free of jagged edges. Visibility follows: which surface is in front, decided per pixel by the depth
      buffer or per object by sorting and partitioning, and the culling that skips what cannot be seen. Curves
      and surfaces give the shapes themselves, from Bezier curves and de Casteljau's algorithm through B-splines
      and NURBS to subdivision surfaces and the meshes extracted from implicit ones. Ray tracing simulates light:
      the intersection tests, the hierarchies that make them fast, the rendering equation, and the Monte Carlo
      estimators that solve it. The last two stages treat the image and the signal as data: filtering, edges,
      segmentation and features for images, and sampling, filters, spectra and sparse recovery for signals. Each
      step says which part is proved and which part is judged by eye or by measurement.
    stages:
      - title: Drawing pixels
        steps:
          - pixel
          - frame-buffer
          - graphics-pipeline
          - viewport-transform
