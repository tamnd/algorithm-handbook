          - propensity-score-matching
          - entry: augmented-inverse-probability-weighting
            why: consistent if either the outcome model or the propensity model is correct, and its standard errors are asymptotic.
          - rosenbaum-sensitivity-analysis
          - difference-in-differences
          - instrumental-variables-estimation
          - local-average-treatment-effect

  - id: electronic-design-automation
    title: Electronic design automation
    for: a student who knows graphs and shortest paths, Boolean functions, basic linear algebra and a little numerical analysis, and has met NP-completeness, and wants to follow a chip from a behavioural description to a tested layout, and to see which steps of the flow are solved exactly, which rest on models or bounds, and which are heuristics judged only by measured results.
    intro: >
      The path follows the design flow. High-level synthesis schedules and binds the operations of a data flow
      graph; scheduling under resource limits is NP-hard, so its exact methods are integer programs and its fast
      ones are heuristics, while difference constraints give integral schedules in polynomial time when resources
      are left out. Logic synthesis minimizes two-level and multi-level logic, maps it to cells or lookup tables and
      moves registers by retiming; Quine-McCluskey, FlowMap and minimum-period retiming are exact, Espresso and AIG
      rewriting are heuristics. Simulation covers event-driven logic simulation and the Newton, sparse LU and implicit
      integration steps of circuit simulation, whose answers are only as good as the device models. Verification
      checks equivalence and properties with BDDs and SAT: model checking is complete for finite models, bounded model
      checking only up to its bound, and signal correspondence is sound but not complete. Physical design comes next.
      Partitioning, floorplanning, placement and routing are NP-hard in their usual forms, so apart from exact results
      such as Hanan's theorem, the 3/2 Steiner ratio, Stockmeyer's sizing of a slicing floorplan and the left-edge
      algorithm without vertical constraints, their methods are measured on benchmarks. Timing rests on delay models:
      static timing analysis is exact for its model but pessimistic, Elmore delay is a model and an upper bound on the
      50 percent delay of an RC tree, and buffering and sizing are optimal only under that model. Power estimates rest
      on probability models of switching, and the yield, electromigration and mismatch models are empirical fits. Test
      generation is complete for single stuck-at faults, and the defect level and aliasing formulas are exact only in
      their models. The path ends with FPGA, analog, 3D and quantum design, where the same methods return.
    stages:
      - title: High-level synthesis and scheduling
        intro: >
          A behavioural description becomes a control and data flow graph, and a schedule and a binding turn it into
          a controller and a datapath. ASAP and ALAP schedules come from longest paths; scheduling with resource
          limits is NP-hard, solved exactly by integer programming in exponential worst-case time or quickly by
          heuristics. Register binding on intervals and the iteration bound of a recursive graph are exact results.
        steps:
          - directed-acyclic-graph
          - control-data-flow-graph
          - finite-state-machine-with-datapath
          - high-level-synthesis
          - dag-longest-path
          - entry: asap-alap-scheduling
            why: the earliest and latest step of each operation, by longest paths in the DAG, which bound every schedule and give each operation its mobility.
          - entry: resource-constrained-scheduling
            why: NP-hard in general, so the fast schedulers for it are heuristics judged by the latencies they reach on benchmarks.
          - force-directed-scheduling
          - binary-integer-programming
          - entry: ilp-scheduling-formulation
            why: gives an optimal schedule, at the price of an integer program whose solution time can grow exponentially with the design.
          - difference-constraints
          - total-unimodularity
          - entry: sdc-scheduling
            why: timing and latency rules as difference constraints give an integral LP optimum in polynomial time; resource limits enter through a heuristic order, so the schedule can be longer than the best.
          - resource-compatibility-graph
          - entry: register-binding
            why: for straight-line code the left-edge algorithm reaches the fewest registers, the largest number of values live in one step; with values live around a loop the problem is NP-complete.
          - entry: iteration-bound
            why: no schedule of a recursive data flow graph has a shorter sample period than its largest ratio of loop delay to loop registers, and retiming with unfolding reaches it.
      - title: Logic synthesis and technology mapping
        intro: >
          Two-level minimization is NP-hard, solved exactly by prime implicants and a covering step and in practice by
          the heuristic Espresso. Multi-level synthesis works on Boolean networks and and-inverter graphs by algebraic
          division and rewriting, both measured by the literals or nodes they save. Technology mapping is optimal on
          trees and, for depth with lookup tables, on general networks by FlowMap. Retiming moves registers to the
          least clock period in polynomial time.
        steps:
          - boolean-circuit
          - boolean-function
          - sum-of-products
          - prime-implicant
          - dont-care-condition
          - entry: two-level-logic-minimization
            why: NP-hard from a truth table and Sigma_2^p-complete from a sum of products, so exact minimizers take exponential time in the worst case.
          - set-cover
          - entry: quine-mccluskey
            why: exact, all prime implicants and then a minimum cover, in time exponential in the number of variables.
          - shannon-expansion
          - unate-recursive-paradigm
          - entry: espresso
            why: a heuristic whose covers are prime and irredundant but not proved minimum; its quality is known from measured results on benchmark functions.
          - boolean-network
          - kernel-extraction
          - entry: and-inverter-graph
            why: two-input AND nodes with inverted edges, kept free of duplicates by structural hashing, the form on which modern synthesis and equivalence checking work.
          - aig-rewriting
          - technology-mapping
          - entry: tree-covering-technology-mapping
            why: optimal on each tree of the subject graph by dynamic programming, but cutting the graph into trees gives up optimality for the whole network.
          - k-feasible-cut
          - entry: flowmap
            why: a k-LUT mapping of least depth in polynomial time, by a max-flow test at each node; it minimizes depth, not the number of LUTs.
          - entry: retiming
            why: a retiming of least clock period in polynomial time, by binary search over the period and Bellman-Ford on difference constraints.
      - title: Simulation and verification
        intro: >
          Logic simulation evaluates a design for given inputs, and circuit simulation solves Kirchhoff's laws with
          nonlinear device models by Newton's method, sparse LU and implicit integration; Newton's method converges
          only from a good start, which the continuation methods try to supply. Verification proves what simulation
          only samples. Combinational equivalence is coNP-complete and sequential equivalence PSPACE-complete for
          netlists. Model checking is complete for finite models, bounded model checking finds counterexamples only up
          to its bound, and simulation-based verification is judged by the coverage it measures.
        steps:
          - logic-simulation
          - event-driven-logic-simulation
          - kirchhoff-circuit-laws
          - modified-nodal-analysis
          - entry: newton-method-for-systems
            why: the iteration behind every DC and transient solve; it converges fast near a solution but needs a good start.
          - dc-operating-point-analysis
          - sparse-linear-systems
          - backward-differentiation-formulas
          - companion-model
          - transient-circuit-analysis
          - miter-circuit
          - entry: reduced-ordered-bdd
            why: canonical for a fixed variable order, so equivalence is a pointer test, but its size can be exponential and depends on the order.
          - sat
          - cdcl
          - tseitin-transformation
          - sat-sweeping
          - cutpoint-equivalence-checking
          - entry: sequential-equivalence-checking
            why: reduces to reachability on the product machine and is PSPACE-complete for circuits given as netlists.
          - entry: signal-correspondence
            why: sound but not complete, it proves equivalence by an inductive invariant and misses an equivalence that depends on unreachable states.
          - entry: symbolic-model-checking
            why: complete for finite models, by fixed points over BDDs of state sets, though those BDDs can grow exponentially.
          - entry: bounded-model-checking
            why: finds every counterexample up to length k, and proves nothing beyond that bound unless k reaches a completeness threshold.
          - entry: ic3-pdr
            why: proves invariants of finite systems by one-step SAT queries, without unrolling, and also finds counterexamples.
          - assertion-based-verification
          - constrained-random-stimulus-generation
      - title: Partitioning, floorplanning and placement
        intro: >
          Balanced hypergraph partitioning, floorplanning and placement are NP-hard, and their methods, from
          Fiduccia-Mattheyses refinement and multilevel schemes to annealing over floorplan codes and analytical
          placement, are judged by measured cut sizes, areas and wire lengths on benchmarks. The exact results are
          narrower, such as the least-area sizing of a given slicing floorplan, and the convex objectives that analytical
          placers minimize exactly but that only stand in for wire length.
        steps:
          - hypergraph-partitioning
          - kernighan-lin
          - entry: fiduccia-mattheyses
            why: one pass of single-vertex moves with bucket gains in time linear in the pins; it finds a local minimum, not the least cut.
          - multilevel-hypergraph-partitioning
          - entry: rents-rule
            why: an empirical law fitted to real circuits, used to predict terminal counts, cut sizes and wire length.
          - floorplanning
          - slicing-floorplan
          - normalized-polish-expression
          - entry: stockmeyer-floorplan-sizing
            why: the least-area realization of a given slicing floorplan, found exactly by merging shape lists; choosing the floorplan is the hard part.
          - simulated-annealing
          - entry: wong-liu-floorplanning
            why: annealing over normalized Polish expressions, with no bound on the result; it is judged by measured area and wire length.
          - sequence-pair
          - placement-problem
          - entry: half-perimeter-wirelength
            why: the cost most placers optimize, a lower bound on every rectilinear tree of a net and equal to the shortest one for two or three pins.
          - entry: quadratic-placement
            why: its convex quadratic is minimized exactly by a sparse solve, but it stands in for wire length and clusters cells, so the placement is judged after spreading.
          - conjugate-gradient-method
          - electrostatics-based-placement
          - placement-legalization
          - abacus-legalization
      - title: Routing
        intro: >
          Maze routing finds a shortest path for one connection on a grid whenever one exists. Steiner trees for nets
          are NP-hard to find, but Hanan's theorem limits the search to a finite grid and the rectilinear spanning tree
          is within 3/2 of the optimum. Global routing with capacities is solved by negotiation, with no proof of
          success, or by multicommodity flow within a proved factor of the fractional optimum before rounding. Channel
          routing is NP-complete, and the left-edge algorithm is optimal only without vertical constraints.
        steps:
          - entry: lee-maze-routing
            why: breadth-first search on the grid, which finds a shortest path whenever one exists.
          - rectilinear-steiner-tree-problem
          - entry: hanan-theorem
            why: some rectilinear Steiner minimal tree lies on the grid of lines through the pins, which makes the problem finite.
          - rectilinear-minimum-spanning-tree
          - entry: hwang-rectilinear-steiner-ratio
            why: the rectilinear MST is at most 3/2 times the Steiner minimal tree, and the bound is tight.
          - iterated-one-steiner
          - entry: flute
            why: optimal trees from tables for nets of up to nine pins; larger nets are split, and for them the result is a heuristic with no proved ratio.
          - global-routing
          - rip-up-and-reroute
          - entry: negotiated-congestion-routing
            why: there is no general proof that it reaches a legal routing; its success is measured on benchmarks.
          - entry: multicommodity-flow-global-routing
            why: the fractional routing is within a factor 1 + epsilon of its optimum and gives a lower bound; rounding to one route per net loses that guarantee.
          - detailed-routing
          - channel-routing-problem
          - channel-density
          - vertical-constraint-graph
          - entry: left-edge-algorithm
            why: meets the density lower bound on tracks when the vertical constraint graph has no edges.
          - channel-routing-np-completeness
          - greedy-channel-router
      - title: Timing, power, reliability and manufacturability
        intro: >
          Static timing analysis is exact for its delay model in one linear pass, but counts false paths and so is
          pessimistic. Wire delay comes from RC models, of which Elmore delay is the simplest and an upper bound on the
          50 percent delay of an RC tree; clock tree, buffering and sizing algorithms are at best optimal under such models, not for the silicon.
          Power estimates rest on probabilistic models of switching. Electromigration, yield and defect models are
          empirical fits to measured data, and the layout checks at the end are exact for the rules they are given.
        steps:
          - timing-graph
          - arrival-and-required-time
          - entry: static-timing-analysis
            why: exact for its delay model in time linear in the timing graph, with no input vectors, but pessimistic since it counts paths no vector sensitizes.
          - false-path
          - rc-tree
          - entry: elmore-delay
            why: a model, the first moment of the impulse response; on an RC tree it is an upper bound on the 50 percent delay, not the delay itself.
          - entry: statistical-static-timing-analysis
            why: rests on a model of variation, often linear in Gaussian sources, with an approximate statistical max.
          - clock-tree-synthesis
          - entry: deferred-merge-embedding
            why: zero skew with least wire length for a given topology under linear delay; under the Elmore delay it keeps zero skew but its wire length is only heuristic.
          - entry: van-ginneken-buffer-insertion
            why: the best source slack for a fixed routing tree under the Elmore model, by dynamic programming over load and required-time pairs.
          - gate-sizing
          - lagrangian-relaxation
          - entry: lagrangian-relaxation-gate-sizing
            why: exact for continuous sizes under the Elmore delay; a library of discrete sizes needs rounding.
          - dynamic-power-dissipation
          - switching-activity
          - entry: signal-probability-propagation
            why: exact without reconvergent fanout and under independent inputs; with reconvergence the gate formulas only approximate.
          - power-grid-analysis
          - entry: black-equation
            why: an empirical model of electromigration lifetime whose constants are fitted to accelerated tests of one wire technology.
          - critical-area
          - entry: poisson-yield-model
            why: assumes defects fall independently and uniformly, an assumption real wafers break.
          - entry: negative-binomial-yield-model
            why: adds a clustering parameter fitted to wafer data, so it matches clustered defects better but is still an empirical fit.
          - design-rule-checking
          - optical-proximity-correction
      - title: Test and diagnosis
        intro: >
          Test generation for a single stuck-at fault is NP-complete, yet the D-algorithm, PODEM and SAT-based ATPG are
          complete: given time, each finds a test or proves the fault redundant. Fault simulation measures coverage, and
          the Williams-Brown formula turns coverage and yield into a defect level that is exact only in its model. Scan
          and built-in self-test make large circuits testable, with aliasing probabilities that hold under a model of
          random errors. Diagnosis reasons back from failing outputs to the faults that could explain them.
        steps:
          - stuck-at-fault-model
          - automatic-test-pattern-generation
          - d-algorithm
          - entry: podem
            why: complete, it finds a test or proves the fault redundant, with a search tree of at most 2^(n+1) - 1 nodes for n inputs.
          - sat-based-atpg
          - fault-simulation
          - fault-coverage
          - entry: williams-brown-defect-level
            why: exact in a model where faults are equally likely and independent, so its error comes from those assumptions.
          - scan-design
          - linear-feedback-shift-register
          - built-in-self-test
          - multiple-input-signature-register
          - entry: signature-aliasing-probability
            why: tends to 2^(-k) for a k-bit register, under a model of independent random bit errors.
          - effect-cause-diagnosis
      - title: FPGA, analog and emerging technologies
        intro: >
          FPGA tools pack, place and route on a fixed fabric, with annealing placers measured by wire length and
          minimum channel width. Analog sizing becomes a convex geometric program whose global optimum is only as good
          as the fitted device equations, and matching rests on Pelgrom's empirical model. 3D integration and qubit
          mapping bring the partitioning and routing problems back in new forms, still NP-hard and still measured.
        steps:
          - island-style-fpga
          - fpga-logic-cluster
          - fpga-packing
          - fpga-timing-driven-annealing-placement
          - routing-resource-graph
          - minimum-channel-width
          - analog-circuit-sizing
          - geometric-programming
          - entry: geometric-programming-circuit-sizing
            why: an interior-point method finds the global optimum of the posynomial model, which is built on fitted device equations, so the design must still be simulated.
          - entry: pelgrom-mismatch-model
            why: an empirical model in which mismatch falls as one over the square root of gate area, with constants measured for each process.
          - common-centroid-layout
          - three-dimensional-integrated-circuit
          - entry: qubit-mapping
            why: NP-complete in its standard forms, so mappers such as SABRE are judged by measured SWAP counts and depth.
          - sabre-qubit-mapping
  - id: cad
    title: CAD
    for: a student who knows Bézier curves and B-splines, Delaunay triangulations, Newton's method and linear least squares, and wants to follow a mechanical part from its first sketch to its measurement, and to see which steps of the work are exact, which are exact only for a model or for generic data, and which are heuristics judged by measured results.
    intro: >
      The path follows the life of a part. A solid is a set, and its trees of operations and boundary representations
      are proved correct on exact real numbers; with floating point their tests can disagree, so the path meets exact
      geometric computation, which makes every predicate exact, and tolerant modeling, which accepts small gaps. Curved
      faces are intersected and projected by Newton's method, which converges fast but only from a good start, by
      marching, which can miss a small loop, and by subdivision, which finds every piece but only to a tolerance;
      implicitization by resultants is exact. Sketches are constraint systems: solving them is NP-hard, and Laman's
      count and the theorems on global rigidity hold for almost every placement, not for every one. Mechanism synthesis
      at precision points is exact, Burmester's theory and Freudenstein's equation among it, while synthesis by
      optimization finds local optima; assembly partitioning is NP-complete in general and polynomial for one
      translation. Meshes come next: repair and Booleans rest on exact arrangements or on winding numbers, geodesics
      are exact by MMP and approximate by the heat method, and meshes for analysis carry proved angle bounds for
      Delaunay refinement and isosurface stuffing, but none for advancing front, paving and most hexahedral meshers,
      whose quality is measured. Isogeometric analysis has proved rates under stated assumptions. Toolpaths, support
      structures and process plans are judged by measured time and error; nesting and setup planning are NP-hard;
      the K-factor, Chvorinov's rule and Taylor's tool life are empirical laws with fitted constants. Inspection ends
      the path: minimum zone flatness is exact, minimum zone cylindricity and point-cloud alignment reach local optima,
      and Monte Carlo tolerance analysis has a sampling error that falls as one over the square root of the samples.
    stages:
      - title: Solids and their representations
        intro: >
          A solid is a regular closed set, and a model is a finite description of it: a CSG tree, a boundary
          representation, or an exact Nef complex. The Euler-Poincaré formula checks the counts of a boundary. Booleans
          are exact on the real RAM, but rounded tests can contradict each other, so modelers either compute every
          predicate exactly or store a tolerance with each edge and vertex and accept that the result is right only up
          to it.
        steps:
          - real-ram
          - floating-point-arithmetic
          - orientation-test
          - euler-formula
          - entry: r-set
            why: Requicha's definition of a solid as a bounded, closed, regular, semianalytic set, so that every model in the volume describes a set with an interior and a boundary.
          - regularized-set-operations
          - constructive-solid-geometry
          - set-membership-classification
          - boundary-representation
          - winged-edge-data-structure
          - entry: euler-poincare-formula
            why: an exact identity for the counts of vertices, edges, faces, loops, shells and holes, which a valid boundary must satisfy but which does not prove it valid.
          - boundary-evaluation
          - solid-boolean-operations
          - entry: geometric-robustness-problem
            why: rounded geometric tests can disagree with each other, so a correct algorithm can return an impossible topology.
          - entry: exact-geometric-computation
            why: makes every predicate exact, with filters and adaptive precision, so the combinatorial output is always correct.
          - entry: tolerant-modeling
            why: stores a tolerance with each vertex and edge, so a gap smaller than it counts as closed; the model is valid only up to that tolerance.
          - nef-polyhedron
          - solid-offsetting
      - title: Freeform surfaces, intersections and fairing
        intro: >
          The faces of a part are trimmed spline surfaces. Projection and intersection use Newton's method, which
          converges quadratically near a regular solution but finds the nearest point only from a good start, marching,
          which can miss a small loop, and subdivision, which finds every piece to a tolerance. Tests such as the
          Sederberg-Meyers condition rule loops out, and interval methods enclose every root. Fairing and continuity
          checks show defects; no energy defines fairness, so a fair surface is fair only in the sense of its energy.
        steps:
          - bezier-curve
          - b-spline
          - nurbs
          - parametric-surface
          - fundamental-forms
          - surface-curvature
          - newton-method-for-systems
          - trimmed-surface
          - point-projection-onto-a-surface
          - entry: newton-point-inversion
            why: converges quadratically near a nondegenerate foot point, but returns the nearest point only if the start grid is fine enough, which the method cannot check.
          - surface-surface-intersection
          - entry: marching-surface-intersection
            why: traces each branch from a start point by stepping and Newton correction; without a start point on a branch, such as a small closed loop, the branch is missed.
          - entry: lattice-evaluation-intersection
            why: misses any loop of the intersection that fits inside one cell of the lattice.
          - entry: sederberg-meyers-loop-detection
            why: a tangent-cone condition that proves two patches can meet in no closed loop, so marching from boundary points finds every branch.
          - entry: tangential-surface-intersection
            why: where the surfaces touch, the Newton matrix is singular and marching fails, so these cases need their own methods.
          - interval-arithmetic
          - entry: interval-projected-polyhedron
            why: returns boxes smaller than a given tolerance that hold every root, with outward rounding, so no root is lost.
          - resultant
          - entry: implicitization
            why: exact by resultants, but a bicubic patch has an implicit equation of degree up to 18.
          - entry: energy-based-surface-fairing
            why: minimizes a bending energy; since no energy defines fairness, the result is fair only in the sense of the energy chosen.
      - title: Sketches and geometric constraints
        intro: >
          A sketch is a set of points and lines tied by distances, angles and incidences. Solving such a system is
          NP-hard already for distances on a line, so the theory looks at rigidity. Laman's theorem and the pebble game
          decide rigidity in the plane for generic placements; in space counting fails. Global rigidity has an exact
          generic characterization by stress matrices. Solvers decompose the constraint graph into small rigid pieces,
          and then must still choose among exponentially many solutions.
        steps:
          - geometric-constraint
          - geometric-constraint-graph
          - entry: geometric-constraint-problem
            why: NP-hard already for distances in one dimension, so complete solvers are exponential in the worst case.
          - distance-geometry-problem
          - rigidity-matrix
          - infinitesimal-rigidity
          - entry: asimow-roth-theorem
            why: at a regular placement, rigidity equals infinitesimal rigidity, a rank test on the rigidity matrix; at special placements the two can differ.
          - generic-rigidity
          - entry: laman-theorem
            why: an exact count for minimal rigidity in the plane, valid for generic placements only.
          - entry: pebble-game-rigidity
            why: tests Laman's condition exactly in O(n^2) time for a graph with 2n - 3 edges.
          - entry: double-banana-graph
            why: passes every subset count in space and still flexes, so Laman's count has no direct analogue in three dimensions.
          - global-rigidity
          - entry: gortler-healy-thurston-theorem
            why: with Connelly's theorem, a generic framework on n >= d + 2 points is globally rigid exactly when it has an equilibrium stress matrix of rank n - d - 1.
          - entry: fudos-hoffmann-reduction
            why: solves triangle-decomposable systems in the plane exactly; a well-constrained system that is not triangle-decomposable stops with several clusters.
          - entry: root-identification-problem
            why: a well-constrained sketch can have exponentially many solutions, and the choice of the intended one is a heuristic, usually keeping the orientations of the draft.
      - title: Mechanisms and assemblies
        intro: >
          Linkages, cams and gears move the parts. Position analysis of a four-bar is exact by vector loops, and the
          Grashof condition is an exact test of full rotation. Synthesis at precision points is exact: one linear solve
          for three-point function generation and at most four cranks for five positions. Synthesis by optimization
          gives a design, not a certificate. Assembly planning searches over subassemblies; partitioning is NP-complete
          in general, and polynomial for one translation.
        steps:
          - four-bar-linkage
          - vector-loop-closure
          - entry: grashof-condition
            why: an exact test, s + l <= p + q, for whether some link of a four-bar turns fully.
          - entry: freudenstein-equation
            why: linear in its three constants, so three-point function generation needs one 3 by 3 linear solve.
          - entry: chebyshev-spacing
            why: minimizes the node factor of the error bound, not the error itself.
          - entry: burmester-theory
            why: an exact theory that gives at most four Burmester points for five positions.
          - entry: roberts-chebyshev-theorem
            why: every four-bar coupler curve is traced by two other four-bars, its cognates.
          - entry: nine-point-path-synthesis
            why: the count of 1442 solutions came from numerical homotopy continuation, strong evidence but not a proof.
          - entry: optimization-based-linkage-synthesis
            why: finds local optima and gives a design, not a certificate that a better one does not exist.
          - fundamental-law-of-gearing
          - liaison-graph
          - and-or-graph-of-assembly-plans
          - assembly-sequence-planning
          - entry: assembly-partitioning
            why: NP-complete in the plane for general motions, after Kavraki, Latombe and Wilson.
          - entry: non-directional-blocking-graph
            why: decides in polynomial time whether a subassembly can be removed by one translation.
      - title: Meshes, repair and geometry processing
        intro: >
          A part leaves the modeler as a triangle mesh, often with gaps, flipped faces and self-intersections. Repair
          closes and orients it; exact arrangements give Booleans that hold on any input, and the generalized winding
          number decides inside and outside even when the mesh is broken, with a value that degrades smoothly. On
          the mesh, the cotangent Laplacian gives curvature, smoothing and geodesics: exact by the MMP algorithm,
          approximate by the heat method. Parameterizations flatten pieces of the surface.
        steps:
          - polygon-mesh
          - manifold-mesh
          - entry: mesh-repair-problem
            why: ill-posed, since the input does not say what shape it should have been; a repair is right only relative to a target and a measure of change, and the usual pipelines have no global guarantee.
          - mesh-self-intersection
          - entry: generalized-winding-number
            why: is 1 inside and 0 outside a closed mesh and degrades smoothly on a broken one, so the inside of a damaged mesh can still be decided by thresholding.
          - mesh-boolean-operations
          - mesh-arrangements
          - cotangent-laplacian
          - entry: laplacian-smoothing
            why: removes noise but also shrinks the mesh.
          - discrete-geodesic-problem
          - entry: mmp-geodesic-algorithm
            why: computes exact geodesic distance on a polyhedral surface in O(n^2 log n) time.
          - entry: heat-method
            why: approximates geodesic distance with two sparse linear solves, faster than exact methods but not exact.
          - mesh-parameterization
          - entry: tutte-embedding
            why: with the boundary fixed on a strictly convex polygon and positive weights, one sparse linear solve gives a one-to-one map with no flipped triangle.
          - least-squares-conformal-maps
          - metro-mesh-comparison
      - title: Meshes for analysis
        intro: >
          A solver needs elements of good shape, rated by quality measures. Delaunay refinement has proved angle bounds
          in the plane and proved radius-edge bounds in space when the input angles are not too small, but slivers pass
          the radius-edge test and need exudation, whose proved bound is tiny and whose measured angles are larger.
          Quadtree meshing and isosurface stuffing have proved bounds. Advancing front, paving and frame-field
          hexahedral meshers have no quality bound, and sweeping is proved valid only for affine layers, so their
          quality is measured.
        steps:
          - delaunay-triangulation
          - constrained-delaunay-triangulation
          - mesh-quality-measures
          - delaunay-refinement
          - entry: ruppert-algorithm
            why: with input angles of at least 60 degrees, no output angle is below arcsin(1/(2B)), about 20.7 degrees for B = sqrt 2, and for B > sqrt 2 the size is within a constant factor of the optimum.
          - entry: quadtree-mesh-generation
            why: proved aspect ratio at most 4 and size within a constant factor of the optimum.
          - entry: tetrahedral-delaunay-refinement
            why: bounds the radius-edge ratio by B for B >= 2 when the input angles are at least 90 degrees, but slivers can remain.
          - sliver-tetrahedron
          - entry: sliver-exudation
            why: removes slivers with a proved angle bound that is tiny; measured angles are about 5 degrees.
          - entry: isosurface-stuffing
            why: proved dihedral angles between about 10.78 and 164.74 degrees, shown with computer assistance.
          - entry: advancing-front-mesh-generation
            why: builds elements from the boundary inward with good quality in practice and no proved guarantee.
          - entry: paving
            why: an all-quadrilateral heuristic with good boundary elements, judged by measured quality.
          - entry: hexahedral-mesh-existence-theorem
            why: an even number of boundary quads on a ball is enough for a hexahedral mesh, but the theorem is topological and says nothing of element quality.
          - hexahedral-sweeping
          - frame-field-hex-meshing
          - optimization-based-mesh-smoothing
      - title: Analysis on the design
        intro: >
          Isogeometric analysis runs the finite element method on the splines of the design. Its approximation rates
          are proved on shape-regular meshes for a range of Sobolev orders. Local refinement needs T-splines or
          hierarchical splines; T-spline blending functions can be linearly dependent, and analysis-suitable T-meshes
          are the class where independence is proved. Trimmed and cut geometries need stabilization, and volume
          parameterization of a B-rep is the main gap between design and analysis.
        steps:
          - finite-element-method
          - gaussian-quadrature
          - entry: isogeometric-analysis
            why: uses the basis of the CAD model as the finite element basis, so the geometry stays exact under refinement.
          - bezier-extraction
          - k-refinement
          - entry: nurbs-approximation-estimates
            why: proves the rate h^(l - k) on shape-regular meshes for 0 <= k <= l <= p + 1, under those assumptions only.
          - hierarchical-b-spline
          - t-spline
          - entry: t-spline-linear-independence
            why: general T-splines can be linearly dependent, as Buffa and coauthors showed with 40 functions spanning a space of dimension 39.
          - entry: analysis-suitable-t-spline
            why: the class of T-meshes whose blending functions are proved linearly independent.
          - entry: trimmed-isogeometric-analysis
            why: small cut elements need stabilization, and boundary conditions are imposed weakly.
          - entry: cut-finite-element-method
            why: needs a ghost penalty to stay stable on small cut elements.
          - defeaturing
          - volumetric-spline-parameterization
      - title: Machining and printing
        intro: >
          A printer slices the part into layers and adds supports under overhangs; a milling machine follows a toolpath
          of cutter locations. Slicing a mesh is exact computational geometry with a proved running time, but layer
          heights, supports, toolpaths and tool orientations are judged by measured build time, surface error and
          material. Nesting is NP-hard in the strong sense and is solved by heuristics, and topology optimization by SIMP
          finds a local optimum of a penalized problem.
        steps:
          - slicing-for-additive-manufacturing
          - entry: triangle-mesh-slicing
            why: cuts a mesh by k planes in O(n log k + k + m) expected time, where m is the output size.
          - build-orientation
          - support-structure-generation
          - toolpath-planning
          - contour-parallel-toolpath
          - pocket-machining
          - scallop-height
          - gouge-detection
          - five-axis-tool-orientation
          - nc-verification
          - entry: nesting-problem
            why: NP-hard in the strong sense, so practical nesting is heuristic and judged by measured material use.
          - topology-optimization
          - entry: simp-method
            why: finds a local optimum of a penalized problem, not the global optimum of the 0/1 problem.
      - title: Process planning
        intro: >
          A process plan chooses setups, orders operations and fixes the part. Setup planning has set cover at its core
          and is NP-hard, and operation sequencing is a traveling salesman problem with precedence. A* bend sequencing is
          exact for its cost model with an admissible heuristic, in exponential worst-case time. Fixture analysis for
          frictionless point locators is an exact rank test. The K-factor, Chvorinov's rule and Taylor's tool life are
          empirical laws whose constants are fitted to measurements.
        steps:
          - set-cover
          - traveling-salesman-problem
          - a-star-search
          - computer-aided-process-planning
          - entry: setup-planning
            why: its core is set cover, so it is NP-hard and planners use heuristics or small exact searches.
          - operation-sequencing
          - entry: three-two-one-locating-principle
            why: three, two and one locators remove all six degrees of freedom; for frictionless point contacts the position is determined exactly when the locator Jacobian has full rank 6.
          - kinematic-fixture-analysis
          - fixture-planning
          - bend-sequence-planning
          - entry: a-star-bend-sequencing
            why: exact for its cost model with an admissible heuristic, but exponential in the number of bends in the worst case.
          - entry: k-factor
            why: a measured value of about 0.3 to 0.5, not derived from theory, which sets the bend allowance.
          - entry: chvorinov-rule
            why: an empirical law; the exponent is near 2 and the mold constant is fitted.
          - entry: taylor-tool-life-equation
            why: an empirical law, V T^n = C, a fit to data whose constants a shop measures for its own tool and work material.
      - title: Inspection, reverse engineering and tolerancing
        intro: >
          A measuring machine probes the part, and the points are aligned to the model and fitted with planes, circles
          and cylinders. Alignment is exact in closed form when point pairs are known and a local minimum when they are
          not. The minimum zone is the definition of a form tolerance: exact for flatness through the convex hull, a
          local optimum for cylindricity, and never beaten by the least-squares feature. Algebraic fits are biased under
          noise. Worst-case stack-up gives the exact range of an assembly dimension; root sum of squares rests on
          independence and normality, and Monte Carlo estimates carry sampling error.
        steps:
          - least-squares-problem
          - kabsch-algorithm
          - convex-hull-3d
          - geometric-dimensioning-and-tolerancing
          - form-error-evaluation
          - entry: minimum-zone-flatness
            why: exact, by testing the face-vertex and edge-edge pairs of the convex hull of the measured points.
          - entry: minimum-zone-cylindricity
            why: a nonconvex problem whose solvers find a local minimum with no global guarantee.
          - entry: least-squares-reference-feature
            why: exact for its own objective, but its zone is never narrower than the minimum zone, so it can report a larger form error than the part has.
          - entry: inspection-localization
            why: closed form when point pairs are known; without them, iterative alignment reaches only a local minimum.
          - entry: algebraic-distance-fitting
            why: a linear problem, exact on noise-free data but biased under noise.
          - geometric-primitive-fitting
          - reverse-engineering-of-geometric-models
          - entry: tolerance-stack-up
            why: the worst case sum is the exact range; the root sum of squares assumes independent, normal variations.
          - entry: monte-carlo-tolerance-analysis
            why: estimates the fraction of good assemblies with an error that falls as one over the square root of the number of samples.
  - id: compilers-and-program-analysis
    title: Compilers and program analysis
    for: a student who knows graph search and dominators, basic logic and the lambda calculus, and has met NP-completeness and undecidability, and wants to follow a program from its syntax tree to machine code and through the analyses that prove facts about it, and to see which steps are proved correct or optimal, which problems are undecidable or NP-hard, and which methods are heuristics judged only by measured results.
    intro: >
      The path follows a compiler from source to machine code and then turns to the analyses that prove facts about
      programs. Every nontrivial question about what a program computes is undecidable, so each analysis is sound in
      one direction and approximate in the other, and how close it comes is measured. Type inference comes first:
      algorithm W finds principal types for Hindley-Milner programs, ML typability is DEXPTIME-complete yet fast in
      practice, and inference for System F or with polymorphic recursion is undecidable. Intermediate representations
      follow, with dominators, dominance frontiers and SSA form; minimal SSA can need a quadratic number of
      phi-functions, while the counts measured on real programs grow about linearly. Dataflow analysis computes fixed
      points of monotone functions on lattices: the iterative algorithm stops on lattices of finite height, its
      maximal fixed point equals the meet over all paths for distributive frameworks, and abstract interpretation is
      sound relative to a concretization and stops on infinite domains by widening. Optimizations rest on these
      analyses: lazy code motion is optimal among safe placements, value equality is undecidable, the best code
      layout is NP-hard, and inlining and profile-guided choices are judged by measured speed. Loop transformations
      need dependence tests that are conservative, exact for integer constraints only at exponential worst-case cost,
      and the polyhedral model is exact only for affine loop nests. Code generation is optimal on trees for a cost
      model; register allocation as graph coloring and instruction scheduling are NP-complete, chordal SSA
      interference graphs color optimally, and linear scan, modulo scheduling and JIT compilation are judged by
      measurement. Precise pointer analysis is undecidable; Andersen's analysis is cubic and Steensgaard's almost
      linear. The path ends with verification and synthesis: verification conditions prove partial correctness from
      given invariants, invariant synthesis is undecidable in general, and LTL synthesis is 2EXPTIME-complete.
    stages:
      - title: Types and type inference
        intro: >
          A type system assigns types to the phrases of a program and rejects the programs it cannot type. Soundness
          is a theorem about a stated calculus and semantics, proved by progress and preservation, and it rules out
          only what that semantics calls stuck. Unification gives inference for Hindley-Milner programs, with a
          principal type for every typable term and a DEXPTIME-complete decision problem that is fast on real code.
          Richer systems lose inference: System F and polymorphic recursion are undecidable, so they ask for annotations.
        steps:
          - abstract-syntax-tree
          - lambda-calculus
          - type-system
          - type-checking-problem
          - simply-typed-lambda-calculus
          - entry: type-soundness
            why: progress and preservation, proved for the simply typed calculus under call-by-value, which shows the form of every soundness proof and what it leaves out.
          - robinson-unification
          - type-inference-problem
          - let-polymorphism
          - hindley-milner-type-system
          - entry: algorithm-w
            why: inference by unification, sound and complete for Hindley-Milner, exponential in the worst case and fast on the programs people write.
          - principal-type-theorem
          - entry: ml-typability-dexptime-completeness
            why: ML typability is DEXPTIME-complete, so the exponential worst case of algorithm W cannot be avoided; nested lets double the size of types, and the lower bound runs any exponential-time machine.
          - system-f
          - entry: system-f-inference-undecidability
            why: typability without annotations is undecidable for System F, by a reduction from semi-unification, while checking an annotated term stays decidable.
          - entry: polymorphic-recursion-undecidability
            why: inference becomes undecidable but semi-decidable once a recursive function may use itself at other types, which is why such languages ask for a signature.
          - bidirectional-type-checking
          - subtyping
      - title: Intermediate representations and SSA
        intro: >
          The compiler lowers the syntax tree to three-address code, cuts it into basic blocks and joins them in a
          control flow graph. Dominators come from depth-first orders; Lengauer-Tarjan is near-linear, while the
          simpler Cooper-Harvey-Kennedy method has a worse worst case and was measured faster on real graphs. SSA form
          puts phi-functions at iterated dominance frontiers; minimal SSA can need a quadratic number of them, a proved
          bound, while measured counts grow about linearly. Leaving SSA must split critical edges and avoid the
          lost-copy and swap problems.
        steps:
          - activation-record
          - intermediate-representation
          - three-address-code
          - basic-block
          - control-flow-graph
          - call-graph
          - depth-first-orders
          - dominators-problem
          - dominator-tree
          - entry: lengauer-tarjan-algorithm
            why: dominators in near-linear time with path compression and balanced linking, the bound the simpler methods are compared against.
          - entry: cooper-harvey-kennedy-dominance
            why: an iterative dominator algorithm with a worse worst-case bound than Lengauer-Tarjan, measured faster on real control flow graphs.
          - entry: dominance-frontier
            why: the blocks where a definition stops dominating, which is where SSA construction puts its phi-functions.
          - natural-loop
          - static-single-assignment-form
          - phi-function
          - entry: cytron-ssa-construction
            why: minimal SSA from iterated dominance frontiers and a renaming walk over the dominator tree, the standard construction.
          - critical-edge-splitting
          - out-of-ssa-translation
          - entry: lost-copy-and-swap-problems
            why: two ways a naive translation out of SSA gives wrong code after copy propagation, which show why phi-functions are parallel copies.
      - title: Dataflow analysis and abstract interpretation
        intro: >
          A dataflow analysis computes, at every point, a fact that holds on all runs. The iterative algorithm stops
          for monotone functions on lattices of finite height and finds the maximal fixed point, which is safe
          relative to the meet over all paths and equal to it when the framework is distributive; constant
          propagation is monotone but not distributive. Abstract interpretation generalizes this: a domain is sound
          relative to its concretization, widening forces termination on infinite domains at a cost in precision, and
          the polyhedra domain is exponential in the worst case. IFDS solves distributive subset problems across
          procedures exactly.
        steps:
          - dataflow-analysis
          - reaching-definitions
          - entry: live-variable-analysis
            why: the standard backward may-analysis, which over-approximates the set of live names and feeds register allocation.
          - entry: available-expressions
            why: the standard forward must-analysis, which under-approximates and so meets by intersection.
          - fixed-point
          - monotone-dataflow-framework
          - distributive-dataflow-framework
          - gen-kill-problem
          - meet-over-all-paths-solution
          - maximal-fixed-point-solution
          - entry: worklist-dataflow-algorithm
            why: the iterative solver, which stops on lattices of finite height and returns the maximal fixed point whatever the visiting order.
          - entry: mop-mfp-coincidence-theorem
            why: the theorem of Kildall and of Kam and Ullman that the fixed point equals the path solution for distributive frameworks with all blocks reachable, and lies below it otherwise.
          - entry: constant-propagation-problem
            why: the standard analysis that is monotone but not distributive, so the computed fixed point can be strictly less precise than the path solution.
          - loop-invariant
          - abstract-interpretation
          - collecting-semantics
          - abstract-domain
          - galois-connection
          - interval-domain
          - entry: widening-operator
            why: the operator that makes iteration stop on domains of infinite height and still yields a sound post-fixed point, losing precision that narrowing may win back.
          - entry: polyhedra-domain
            why: linear inequalities between variables, the most precise of the numeric domains here, with exponential worst-case cost and no Galois connection in general.
          - context-sensitivity
          - entry: ifds-framework
            why: interprocedural distributive subset problems solved exactly over valid paths by graph reachability, in time cubic in the number of facts.
      - title: Scalar optimizations
        intro: >
          Optimizations change the program while keeping its meaning, and each rests on an analysis. The full
          employment theorem shows that no optimizer is best on all programs. Equality of values is undecidable, so
          value numbering finds a provable part of it. Lazy code motion is optimal, in evaluations and in register
          lifetimes, among safe placements. Choosing the best code layout is NP-hard, and inlining and profile-guided
          optimization are judged by measured speed. Superoptimizers accept a candidate only after a full check, and
          equality saturation is sound when its rewrite rules are.
        steps:
          - dead-code-elimination
          - loop-invariant-code-motion
          - local-value-numbering
          - entry: global-value-numbering
            why: finding equal values across a whole procedure, where exact equality is undecidable and every algorithm finds a provable part of it.
          - entry: alpern-wegman-zadeck-value-numbering
            why: the coarsest congruence of the SSA graph by partition refinement in O(E log E) time, incomplete because phi-functions are treated as uninterpreted.
          - partial-redundancy-elimination
          - entry: lazy-code-motion
            why: four unidirectional analyses that place each computation as late as possible, proved optimal in evaluations and lifetimes among safe placements.
          - entry: sparse-conditional-constant-propagation
            why: constant propagation over SSA edges and executable flow edges together, which finds constants in branches the plain analysis cannot rule out.
          - function-inlining
          - entry: profile-guided-optimization
            why: decisions driven by counts from a training run, which give no guarantee for other inputs and are judged by measured speed.
          - entry: pettis-hansen-code-positioning
            why: the best code layout is NP-hard, so blocks and procedures are placed by a greedy merge of the heaviest edges, a heuristic without a proved ratio.
          - entry: full-employment-theorem
            why: no optimizer produces the smallest program for every input program, a consequence of the halting problem.
          - entry: superoptimization
            why: search for the shortest equivalent code, where tests only reject candidates and a full equivalence check is needed to accept one.
          - e-graph
          - equality-saturation
      - title: Dependence and loop transformations
        intro: >
          A loop transformation reorders iterations, and it is legal when every dependence distance stays
          lexicographically positive. Dependence testing is integer programming: the GCD and Banerjee tests are
          conservative, the omega test is exact for integer linear constraints with no polynomial bound, and real
          compilers answer "maybe" when unsure. Interchange, tiling and vectorization follow from these tests. The
          polyhedral model is exact only for static control parts with affine bounds and subscripts, and its
          schedulers choose legal schedules by objectives that stand in for speed, so the code they produce is measured.
        steps:
          - data-dependence
          - dependence-distance-vector
          - loop-carried-dependence
          - dependence-direction-vector
          - lexicographic-order
          - entry: loop-transformation-legality
            why: the theorem that a reordering is legal when every dependence distance stays lexicographically positive, the test every transformation here must pass.
          - dependence-testing
          - entry: gcd-test
            why: a linear equation has an integer solution only if the gcd of its coefficients divides the constant; the answer independent is always right, maybe can be wrong.
          - entry: banerjee-test
            why: bounds on a dependence equation over the reals, exact over the reals but conservative for integers.
          - fourier-motzkin-elimination
          - entry: omega-test
            why: exact for integer linear constraints, with a worst case beyond any polynomial, measured fast on the systems that dependence tests produce.
          - loop-interchange
          - strip-mining
          - entry: loop-tiling
            why: strip mining and interchange together, legal on a fully permutable band, for the cache reuse that only measurement can price.
          - doall-loop
          - vectorization
          - strongly-connected-components
          - entry: allen-kennedy-algorithm
            why: vectorizes a nest by the strongly connected components of its dependence graph, keeping only the cycles sequential.
          - linear-programming-problem
          - farkas-lemma
          - entry: polyhedral-model
            why: iteration domains and dependences as integer points of polyhedra, exact only for static control parts with affine bounds and subscripts.
          - affine-scheduling-problem
          - entry: feautrier-scheduling
            why: affine schedules from linear programs built with Farkas' lemma, a construction that always ends with a legal schedule.
          - entry: pluto-algorithm
            why: chooses tiling hyperplanes by minimizing a bound on dependence distances, a heuristic objective for speed rather than an optimum.
      - title: Code generation, register allocation and JIT
        intro: >
          Instruction selection covers the IR with machine instructions. On trees, dynamic programming is optimal for
          its cost model; maximal munch is only locally best, and optimal code for a DAG is NP-complete. Register
          allocation as graph coloring is NP-complete for every fixed number of registers from three, so Chaitin's and
          Briggs's allocators are heuristics; strict SSA programs have chordal interference graphs that color
          optimally, yet spilling and coalescing stay NP-hard. Instruction scheduling is NP-complete too. Linear scan,
          modulo scheduling and the methods of JIT compilers are judged by measured speed.
        steps:
          - instruction-selection-problem
          - entry: maximal-munch
            why: greedy tiling from the root by the largest matching pattern, optimal in the sense that no two adjacent tiles combine into a cheaper one, but not optimum.
          - entry: aho-johnson-code-generation
            why: dynamic programming over a tree that gives the cheapest code for its cost model, in time linear in the tree.
          - burs
          - interference-graph
          - graph-coloring
          - register-allocation-problem
          - entry: register-allocation-np-completeness
            why: every graph is the interference graph of some program, so allocation by coloring is NP-complete for each fixed number of registers from three.
          - entry: chaitin-register-allocation
            why: build, simplify, spill and select, the heuristic allocator on which the others are built.
          - briggs-optimistic-coloring
          - register-coalescing-problem
          - chordal-graph
          - entry: ssa-chordal-interference-theorem
            why: strict SSA programs have chordal interference graphs, colored optimally in polynomial time, while spilling and coalescing stay NP-hard.
          - entry: linear-scan-register-allocation
            why: one pass over sorted live intervals, optimal for its intervals but a heuristic for programs, which is why JIT compilers use it.
          - list-scheduling
          - entry: instruction-scheduling-problem
            why: ordering the instructions of a block under latencies and resources, NP-complete in general, so compilers schedule by list heuristics.
          - software-pipelining
          - entry: iterative-modulo-scheduling
            why: tries initiation intervals from a lower bound up; the least one is NP-hard to find, and how often it is reached is measured.
          - just-in-time-compilation
          - entry: inline-caching
            why: caches the method found at each call site, a gain that rests on measurement, such as the 93.6 percent of monomorphic send sites in SELF programs.
      - title: Pointer and alias analysis
        intro: >
          Pointer analysis asks which memory each reference may touch. Precise may-alias analysis is undecidable with
          dynamic allocation, and even its flow-insensitive form is NP-hard, so every practical analysis
          over-approximates. Andersen's inclusion analysis runs in cubic time and Steensgaard's unification in almost
          linear time with less precision; how much precision each loses is measured. For higher-order programs,
          0-CFA is cubic, and k-CFA is EXPTIME-complete for every k from 1. Class hierarchy analysis is sound for
          type-safe programs without reflection.
        steps:
          - alias-analysis
          - points-to-analysis
          - call-graph-construction
          - entry: andersen-analysis
            why: inclusion constraints solved by a closure in cubic time, the precise end of flow-insensitive analysis and the source of the cubic bottleneck.
          - entry: steensgaard-analysis
            why: unification with union-find in almost linear time, less precise than Andersen's analysis by a margin that is measured.
          - entry: may-alias-undecidability
            why: precise may-alias analysis is undecidable for programs with dynamic allocation, so every analysis here over-approximates.
          - entry: flow-insensitive-alias-np-hardness
            why: even when statement order is ignored, the precise may-alias answer is NP-hard.
          - entry: class-hierarchy-analysis
            why: a call graph from declared types alone, in near-linear time, sound for type-safe programs without reflection.
          - entry: zero-cfa
            why: control flow analysis for higher-order programs in cubic time, with one abstract binding per variable.
          - k-cfa
          - entry: k-cfa-exptime-completeness
            why: adding one level of call-string context makes control flow analysis EXPTIME-complete, by the result of Van Horn and Mairson.
      - title: Verification, symbolic execution and synthesis
        intro: >
          Hoare logic is sound and relatively complete, and a verification condition generator turns an annotated
          program into formulas whose validity proves partial correctness; finding the invariants is undecidable in
          general and works only for restricted shapes. Linear ranking functions over the rationals are found in
          polynomial time by linear programming. Symbolic execution and concolic testing find bugs but prove nothing
          beyond the paths they run, and path explosion bounds them. Translation validation is incomplete, since
          equivalence is undecidable, while verified compilation proves the compiler once. Synthesis ends the path:
          CEGIS is sound, and LTL synthesis is 2EXPTIME-complete.
        steps:
          - hoare-triple
          - hoare-logic
          - weakest-precondition
          - entry: verification-condition-generation
            why: turns a program with loop invariants into formulas for a solver, and is sound for partial correctness when the formulas are valid.
          - entry: loop-invariant-synthesis
            why: finding an inductive invariant is undecidable in general, so each method fixes a shape or a domain and may fail.
          - termination-proof
          - entry: ranking-function-synthesis
            why: linear ranking functions over the rationals by linear programming in polynomial time, while over the integers the question is coNP-complete.
          - symbolic-execution
          - path-condition
          - symbolic-execution-tree
          - entry: path-explosion-problem
            why: the number of paths grows exponentially with the branches in sequence, which limits every method of this stage that runs paths one by one.
          - smt-problem
          - entry: concolic-testing
            why: runs concrete inputs and solves negated branch conditions; with an exact solver it reaches every path that an input of the domain follows, and it stops only when the domain is finite.
          - entry: translation-validation
            why: checks one compiler run instead of the compiler, and is incomplete because program equivalence is undecidable.
          - entry: verified-compilation
            why: a machine-checked proof that every compiled program keeps the meaning of its source, as for CompCert in Coq.
          - program-synthesis
          - entry: cegis
            why: alternates a synthesizer and a verifier on counterexamples, always sound, and sure to stop only when the candidate or input space is finite.
          - reactive-synthesis
          - entry: pnueli-rosner-theorem
            why: deciding whether an LTL specification has a reactive implementation is 2EXPTIME-complete.
  - id: information-retrieval-and-ai-reasoning
    title: Information retrieval and AI reasoning
    for: a student who knows sorting, binary search, heaps and hash tables, graph search and shortest paths, basic probability, propositional logic and SAT, and has met NP-completeness and the polynomial hierarchy, and wants to see how a search engine indexes, ranks and is evaluated, and how a reasoner derives, withdraws and revises conclusions from stored knowledge, and to see which results are proved and under which conditions, which problems are NP-hard or harder, and which methods are judged only by measured results.
    intro: >
      The path answers a query against a large body of stored knowledge in two ways. The first half ranks documents:
      an inverted index is built once and then serves every query, posting lists are intersected and compressed with
      proved bounds, and ranking functions score what the lists return. Here the line between proof and measurement is
      sharp. Intersection costs, Elias-Fano space, the safety of WAND and the optimality of the probability ranking
      principle under its hypotheses are theorems, while whether BM25, a smoothed language model or a learned ranker
      finds the documents people want is decided only on test collections, with the effectiveness measures and the
      significance tests of the evaluation stage. Rank aggregation by Kemeny's rule is NP-hard, and greedy
      diversification and recommendation by matrix factorization rest on approximation bounds and recovery theorems
      whose conditions real data seldom meets exactly. The second half derives consequences. Description logics trade
      expressive power for cost: subsumption is polynomial in EL, PSPACE-complete in ALC without a TBox and
      EXPTIME-complete with a general one, while DL-Lite answers queries by rewriting them into SQL. Logic programs are
      exact under each semantics: Horn programs and the well-founded model take polynomial time, stable models are
      NP-complete, and disjunctive programs, default logic and circumscription sit at the second level of the
      polynomial hierarchy. Argumentation and belief revision are characterized by representation theorems, with
      grounded semantics polynomial and sceptical preferred acceptance complete for the second level. The path ends
      with qualitative temporal and spatial calculi, where full Allen interval networks are NP-complete, algebraic
      closure decides the maximal tractable subclasses, and temporal networks with bounded durations are solved by
      shortest paths. Solvers for the hard problems are judged by measured run time on benchmark sets.
    stages:
      - title: Inverted indexes and Boolean query processing
        intro: >
          An inverted index maps each term to the sorted list of documents that contain it, so a Boolean query becomes
          the intersection of a few posting lists. The proved results are bounds: merging costs the sum of the lengths,
          galloping search costs about the smaller length times the log of the ratio, and the adaptive algorithm is
          optimal against a lower bound that depends on how the lists interleave. Gap codes, variable-byte codes and
          Elias-Fano have proved space bounds, Elias-Fano at most ceil(lg(u/n)) + 2 bits per id for n ids below u, while which
          code or document order makes a real index smallest and fastest is measured. Zipf's law is an empirical fit,
          not a theorem.
        steps:
          - term-document-incidence-matrix
          - posting-list
          - inverted-index
          - entry: zipfs-law
            why: a fitted law of term frequencies that explains why a few posting lists are huge and most are tiny, measured on collections, not derived.
          - posting-list-intersection
          - merge-based-list-intersection
          - skip-pointers
          - exponential-search
          - entry: adaptive-set-intersection
            why: intersection whose cost depends on how the lists interleave, proved optimal against an adversary lower bound for that measure.
          - phrase-query
          - trie
          - wildcard-query
          - postings-gap-encoding
          - variable-byte-encoding
          - entry: elias-fano-encoding
            why: n sorted ids below u in at most n times the ceiling of lg(u/n), plus 2n + 1 bits, with constant-time access by position and fast successor search, a proved bound.
          - partitioned-elias-fano
          - k-way-merge
          - blocked-sort-based-indexing
      - title: Ranking models and top-k query processing
        intro: >
          Ranking scores each document for a query and returns the best k. The probability ranking principle is a
          theorem: sorting by probability of relevance maximizes expected utility when relevance of each document is
          independent of the others shown and the probabilities are exact. The binary independence model derives an
          idf weight from stated assumptions, but BM25 adds tuned saturation and length factors, and its usual
          parameters, like the smoothing of query likelihood, were set by measurement on test collections. Top-k
          evaluation is exact: WAND and block-max WAND skip documents that provably cannot enter the top k, so they
          return the same answer as exhaustive scoring, and how much they skip is measured.
        steps:
          - boolean-retrieval-model
          - cosine-similarity
          - tf-idf
          - vector-space-model
          - entry: probability-ranking-principle
            why: ranking by probability of relevance is optimal under independence, exact probabilities and a utility that adds a decreasing weight per relevant document, and fails when results overlap.
          - binary-independence-model
          - entry: bm25
            why: the idf part is derived from the binary independence model, the saturation and length parts are heuristics, and the parameters were fixed by measurement.
          - ranked-retrieval
          - query-likelihood-model
          - dirichlet-prior-smoothing
          - relevance-feedback
          - top-k-selection
          - term-at-a-time-evaluation
          - document-at-a-time-evaluation
          - entry: wand
            why: skips documents whose score upper bound cannot reach the current k-th score, proved safe, with the speedup measured on query logs.
          - block-max-wand
      - title: Evaluating retrieval
        intro: >
          Retrieval quality is not a mathematical property of a ranking function, so it is measured. A test collection
          fixes documents, queries and relevance judgments, and the measures turn a ranking into a number:
          precision at k, average precision, reciprocal rank, nDCG, rank-biased precision and expected reciprocal rank,
          each a model of a user that can be stated exactly and is itself an assumption. Pooling judges only the top
          documents of the systems compared, which biases scores against new systems. The significance tests are
          exact under their stated sampling assumptions. Interleaving compares two rankers online, and team draft is
          proved fair when clicks depend only on positions.
        steps:
          - precision-and-recall
          - test-collection
          - precision-at-k
          - mean-average-precision
          - mean-reciprocal-rank
          - entry: normalized-discounted-cumulative-gain
            why: graded gains discounted by rank and normalized by the ideal ranking, the measure that the learning-to-rank methods of the next stage optimize.
          - rank-biased-precision
          - expected-reciprocal-rank
          - pooling
          - sign-test
          - interleaved-evaluation
          - entry: team-draft-interleaving
            why: each position goes to each ranker with probability one half, so random clicks give an expected outcome of zero, a proved property; its sensitivity is measured.
      - title: Learning to rank, fusion and dense retrieval
        intro: >
          Learning to rank fits a scoring function to judged or clicked data. Pairwise and listwise losses are
          surrogates: LambdaRank's lambdas are not the gradient of nDCG, and that following them raises nDCG is an
          experimental finding, as is the strength of LambdaMART. Unbiased learning to rank is exactly unbiased when the
          propensities are true and positive, and biased by a fixed amount when they are wrong. Fusing several rankings
          is a voting problem: Kemeny's rule, the ranking with the least total Kendall tau distance, is NP-hard already
          for four lists, while reciprocal rank fusion is a simple rule whose constant was set in a pilot study. Dense
          retrieval reduces ranking to maximum inner product search, and its quality is measured.
        steps:
          - learning-to-rank
          - ranknet
          - entry: lambdarank
            why: gradients defined directly by the change of nDCG when two documents swap, not derived from a cost, so its effect is measured, not proved.
          - lambdamart
          - position-bias
          - inverse-probability-weighting
          - entry: unbiased-learning-to-rank
            why: clicks reweighted by inverse examination propensities give an unbiased estimate of a ranking metric when the propensities are true and positive, with a bias that more data does not remove when they are wrong.
          - kendall-tau-distance
          - rank-aggregation
          - reciprocal-rank-fusion
          - feedback-arc-set-problem
          - entry: kemeny-rank-aggregation
            why: the consensus ranking with the least total Kendall tau distance, NP-hard already for four lists by a reduction from feedback arc set, with exact solvers for small inputs.
          - maximum-inner-product-search
          - dual-encoder-retrieval
      - title: Web search and recommendation
        intro: >
          At web scale the ranking uses links, clicks and duplicates. PageRank is the stationary distribution of a
          random surfer and power iteration computes it with a proved error bound, while its value as a ranking signal
          is measured. MinHash estimates Jaccard similarity without bias, so near-duplicate detection has proved error
          rates. Click models are fitted by maximum likelihood and compared by measured log-likelihood. Diversification
          for several query intents is NP-hard, and the greedy IA-Select gets a factor of 1 - 1/e because the
          objective is submodular. Exact matrix completion is a theorem with conditions on rank, incoherence and random
          sampling, while alternating least squares only reaches a local minimum and recommenders are compared by
          measured accuracy.
        steps:
          - web-crawling
          - pagerank
          - hits-algorithm
          - jaccard-similarity
          - minhash
          - click-model
          - cascade-click-model
          - search-result-diversification
          - submodular-function
          - entry: ia-select
            why: diversification over query intents is NP-hard by a reduction from maximum coverage, and the greedy choice is within 1 - 1/e of the best because the objective is submodular.
          - recommendation-problem
          - rating-matrix
          - collaborative-filtering
          - matrix-factorization-recommendation
          - entry: exact-matrix-completion-theorem
            why: a low-rank incoherent matrix is recovered exactly with high probability from enough uniformly sampled entries by nuclear norm minimization, conditions that real ratings data does not meet.
          - entry: alternating-least-squares
            why: each half step solves least squares exactly, so the cost never increases, but the result is a local minimum and depends on the start.
      - title: Knowledge representation and description logics
        intro: >
          A description logic describes classes and relations in a fragment of first-order logic chosen for its
          decision problems, and the fragments trade expressive power for cost. Subsumption is polynomial in EL even
          with a general TBox, PSPACE-complete in ALC without a TBox and EXPTIME-complete with a general one; the
          tableau algorithm is sound, complete and terminating with blocking, though its general-TBox form is not
          worst-case optimal. DL-Lite rewrites queries into first-order queries, with AC0 data complexity. The open
          world assumption separates these logics from databases. Knowledge compilation pays once for a form, such as
          d-DNNF, in which chosen queries take polynomial time. The situation calculus states the effects of actions
          and answers the frame problem with successor state axioms.
        steps:
          - description-logic
          - alc-description-logic
          - tbox-and-abox
          - concept-satisfiability
          - concept-subsumption
          - entry: alc-tableau-algorithm
            why: sound, complete and terminating for ALC, in polynomial space without a TBox and double exponential time with a general TBox, where the problem is EXPTIME-complete.
          - alc-pspace-completeness
          - alc-general-tbox-exptime
          - el-description-logic
          - entry: el-classification
            why: completion rules compute every subsumption between concept names of an EL TBox in polynomial time, the reason large medical ontologies use EL.
          - closed-world-assumption
          - open-world-assumption
          - dl-lite
          - perfectref-rewriting
          - knowledge-compilation
          - d-dnnf
          - frame-problem
          - situation-calculus
          - successor-state-axioms
      - title: Rules, logic programs and nonmonotonic reasoning
        intro: >
          Rules derive new facts from stored ones. Horn programs have a least model computed in linear time by forward
          chaining, and SLD resolution is sound and complete for them. Negation as failure makes reasoning
          nonmonotonic. SLDNF is sound for Clark's completion and complete only under conditions; the well-founded
          model takes polynomial time; deciding whether a program has a stable model is NP-complete, and with
          disjunctive heads the problem is complete for the second level of the polynomial hierarchy. Default logic
          and circumscription are also at that level. Answer set solvers use CDCL with loop formulas, are exact, and
          are judged by measured run time; the speed of Rete is likewise a measured result on particular programs.
        steps:
          - horn-sat
          - production-system
          - forward-chaining
          - entry: rete-algorithm
            why: keeps partial matches between cycles so a small change costs little, an advantage measured on real programs, while one change can cost time exponential in the length of a rule.
          - logic-programming
          - sld-resolution
          - negation-as-failure
          - sldnf-resolution
          - clark-completion
          - stratified-logic-program
          - gelfond-lifschitz-reduct
          - stable-model-semantics
          - entry: stable-model-np-completeness
            why: deciding whether a normal program has a stable model is NP-complete, by a reduction from 3-SAT, so answer set solvers search.
          - well-founded-semantics
          - loop-formulas
          - answer-set-programming
          - cdcl
          - conflict-driven-answer-set-solving
          - disjunctive-asp-sigma2-completeness
          - nonmonotonic-reasoning
          - default-logic
          - entry: default-logic-complexity
            why: credulous reasoning in propositional default logic is complete for the second level of the polynomial hierarchy, one level above SAT.
          - circumscription
      - title: Argumentation and belief revision
        intro: >
          Abstract argumentation decides which arguments survive their attackers. The grounded extension is a least
          fixed point computed in polynomial time; credulous acceptance under preferred semantics is NP-complete and
          sceptical acceptance is complete for the second level of the polynomial hierarchy. Belief revision changes a
          belief set to admit new information. The AGM postulates are characterized exactly by representation
          theorems: a revision satisfies them if and only if it is given by a system of spheres, and in the finite
          propositional case by a faithful total preorder on worlds. Gardenfors proved that no nontrivial revision
          satisfies the Ramsey test. Ordinal conditional functions grade beliefs and give System Z, whose rational
          closure answers default queries with a polynomial number of SAT calls.
        steps:
          - abstract-argumentation-framework
          - admissible-set
          - complete-extension
          - entry: grounded-extension
            why: the least fixed point of the defence function, unique and computed in polynomial time, the sceptical baseline of every other semantics.
          - preferred-extension
          - stable-extension-argumentation
          - entry: preferred-semantics-complexity
            why: credulous acceptance is NP-complete and sceptical acceptance is complete for the second level of the polynomial hierarchy, because maximality must be refuted.
          - belief-revision
          - agm-postulates
          - grove-spheres
          - entry: katsuno-mendelzon-revision
            why: in a finite propositional language an operator satisfies the revision postulates if and only if it selects the minimal models of the input under a faithful total preorder.
          - gardenfors-impossibility-theorem
          - ordinal-conditional-functions
          - system-p
          - rational-closure
          - system-z
      - title: Qualitative temporal and spatial reasoning
        intro: >
          Qualitative calculi reason about intervals and regions by relations, not coordinates. A network is a
          constraint problem over a finite set of relations, and algebraic closure is the main tool. For the full
          Allen interval algebra consistency is NP-complete; the ORD-Horn subclass is tractable and maximal among
          classes with all basic relations, and the tractable subclasses of the interval algebra and of RCC8 are known
          exactly, which are proved classifications. Point algebra networks are solved in linear time by strongly
          connected components. Metric constraints on time differences form simple temporal problems solved by
          shortest paths; disjunctive ones are NP-complete, and dynamic controllability with uncertain durations is
          decided in polynomial time.
        steps:
          - path-consistency
          - qualitative-constraint-network
          - allens-interval-algebra
          - composition-table
          - algebraic-closure
          - entry: interval-algebra-np-completeness
            why: consistency of networks over the full interval algebra is NP-complete, by a reduction from 3-SAT, so path consistency alone cannot decide it.
          - point-algebra
          - ord-horn-subclass
          - entry: nebel-burckert-theorem
            why: algebraic closure decides consistency over the 868 ORD-Horn relations, and adding any other relation makes the problem NP-complete.
          - region-connection-calculus-rcc8
          - rcc8-tractable-subclasses
          - difference-constraints
          - entry: simple-temporal-problem
            why: consistent exactly when the distance graph has no negative cycle, so Bellman-Ford decides it and Floyd-Warshall gives the minimal network.
          - disjunctive-temporal-problem
          - simple-temporal-network-with-uncertainty
          - entry: morris-dynamic-controllability
            why: dynamic controllability of a network with uncertain durations is decided in polynomial time, by Morris's O(N^4) cutoff algorithm after the pseudo-polynomial first method.
