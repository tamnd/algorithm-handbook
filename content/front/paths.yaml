  - id: systems
    title: Systems
    for: a student who knows the basic data structures, hashing and a little probability, and wants to see the algorithms inside operating systems, databases, networks and large services, and which of their properties are proved and which are only measured.
    intro: >
      Caching first: what to keep in a small fast memory, the offline optimum, the competitive ratio of LRU and
      the policies that real caches use. Then the two resources an operating system shares, processor time and
      memory: the scheduling rules and the real-time tests that say whether every deadline is met, the allocators
      and their fragmentation, and the garbage collectors that free memory for a program. Databases come next,
      with joins, query plans and the protocols that make transactions serializable and recoverable. The last
      stages are about networks and services: routing, congestion control and fair queueing, then load balancing
      by consistent hashing and the power of two choices, and rate limiting by token buckets. Each step says what
      is proved, under which model, and what is only measured.
    stages:
