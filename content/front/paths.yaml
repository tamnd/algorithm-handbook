  - id: games-and-search
    title: Games and search
    for: a student who knows graph search, recursion and a little probability, and wants to see how programs play games, find shortest paths with heuristics, plan sequences of actions and solve puzzles, and which of their guarantees are proved and which are only measured in play.
    intro: >
      Games first: the game tree, winning and losing positions, Zermelo's theorem, and the minimax value that a
      program computes. Combinatorial games follow, Nim and Bouton's theorem, Grundy numbers and the Sprague-Grundy
      theorem, with strategy stealing for Hex. The search of large game trees comes next: alpha-beta pruning and the
      Knuth-Moore analysis of its best case, the move ordering and transposition tables that bring a search near that
      best case, and the selective methods of game engines, which are judged by playing strength and can change the
      result. Monte Carlo tree search and UCT, which converge only in the limit, close the first part, with games of
      chance and imperfect information and the minimax theorem. Heuristic search is next: A* and the conditions under
      which it is optimal, admissible and consistent heuristics and where they come from, the memory-bounded and
      suboptimal variants, and search that repairs its plan as the map changes. Planning treats actions as data:
      STRIPS and the complexity of plan existence, the delete relaxation behind the heuristics of HSP and FF,
      Graphplan, partial-order and hierarchical planning, planning under uncertainty, and motion planning by sampling.
      The last stage is puzzles, where invariants decide solvability and hardness results speak of the generalized
      puzzle, not the one in the box.
    stages:
      - title: Games and their values
        steps:
          - game-tree
          - perfect-information-game
          - zero-sum-game
          - winning-losing-states
          - zermelo-theorem
          - entry: minimax
            why: the value that every later game search computes or approximates.
          - negamax
          - games-on-graphs
          - retrograde-analysis
          - solved-game
      - title: Combinatorial games
        steps:
          - nim
          - boutons-theorem
          - mex-function
          - grundy-number
          - entry: sprague-grundy-theorem
            why: every impartial game under normal play is equivalent to a single Nim heap, so sums of games reduce to XOR.
          - combinatorial-game-theory
          - strategy-stealing-argument
          - hex-game
          - generalized-geography
      - title: Searching game trees
