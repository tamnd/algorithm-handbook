  - id: cryptography
    title: Cryptography
    for: a student who knows modular arithmetic and basic probability and wants to see how secrets are kept, data is authenticated and keys are agreed, and what each guarantee assumes.
    intro: >
      The old ciphers first, and why a key as long as the message is the only way to perfect secrecy. Then the
      block and stream ciphers that encrypt with a short key, the modes that turn them into encryption of long
      messages, and the hash functions and codes that detect tampering. Public keys follow: trapdoor functions,
      the definitions of security against chosen plaintexts and chosen ciphertexts, signatures and the agreement
      of a key over an open line. Last come the schemes meant to survive a quantum computer and the protocols in
      which parties prove, commit and compute together. Every claim of security on the way names its adversary
      and its assumption.
    stages:
