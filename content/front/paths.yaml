  - id: biology
    title: Biology
    for: a student who knows dynamic programming, graphs and a little probability, and wants to see the algorithms that compare sequences, assemble genomes, build evolutionary trees and predict the shapes of molecules, and how far each one rests on a model of biology.
    intro: >
      Alignment first: the scoring of a match, the dynamic programs of Needleman-Wunsch and Smith-Waterman, gap
      penalties and Gotoh's algorithm, Hirschberg's linear space, and then the heuristics, seeds, BLAST and its
      statistics, that make a search of a whole database fast. Multiple alignment follows, NP-hard in its exact
      form and solved in practice by progressive methods. Genome assembly is next: reads, coverage and the
      Lander-Waterman model, the shortest common superstring, overlap graphs and de Bruijn graphs, and the work of
      simplifying them. Phylogenetics builds trees from distances, from parsimony and from likelihood under models
      of substitution, and compares the trees it builds. The last stage predicts structure: RNA secondary structure
      by the Nussinov and Zuker programs, protein structure and its measures, and the superposition of two
      structures. Each step says which part is exact and which part is a model of biology.
    stages:
      - title: Aligning two sequences
        steps:
