            why: a nonnegative supermartingale started at 1 ever reaches 1 / alpha with probability at most alpha, so the test stays valid under optional stopping.
          - confidence-sequence
      - title: Experiments and causal effects
        intro: >
          Causal effects as contrasts of potential outcomes. Randomization identifies the average treatment effect by
          design; without it, each method identifies the effect only under its own assumptions, unconfoundedness and
          overlap for weighting and matching, parallel trends for difference in differences, exclusion and monotonicity
          for instruments. Sensitivity analysis asks how much hidden bias would change the answer.
        steps:
          - potential-outcomes-framework
