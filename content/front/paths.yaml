  - id: machine-learning
    title: Machine learning
    for: a student who knows linear algebra, basic probability and the gradient methods of optimization, and wants to see what can be learned from data, by which algorithms, and with which guarantees.
    intro: >
      Learning from examples first: a loss, a class of hypotheses, the risk on data not yet seen, and the bounds
      of statistical learning theory that say how many examples suffice. Then the classical learners, linear
      models, kernels, trees and ensembles, and the structure found without labels by clustering and by
      dimensionality reduction. Neural networks come next, with backpropagation and the practice that makes their
      training work. The last two stages turn to uncertainty and to action: inference in graphical models and
      hidden Markov models, then bandits and Markov decision processes, from value iteration to Q-learning and
      policy gradients. Each step names its model, and each guarantee says whether it holds for all inputs, with
      high probability or only in the limit.
