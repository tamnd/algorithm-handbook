# Learning paths across the volumes (spec handbook 03.7). Steps are entries (slugs) or chapters (by number).
# The builder prints each step with its number; a step whose entry is not yet written is marked forthcoming.
intro: >
  A path is an ordered list of entries and chapters, across volumes, for one goal. Read the steps in order
  and tick each one when you can explain it without the book and have done some of its exercises. A step
  that names a whole chapter means: read its opening and its first-reading list, then the entries the
  opening names. The paths share their first steps, so a reader who finishes one is well into the others.

paths:
  - id: first-course
    title: A first course in algorithms
    for: a student who can program and knows some discrete mathematics (sets, functions, induction, sums).
    intro: >
      The material of a one-semester course: how to analyse an algorithm and prove it correct, the main
      sorts and searches, the basic data structures, graph search and shortest paths, and the main design
      techniques. About fifty entries; most are at the intro and core levels.
    stages:
      - title: Analysing algorithms
        steps:
          - entry: random-access-machine
            why: the model in which time is counted.
          - asymptotic-notation
          - common-growth-rates
          - worst-case-analysis
          - loop-invariant
          - induction
          - recurrence-relation
          - recursion-tree-method
          - master-theorem
      - title: Sorting and searching
        steps:
          - sorting-problem
          - insertion-sort
          - merge-sort
          - quicksort
          - randomized-quicksort
          - entry: linearity-of-expectation
            why: the tool for the expected cost of randomized quicksort.
          - heapsort
          - comparison-sort-lower-bound
          - counting-sort
          - radix-sort
          - binary-search
          - quickselect
      - title: Data structures
        steps:
          - stack
          - queue
          - linked-list
          - dynamic-array
          - amortized-cost
          - hash-table
          - binary-search-tree
          - red-black-tree
          - binary-heap
          - disjoint-set
      - title: Graphs
        steps:
          - graph
          - adjacency-list
          - breadth-first-search
          - depth-first-search
          - topological-sort
          - strongly-connected-components
          - dijkstra
          - bellman-ford
          - floyd-warshall
          - minimum-spanning-tree
          - kruskal
          - prim
          - max-flow-problem
          - ford-fulkerson
      - title: Design techniques
        steps:
          - divide-and-conquer-paradigm
          - optimal-substructure
          - memoization
          - longest-common-subsequence
          - matrix-chain-multiplication
          - greedy-algorithm
          - activity-selection
          - entry: huffman-coding
            why: the classic greedy code.
          - generic-backtracking-algorithm
      - title: Where efficient algorithms stop
        steps:
          - reduction
          - entry: p-versus-np-problem
            why: the question behind the hard problems of the later volumes.
          - entry: cook-levin-theorem

