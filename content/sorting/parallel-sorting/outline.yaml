# The order of chapter 4.6. Groups are read in order; entries in a group too.
groups:
  - title: The problem and the simplest sort
    intro: >
      A parallel sort has two costs: the time until the keys are in order, and the total work of all
      processors. Each bound names a machine model. [Odd-even transposition sort](/odd-even-transposition-sort/)
      is the first example: it needs only neighbour links and $n$ rounds, but it does $\Theta(n^2)$ work.
    entries:
      - parallel-sorting-problem
      - odd-even-transposition-sort

  - title: Sorting on meshes and matrices
    intro: >
      When processors sit in a grid and talk only to their neighbours, distance is the limit: a key may have to
      cross the whole mesh. The sorts here are fixed patterns of row sorts, column sorts and fixed moves, and
      the [zero-one principle](/zero-one-principle/) proves them correct.
    entries:
      - mesh-sorting-problem
      - shearsort
      - columnsort

  - title: Merging in parallel
    intro: >
      Every item of two sorted lists can find its output position by a binary search in the other list, so
      merging needs no long chain of steps. The methods here cut a merge into equal independent pieces, so
      that $p$ processors merge $n$ items in time $O(n/p + \log n)$ with linear work.
    entries:
      - parallel-merging-problem
      - merge-path
      - shiloach-vishkin-merge

  - title: Merge sort and quicksort in parallel
    intro: >
      The two classic divide-and-conquer sorts run their recursive calls at the same time. What is left is to
      make the merge, or the partition, parallel too. With a parallel merge, merge sort has span
      $O(\log^3 n)$; with a partition by prefix sums, quicksort has span $O(\log^2 n)$ with high probability.
      Hyperquicksort is quicksort laid out on a hypercube.
    entries:
      - parallel-merge-sort
      - parallel-quicksort
      - hyperquicksort

  - title: Sorting with splitters and digits
    intro: >
      On machines where moving data costs most, the best sorts move each key once. Sample sort and regular
      sampling pick $p - 1$ splitters so that each processor gets one bucket of about $n/p$ keys. Parallel
      radix sort does the same with the digits of integer keys, one pass per digit.
    entries:
      - sample-sort
      - parallel-sorting-by-regular-sampling
      - parallel-radix-sort

  - title: How fast sorting and merging can be
    intro: >
      Sorting needs $\Omega(\log n)$ parallel steps in every model where a step combines two values, and
      Cole's pipelined merge sort reaches this bound with $O(n \log n)$ work. Merging is easier: Valiant's
      merge needs only $O(\log \log n)$ rounds when only comparisons are counted.
    entries:
      - parallel-sorting-depth-lower-bound
      - cole-merge-sort
      - valiant-parallel-merge
