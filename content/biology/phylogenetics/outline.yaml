# The order of chapter 27.3, Phylogenetics. Groups are read in order; entries in a group too.
groups:
  - title: Trees, splits and the space of trees
    intro: >
      A [phylogenetic tree](/phylogenetic-tree/) has its taxa at the leaves and ancestors inside. It may be
      [rooted or unrooted](/rooted-and-unrooted-trees/); there are $(2n-5)!!$ unrooted binary trees on $n$ taxa,
      and that number is why [tree reconstruction](/phylogenetic-tree-reconstruction/) is hard. A
      [molecular clock](/molecular-clock/) makes the tree ultrametric and fixes the root; without one, a root
      is chosen afterwards, for example by [midpoint rooting](/midpoint-rooting/). The tree is equally well
      described by its [splits](/splits-of-a-tree/), its [rooted triplets](/rooted-triplet/) or its
      [quartets](/quartet/), and most later methods work on one of these encodings.
    entries:
      - phylogenetic-tree
      - rooted-and-unrooted-trees
      - newick-format
      - phylogenetic-tree-reconstruction
      - molecular-clock
      - tree-rooting
      - midpoint-rooting
      - splits-of-a-tree
      - rooted-triplet
      - quartet
      - split-system

  - title: Trees from distances
    intro: >
      A [tree metric](/tree-metric/) is a matrix of path lengths in a tree, and the
      [four-point condition](/four-point-condition/) tells one apart in $O(n^4)$ checks. On exact data the tree
      is unique and found in $O(n^2)$ time; with a clock the matrix is an ultrametric and [UPGMA](/upgma/)
      recovers it. [Neighbor-joining](/neighbor-joining/) is exact on every tree metric and stays correct under
      small errors. On noisy data the questions become least squares and minimum evolution; least squares and
      balanced minimum evolution are NP-hard over all trees.
    entries:
      - tree-metric
      - four-point-condition
      - additive-tree-reconstruction
      - four-point-method
      - ultrametric-tree-reconstruction
      - upgma
      - ultrametric-tree-fitting-upgma-check
      - wpgma
      - neighbor-joining
      - bionj
      - least-squares-phylogeny
      - fitch-margoliash
      - minimum-evolution

  - title: Parsimony and perfect phylogeny
    intro: >
      Parsimony scores a tree by the fewest changes it needs. On a fixed tree the score is exact and fast by
      dynamic programming: [Fitch's algorithm](/fitch-algorithm/) for unit costs on binary trees,
      [Hartigan's](/hartigan-algorithm/) for any degree, [Sankoff's](/sankoff-algorithm/) for any cost table.
      Over all trees, [maximum parsimony](/maximum-parsimony/) is NP-hard. When no character needs to change
      twice the data have a [perfect phylogeny](/perfect-phylogeny/), which for binary characters is decided
      in linear time.
    entries:
      - small-parsimony
      - fitch-algorithm
      - hartigan-algorithm
      - sankoff-algorithm
      - wagner-parsimony
      - camin-sokal-parsimony
      - dollo-parsimony
      - maximum-parsimony
      - parsimony-informative-site
      - maximum-parsimony-np-hard
      - perfect-phylogeny
      - four-gamete-condition
      - gusfield-perfect-phylogeny
      - character-compatibility

  - title: Searching the space of trees
    intro: >
      Since the best tree is NP-hard to find for parsimony and likelihood alike, programs build a tree by
      [stepwise addition](/stepwise-addition/) and improve it by local moves:
      [NNI](/nearest-neighbor-interchange/), [SPR](/subtree-prune-and-regraft/) and
      [TBR](/tree-bisection-and-reconnection/), with $O(n)$, $O(n^2)$ and $O(n^3)$ neighbors. The
      [parsimony ratchet](/parsimony-ratchet/) helps the search leave local optima. The
      [bootstrap](/phylogenetic-bootstrap/) measures how well the data support each split of the result.
    entries:
      - nearest-neighbor-interchange
      - subtree-prune-and-regraft
      - tree-bisection-and-reconnection
      - stepwise-addition
      - parsimony-ratchet
      - phylogenetic-bootstrap

  - title: Substitution models and likelihood
    intro: >
      A [substitution model](/substitution-model/) is a continuous-time Markov chain on the states of one site,
      from [Jukes-Cantor](/jukes-cantor-model/) with no free parameter to [GTR](/gtr-model/) with eight, plus
      [rate variation among sites](/rate-heterogeneity/). With it, the [likelihood](/phylogenetic-likelihood/)
      of a tree is computed exactly by [Felsenstein's pruning algorithm](/felsenstein-pruning/), while the
      [maximum likelihood tree](/maximum-likelihood-phylogeny/) is NP-hard to find. The model also explains
      [long-branch attraction](/long-branch-attraction/), and [Bayesian inference](/bayesian-phylogenetic-inference/)
      samples trees from the posterior by MCMC.
    entries:
      - substitution-model
      - jukes-cantor-model
      - felsenstein-81-model
      - kimura-two-parameter-model
      - hky-model
      - gtr-model
      - phylogenetic-likelihood
      - rate-heterogeneity
      - felsenstein-pruning
      - maximum-likelihood-phylogeny
