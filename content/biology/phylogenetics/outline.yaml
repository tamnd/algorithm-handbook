  - title: Time, speciation and traits
    intro: >
      A branch length is rate times time, and only the product is seen. A
      [relaxed clock](/relaxed-molecular-clock/) lets the rate vary, and
      [divergence time estimation](/divergence-time-estimation/) needs calibrations to give absolute ages.
      The [Yule model](/yule-model/) and the [birth-death process](/birth-death-process/) are random models of
      the tree itself. On a known tree, [phylogenetic diversity](/phylogenetic-diversity/) measures how much
      of the tree a set of taxa keeps, and [independent contrasts](/phylogenetic-independent-contrasts/)
      correct trait comparisons for shared descent.
    entries:
      - relaxed-molecular-clock
      - divergence-time-estimation
      - yule-model
      - birth-death-process
      - phylogenetic-diversity
      - phylogenetic-diversity-maximization
      - phylogenetic-independent-contrasts

  - title: Comparing trees
    intro: >
      The [Robinson-Foulds distance](/robinson-foulds-distance/) counts the splits two trees do not share, and
      [Day's algorithm](/day-algorithm/) computes it in linear time. Distances by moves are harder: the NNI, SPR
      and TBR distances are NP-hard, and the rooted SPR distance is the size of a
      [maximum agreement forest](/maximum-agreement-forest/) minus one. A
      [maximum agreement subtree](/maximum-agreement-subtree/) keeps the most taxa on which two trees agree.
    entries:
      - robinson-foulds-distance
      - day-algorithm
      - tree-comparison
      - maximum-agreement-subtree
      - maximum-agreement-forest
      - spr-distance
      - rspr-maf-equivalence

  - title: Combining trees
    intro: >
      A [consensus tree](/consensus-tree/) summarizes many trees on the same taxa: the
      [strict](/strict-consensus/) rule keeps the splits in every tree, the
      [majority rule](/majority-rule-consensus/) those in more than half. A [supertree](/supertree/) joins trees
      on overlapping taxa. Built from triplets or quartets, the problem is easy when they all fit one tree and
      NP-hard otherwise, and [Quartet MaxCut](/quartet-max-cut/) is a heuristic for the general case.
    entries:
      - consensus-tree
      - strict-consensus
      - majority-rule-consensus
      - adams-consensus
      - supertree
      - maximum-rooted-triplet-consistency
      - maximum-quartet-consistency
      - quartet-max-cut

  - title: Gene trees and species trees
    intro: >
      A gene has its own tree, and it need not be the tree of the species. Traced backward, gene copies merge
      by the [Kingman coalescent](/kingman-coalescent/), and inside a species tree by the
      [multispecies coalescent](/multispecies-coalescent/); [incomplete lineage sorting](/incomplete-lineage-sorting/)
      then makes gene trees disagree. [ASTRAL](/astral/) is statistically consistent under that model when it is given
      true gene trees.
      Duplications, losses and [horizontal transfer](/horizontal-gene-transfer/) are the other causes, handled
      by [reconciliation](/tree-reconciliation/).
    entries:
      - coalescent-theory
      - kingman-coalescent
      - incomplete-lineage-sorting
      - multispecies-coalescent
      - species-tree-estimation
      - astral
      - tree-reconciliation
      - lca-reconciliation
      - duplication-loss-model
      - horizontal-gene-transfer

  - title: Networks
    intro: >
      When lineages merge by hybridization, recombination or transfer, a tree is not enough. A
      [phylogenetic network](/phylogenetic-network/) is a rooted acyclic graph with reticulations;
      [inferring one](/phylogenetic-network-inference/) with the fewest reticulations is NP-hard but
      fixed-parameter tractable. Split networks, from [split decomposition](/split-decomposition/) or
      [NeighborNet](/neighbor-net/), draw conflict in the data without claiming a history. The
      [ancestral recombination graph](/ancestral-recombination-graph/) records the history of recombining
      sequences.
    entries:
      - phylogenetic-network
      - split-decomposition
      - split-network-construction
      - neighbor-net
      - phylogenetic-network-inference
      - ancestral-recombination-graph
      - ancestral-recombination-graph-inference
