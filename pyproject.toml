[project]
name = "hb"
version = "0.13.0"
description = "The builder of The Handbook of Algorithms: tamnd/algorithm as PDF, EPUB and LaTeX volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "Pillow>=10", "fonttools>=4.40"]

[project.scripts]
hb = "hb.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hb"]
